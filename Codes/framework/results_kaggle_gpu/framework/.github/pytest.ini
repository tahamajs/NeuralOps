[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --cov=framework/attentions
    --cov=framework/core
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --cov-fail-under=0
    -W default::DeprecationWarning
    -W ignore::UserWarning

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gpu: marks tests that require a GPU
    flash_attn: marks tests that require flash_attn
    integration: marks tests that are integration tests
    attention: marks tests that exercise attention modules
    zero_shot: marks tests that verify zero‑shot fidelity
    grad: marks tests that verify gradient flow