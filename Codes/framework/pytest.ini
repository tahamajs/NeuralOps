[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: marks tests that are slow
    gpu: marks tests that require a GPU
    flash_attn: marks tests that require flash_attn
    integration: marks integration tests
    attention: marks tests that exercise attention modules
    zero_shot: marks tests that verify zero-shot fidelity
    grad: marks tests that verify gradient flow
