# ============================================================================
# GLUE SVD Compression Framework - Complete Configuration
# ============================================================================

# ----------------------------------------------------------------------------
# Hardware Settings
# ----------------------------------------------------------------------------
hardware:
  device: "auto"                    # auto, mps, cuda, cpu
  force_cpu_for_svd: true           # Use CPU for SVD computation (recommended for MPS)
  enable_fp16: false                # Enable mixed precision (MPS has limited support)
  num_workers: 4                    # DataLoader workers
  pin_memory: false                 # Pin memory (MPS doesn't support)
  torch_compile: false              # Use torch.compile (experimental)

# ----------------------------------------------------------------------------
# Memory Management
# ----------------------------------------------------------------------------
memory:
  gradient_checkpointing: true      # Enable gradient checkpointing (saves memory)
  max_grad_norm: 1.0                # Gradient clipping norm
  empty_cache_every_step: false     # Clear cache after each step (slower but saves memory)
  mixed_precision: false            # Use mixed precision training

# ----------------------------------------------------------------------------
# Data Settings
# ----------------------------------------------------------------------------
data:
  local_glue_path: "/Users/tahamajs/Documents/uni/Project/datasets/glue"
  max_seq_length: 128
  max_train_samples: null           # Limit training samples (null = all)
  max_val_samples: null             # Limit validation samples
  num_proc: 4                       # Number of processes for dataset mapping
  remove_columns: ["label"]         # Columns to remove after tokenization
  streaming: false                  # Use streaming datasets
  
  # Dataset split mappings
  split_mapping:
    train: "train"
    validation: "validation"
    test: "test"
    validation_matched: "validation_matched"
    validation_mismatched: "validation_mismatched"

# ----------------------------------------------------------------------------
# GLUE Tasks
# ----------------------------------------------------------------------------
glue_tasks:
  - name: "cola"
    type: "classification"
    num_labels: 2
    metric: "matthews_correlation"
    text_keys: ["sentence"]
    regression: false
    skip: false
    
  - name: "sst2"
    type: "classification"
    num_labels: 2
    metric: "accuracy"
    text_keys: ["sentence"]
    regression: false
    skip: false
    
  - name: "mrpc"
    type: "classification"
    num_labels: 2
    metric: "f1"
    text_keys: ["sentence1", "sentence2"]
    regression: false
    skip: false
    
  - name: "qqp"
    type: "classification"
    num_labels: 2
    metric: "f1"
    text_keys: ["question1", "question2"]
    regression: false
    skip: false
    
  - name: "qnli"
    type: "classification"
    num_labels: 2
    metric: "accuracy"
    text_keys: ["question", "sentence"]
    regression: false
    skip: false
    
  - name: "rte"
    type: "classification"
    num_labels: 2
    metric: "accuracy"
    text_keys: ["sentence1", "sentence2"]
    regression: false
    skip: false
    
  - name: "mnli"
    type: "classification"
    num_labels: 3
    metric: "accuracy"
    text_keys: ["premise", "hypothesis"]
    regression: false
    skip: false
    
  - name: "stsb"
    type: "regression"
    num_labels: 1
    metric: "pearson_spearman"
    text_keys: ["sentence1", "sentence2"]
    regression: true
    skip: false
    
  - name: "wnli"
    type: "classification"
    num_labels: 2
    metric: "accuracy"
    text_keys: ["sentence1", "sentence2"]
    regression: false
    skip: true                    # Skip because very small dataset

# ----------------------------------------------------------------------------
# Model Settings
# ----------------------------------------------------------------------------
model:
  name: "bert-base-uncased"          # Also: roberta-base, distilbert-base-uncased, albert-base-v2
  num_labels: 2                      # Will be overridden per task
  attention_type: "svd"              # svd, full, linformer, nystrom, performer
  rank: 128                          # Compression rank (if attention_type=svd)
  cache_dir: "./cache"
  use_fast_tokenizer: true
  trust_remote_code: false
  
  # Model variants to test (for sweeping)
  variants:
    - "bert-base-uncased"
    - "roberta-base"
    - "distilbert-base-uncased"
    - "albert-base-v2"

# ----------------------------------------------------------------------------
# Training Settings
# ----------------------------------------------------------------------------
training:
  batch_size: 16
  eval_batch_size: 32
  epochs: 3
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  warmup_steps: 0                    # If > 0, overrides warmup_ratio
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  lr_scheduler_type: "linear"        # linear, cosine, constant, polynomial
  optimizer: "adamw"                 # adamw, lion, sgd
  
  # Early stopping
  early_stopping_patience: null      # Number of epochs with no improvement
  early_stopping_threshold: 0.001    # Minimum improvement to reset patience
  
  # Checkpointing
  save_strategy: "epoch"             # epoch, steps, no
  save_steps: 500                    # If save_strategy = "steps"
  save_total_limit: 2                # Keep only last N checkpoints
  save_only_model: true              # Save only model weights (not optimizer)
  save_safetensors: true             # Use safetensors format
  
  # Evaluation
  eval_strategy: "epoch"             # epoch, steps, no
  eval_steps: 500                    # If eval_strategy = "steps"
  eval_delay: 0                      # Epochs to wait before first evaluation
  metric_for_best_model: "accuracy"  # auto-detected per task
  greater_is_better: true

# ----------------------------------------------------------------------------
# LoRA / Parameter-Efficient Fine-Tuning
# ----------------------------------------------------------------------------
lora:
  enabled: false
  r: 8                              # Rank
  alpha: 16                         # Scaling factor
  dropout: 0.1                      # Dropout rate
  target_modules: ["query", "key", "value", "dense"]
  bias: "none"                      # none, all, lora_only

# ----------------------------------------------------------------------------
# DoRA (Weight-Decomposed Low-Rank Adaptation)
# ----------------------------------------------------------------------------
dora:
  enabled: false
  r: 8
  alpha: 16
  dropout: 0.1

# ----------------------------------------------------------------------------
# R-Drop Regularization
# ----------------------------------------------------------------------------
rdrop:
  enabled: false
  alpha: 5.0                        # KL divergence weight

# ----------------------------------------------------------------------------
# R3F (Randomized Reversible Regularization)
# ----------------------------------------------------------------------------
r3f:
  enabled: false
  epsilon: 1e-5                     # Noise scale

# ----------------------------------------------------------------------------
# Mixout Regularization
# ----------------------------------------------------------------------------
mixout:
  enabled: false
  p: 0.5                            # Mixout probability

# ----------------------------------------------------------------------------
# LLRD (Layer-wise Learning Rate Decay)
# ----------------------------------------------------------------------------
llrd:
  enabled: false
  decay: 0.95                       # Decay factor per layer
  layerwise_lr: true

# ----------------------------------------------------------------------------
# Cross-Attention Settings
# ----------------------------------------------------------------------------
cross_attention:
  enabled: false
  use_cross_attn: false
  cross_attn_layers: [6, 8, 10]    # Layers where cross-attention is added

# ----------------------------------------------------------------------------
# SVD Compression Methods
# ----------------------------------------------------------------------------
compression_methods:
  enabled: true
  methods:
    - name: "standard_svd"
      description: "Standard SVD compression"
      threshold: 0.90
      min_rank: 4
      
    - name: "head_pruning"
      description: "Prune attention heads"
      threshold: 0.85
      min_rank: 8
      
    - name: "layer_skipping"
      description: "Skip less important layers"
      threshold: 0.80
      min_rank: 16
      
    - name: "quantized_svd"
      description: "Quantized SVD factors"
      threshold: 0.75
      min_rank: 2
      bits: 8
      
    - name: "blockwise_lowrank"
      description: "Block-wise low-rank approximation"
      threshold: 0.85
      min_rank: 8
      block_size: 4
      
    - name: "randomized_svd"
      description: "Randomized SVD for speed"
      threshold: 0.90
      min_rank: 8
      n_iters: 2
      
    - name: "tensor_train_decomp"
      description: "Tensor Train decomposition"
      threshold: 0.88
      min_rank: 4
      
    - name: "cp_decomposition"
      description: "CANDECOMP/PARAFAC decomposition"
      threshold: 0.85
      min_rank: 6
      
    - name: "dynamic_token_pruning"
      description: "Dynamic token pruning"
      threshold: 0.80
      min_rank: 8
      
    - name: "spectral_clustering_prune"
      description: "Spectral clustering-based pruning"
      threshold: 0.85
      min_rank: 4
      
    - name: "hash_quantization"
      description: "Hash-based quantization"
      threshold: 0.70
      min_rank: 8
      
    - name: "moe_sparsification"
      description: "Mixture-of-Experts sparsification"
      threshold: 0.80
      min_rank: 4
      
    - name: "hybrid_advanced"
      description: "Hybrid of multiple techniques"
      threshold: 0.85
      min_rank: 8

  # Global compression settings
  energy_threshold_base: 0.90
  min_rank_global: 4
  max_rank_global: 128
  
  # Method-specific overrides
  method_overrides:
    standard_svd:
      threshold: 0.92
    randomized_svd:
      n_iters: 3

# ----------------------------------------------------------------------------
# Post-Training Compression
# ----------------------------------------------------------------------------
post_compression:
  enabled: false
  methods:
    - name: "slicegpt"
      sparsity: 0.3
    - name: "sparsegpt"
      sparsity: 0.5
    - name: "flap"
      sparsity: 0.2
    - name: "oats"
      sparsity: 0.3
      rank_ratio: 0.2
    - name: "mamba_shedder"
      sparsity: 0.2
    - name: "come"
      sparsity: 0.3
  calibration_samples: 128

# ----------------------------------------------------------------------------
# Experiment Settings
# ----------------------------------------------------------------------------
experiment:
  name: "svd_compression_experiment"    # Run name prefix
  seed: 42
  num_seeds: 1                          # Multiple seeds for robust results
  base_seed: 42
  
  # Filter tasks/models/ranks to test
  limit_tasks: null                     # e.g., ["cola", "mrpc"]
  limit_models: null                    # e.g., ["bert-base-uncased"]
  limit_ranks: null                     # e.g., [32, 64, 128]
  limit_samples_per_task: null          # For debugging (e.g., 100)
  
  # Output directories
  output_dir: "results"
  plots_dir: "results/plots"
  log_dir: "results/logs"
  cache_dir: "./cache"
  
  # Experiment modes
  mode: "full"                          # full, quick, debug, benchmark
  debug: false
  profile: false                        # Enable PyTorch profiler
  wandb:
    enabled: false
    project: "svd-compression"
    entity: null
    run_name: null

# ----------------------------------------------------------------------------
# Logging & Visualization
# ----------------------------------------------------------------------------
logging:
  level: "INFO"                         # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  file: "experiment.log"
  
  # Step logging
  logging_steps: 50
  log_params: true
  log_gradients: false
  
  # Progress bar
  progress_bar: true
  disable_tqdm: false

# ----------------------------------------------------------------------------
# Visualization Settings
# ----------------------------------------------------------------------------
visualization:
  enabled: true
  save_plots: true
  interactive: false
  
  # Which visualizations to generate
  visualizations:
    - "attention_heatmap"
    - "entropy"
    - "svd_spectrum"
    - "training_curves"
    - "confusion_matrix"
    - "rank_comparison"
    - "subspace_alignment"
    - "attention_difference"
    - "layer_analysis_grid"
    - "model_comparison"
    - "efficiency_plot"
    
  # Plot settings
  dpi: 150
  figsize: [12, 8]
  colormap: "viridis"
  save_format: "png"                    # png, pdf, svg, both
  
  # HTML report
  generate_report: true
  report_template: "default"

# ----------------------------------------------------------------------------
# Profiling & Benchmarking
# ----------------------------------------------------------------------------
profiling:
  enabled: false
  profile_steps: 100                    # Number of steps to profile
  profile_memory: true
  profile_time: true
  profile_layers: true
  
  benchmark:
    runs: 5                             # Number of benchmark runs
    warmup: 2                           # Warmup runs
    text_lengths: [16, 32, 64, 128, 256]
    batch_sizes: [1, 4, 8, 16, 32]

# ----------------------------------------------------------------------------
# Advanced / Experimental
# ----------------------------------------------------------------------------
advanced:
  use_kernel: false                     # Use custom CUDA kernels
  compile_model: false                  # torch.compile
  use_flash_attention: false            # Use FlashAttention
  use_xformers: false                   # Use xFormers
  
  # SVD specific
  svd_compute_uv: true
  svd_driver: "auto"                    # auto, gesvd, gesvdj, gesvda
  
  # Distributed training
  distributed:
    enabled: false
    backend: "nccl"
    world_size: 1

# ----------------------------------------------------------------------------
# Debug / Development Settings
# ----------------------------------------------------------------------------
debug:
  enabled: false
  trace_model: false
  trace_attention: false
  print_shapes: false
  verify_gradients: false
  check_nan: true
  break_on_nan: false