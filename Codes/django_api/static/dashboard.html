<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Efficient Transformer Toolkit – Dashboard</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; height: 100vh; background: #1e1e2f; color: #ccc; }
    .login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #1e1e2f; display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .login-box {
      background: #2d2d44; padding: 2rem; border-radius: 8px; width: 360px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .login-box h2 { color: #fff; margin-bottom: 1.5rem; text-align: center; }
    .login-box input { width: 100%; padding: 0.7rem; margin-bottom: 1rem; border-radius: 4px; border: 1px solid #555; background: #3b3b55; color: #ddd; }
    .login-box button { width: 100%; padding: 0.7rem; background: #7baeff; border: none; border-radius: 4px; color: #fff; font-weight: bold; cursor: pointer; }
    .login-box .error { color: #ff6b6b; font-size: 0.85rem; margin-bottom: 0.5rem; }
    .app { display: flex; height: 100vh; }
    .sidebar { width: 340px; background: #2d2d44; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.8rem; }
    .sidebar h2 { color: #fff; margin-bottom: 0.3rem; font-size: 1.3rem; display: flex; justify-content: space-between; align-items: center; }
    .sidebar label { font-size: 0.85rem; color: #aaa; margin-bottom: 2px; display: block; }
    select, input { width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid #555; background: #3b3b55; color: #ddd; font-size: 0.9rem; }
    select:focus, input:focus { border-color: #7baeff; outline: none; }
    .btn { padding: 0.6rem 1rem; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: #fff; }
    .btn-start { background: #28a745; }
    .btn-stop { background: #dc3545; }
    .btn-update { background: #ffc107; color: #000; }
    .btn-logout { background: #6c757d; font-size: 0.8rem; padding: 0.3rem 0.6rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .top-bar { background: #2d2d44; padding: 0.8rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
    .progress-container { flex: 1; background: #444; border-radius: 10px; height: 20px; margin: 0 1rem; position: relative; }
    .progress-bar { height: 100%; background: #28a745; border-radius: 10px; width: 0%; transition: width 0.3s; }
    .progress-text { position: absolute; left: 50%; transform: translateX(-50%); color: #fff; font-size: 0.75rem; line-height: 20px; white-space: nowrap; }
    .gpu-info { display: flex; gap: 1rem; align-items: center; font-size: 0.85rem; }
    .panels { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 0.8rem; padding: 0.8rem; overflow-y: auto; }
    .panel { background: #2d2d44; border-radius: 6px; padding: 1rem; display: flex; flex-direction: column; }
    .panel h3 { margin-bottom: 0.6rem; font-size: 1rem; color: #fff; }
    .log-viewer { grid-column: span 2; overflow-y: auto; background: #1a1a2e; color: #0f0; font-family: monospace; font-size: 0.8rem; padding: 0.5rem; height: 200px; white-space: pre-wrap; }
    .job-list { font-size: 0.8rem; max-height: 200px; overflow-y: auto; background: #1a1a2e; padding: 0.3rem; border-radius: 4px; margin-top: 0.5rem; }
    .job-item { padding: 0.3rem 0.4rem; cursor: pointer; border-bottom: 1px solid #444; display: flex; justify-content: space-between; }
    .job-item:hover { background: #3b3b60; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    .queued { background: yellow; }
    .running { background: cyan; }
    .completed { background: lime; }
    .failed { background: red; }
    .stopped { background: orange; }
    .toast { position: fixed; top: 1rem; right: 1rem; padding: 0.8rem 1.2rem; border-radius: 6px; color: #fff; z-index: 2000; animation: fadeIn 0.3s; }
    .toast-success { background: #28a745; }
    .toast-error { background: #dc3545; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<!-- Login overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>🔐 Login</h2>
    <div class="error" id="loginError"></div>
    <input type="text" id="username" placeholder="Username" autocomplete="username">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- Main app (hidden until login) -->
<div class="app" id="app" style="display:none;">
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>🚀 Experiment Config
      <button class="btn btn-logout" onclick="doLogout()">Logout</button>
    </h2>
    <label>Model</label>
    <select id="modelSelect"></select>
    <label>Task</label>
    <select id="taskSelect"></select>
    <label>Attention Type</label>
    <select id="attentionSelect"></select>
    <label>Training Method</label>
    <select id="methodSelect">
      <option value="baseline">Baseline</option>
      <option value="lora">LoRA</option>
      <option value="rdrop">RDrop</option>
      <option value="r3f">R3F</option>
    </select>
    <label>Epochs</label>
    <input type="number" id="epochs" value="3" min="1" max="100">
    <label>Batch Size</label>
    <input type="number" id="batchSize" value="16" min="1" max="256">
    <label>Learning Rate</label>
    <input type="number" id="learningRate" value="2e-5" step="1e-6" min="1e-8" max="1">
    <label>Compression Rank</label>
    <input type="number" id="rank" value="64" min="1" max="512">
    <label>Max Seq Length</label>
    <input type="number" id="maxLen" value="128" min="8" max="1024">
    <div style="display:flex; gap:0.5rem;">
      <button class="btn btn-start" id="startBtn">▶ Start Training</button>
      <button class="btn btn-stop" id="stopBtn" disabled>⏹ Stop</button>
    </div>
    <div style="display:flex; gap:0.5rem;">
      <button class="btn btn-update" id="updateBtn" disabled>✎ Update Config</button>
    </div>
    <div class="job-list" id="jobList"><div style="color:#aaa">Loading jobs...</div></div>
  </div>

  <!-- Main area -->
  <div class="main">
    <div class="top-bar">
      <span id="jobStatus" style="font-weight:bold;">⚪ Idle</span>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">0%</div>
      </div>
      <div class="gpu-info" id="gpuInfo">GPU: N/A</div>
    </div>
    <div class="panels">
      <div class="panel"><h3>Training Loss</h3><div id="lossPlot" style="flex:1;"></div></div>
      <div class="panel"><h3>Evaluation Metrics</h3><div id="evalPlot" style="flex:1;"></div></div>
      <div class="panel log-viewer"><h3>Logs</h3><div id="logContent" style="flex:1;"></div></div>
      <div class="panel"><h3>System</h3><div id="systemInfo">CPU: -- | Mem: --</div></div>
    </div>
  </div>
</div>

<script>
// ── Auth & State ───────────────────────────────────────────
const API_BASE = 'http://127.0.0.1:8000/api';
const WS_BASE = 'ws://127.0.0.1:8000/ws/jobs';
let authToken = localStorage.getItem('authToken');
let currentJobId = null;
let ws = null;
let plotData = {lossSteps:[], losses:[], evalSteps:[], evalLosses:[]};

// ── Toast notifications ────────────────────────────────────
function showToast(msg, type='success') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ── Auth functions ─────────────────────────────────────────
async function doLogin() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  if (!username || !password) {
    document.getElementById('loginError').textContent = 'Username and password required';
    return;
  }
  try {
    const resp = await fetch(`${API_BASE}/auth/login/`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    if (!resp.ok) throw new Error('Invalid credentials');
    const data = await resp.json();
    authToken = data.token || data.key;  // DRF Token or SimpleJWT
    localStorage.setItem('authToken', authToken);
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    initApp();
    showToast('Logged in successfully');
  } catch(e) {
    document.getElementById('loginError').textContent = e.message;
  }
}

function doLogout() {
  localStorage.removeItem('authToken');
  authToken = null;
  if (ws) ws.close();
  location.reload();
}

function authHeaders() {
  return authToken ? {'Authorization': `Token ${authToken}`} : {};
}

// ── Check login state on load ──────────────────────────────
if (authToken) {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  initApp();
} else {
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

// ── API helpers ────────────────────────────────────────────
async function apiGet(url) {
  const res = await fetch(`${API_BASE}${url}`, {headers: authHeaders()});
  if (res.status === 401) { doLogout(); return null; }
  if (!res.ok) throw new Error(`API error: ${res.status}`);
  return res.json();
}

async function apiPost(url, body={}) {
  const res = await fetch(`${API_BASE}${url}`, {
    method: 'POST',
    headers: {...authHeaders(), 'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  if (res.status === 401) { doLogout(); return null; }
  if (!res.ok) throw new Error(`API error: ${res.status}`);
  return res.json();
}

// ── Load config options ────────────────────────────────────
async function loadConfigOptions() {
  try {
    const [models, tasks, attentions] = await Promise.all([
      apiGet('/config/models/'), apiGet('/config/tasks/'), apiGet('/config/attentions/')
    ]);
    if (models) populateSelect('modelSelect', models.models, 'distilbert-base-uncased');
    if (tasks) populateSelect('taskSelect', tasks.tasks, 'mrpc');
    if (attentions) populateSelect('attentionSelect', attentions.attentions, 'full');
  } catch(e) { console.error('Config load error:', e); }
}

function populateSelect(id, options, defaultVal) {
  const sel = document.getElementById(id);
  sel.innerHTML = '';
  options.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o; opt.text = o;
    sel.appendChild(opt);
  });
  if (defaultVal && options.includes(defaultVal)) sel.value = defaultVal;
}

// ── Job list ───────────────────────────────────────────────
async function loadJobList() {
  try {
    const data = await apiGet('/experiments/');
    if (!data) return;
    const container = document.getElementById('jobList');
    if (!data.length) { container.innerHTML = '<div style="color:#aaa">No jobs yet</div>'; return; }
    container.innerHTML = data.slice(0,20).map(j => `
      <div class="job-item" onclick="selectJob('${j.id}')">
        <span><span class="status-dot ${j.status}"></span>${j.name || j.id.slice(0,8)}</span>
        <span style="color:#888;font-size:0.75rem;">${j.status}</span>
      </div>
    `).join('');
  } catch(e) {}
}

// ── Job management ─────────────────────────────────────────
function getConfig() {
  return {
    model_name: document.getElementById('modelSelect').value,
    task_name: document.getElementById('taskSelect').value,
    attention_type: document.getElementById('attentionSelect').value,
    method: document.getElementById('methodSelect').value,
    epochs: parseInt(document.getElementById('epochs').value),
    batch_size: parseInt(document.getElementById('batchSize').value),
    learning_rate: parseFloat(document.getElementById('learningRate').value),
    compression_rank: parseInt(document.getElementById('rank').value),
    max_seq_length: parseInt(document.getElementById('maxLen').value),
  };
}

async function startTraining() {
  try {
    const config = getConfig();
    const data = await apiPost('/train/', config);
    if (data) { selectJob(data.id); showToast('Job started!'); }
  } catch(e) { showToast('Failed to start job', 'error'); }
}

async function stopTraining() {
  if (!currentJobId) return;
  try {
    await apiPost(`/jobs/${currentJobId}/stop/`);
    showToast('Job stopped');
  } catch(e) { showToast('Failed to stop job', 'error'); }
}

async function updateConfig() {
  if (!currentJobId) return;
  try {
    const config = getConfig();
    await fetch(`${API_BASE}/jobs/${currentJobId}/config/`, {
      method: 'PATCH', headers: {...authHeaders(), 'Content-Type':'application/json'},
      body: JSON.stringify(config)
    });
    showToast('Config updated');
  } catch(e) { showToast('Failed to update config', 'error'); }
}

async function selectJob(jobId) {
  currentJobId = jobId;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
  document.getElementById('updateBtn').disabled = false;
  if (ws) ws.close();
  ws = new WebSocket(`${WS_BASE}/${jobId}/`);
  ws.onmessage = handleWSMessage;
  ws.onerror = () => console.log('WS error');
  try {
    const job = await apiGet(`/jobs/${jobId}/`);
    if (job) {
      document.getElementById('jobStatus').innerHTML = `<span class="status-dot ${job.status}"></span>${job.status}`;
      document.getElementById('logContent').innerText = job.logs || '';
    }
  } catch(e) {}
}

function handleWSMessage(event) {
  const msg = JSON.parse(event.data);
  switch (msg.type) {
    case 'status':
      document.getElementById('jobStatus').innerHTML = `<span class="status-dot ${msg.status}"></span>${msg.status}`;
      if (['completed','stopped','failed'].includes(msg.status)) {
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('updateBtn').disabled = true;
        if (ws) { ws.close(); ws = null; }
        loadJobList();
      }
      break;
    case 'log':
      const logEl = document.getElementById('logContent');
      logEl.innerText += msg.data + '\n';
      logEl.scrollTop = logEl.scrollHeight;
      break;
    case 'metrics':
      if (msg.data.loss !== undefined) {
        plotData.lossSteps.push(plotData.lossSteps.length + 1);
        plotData.losses.push(msg.data.loss);
      }
      if (msg.data.eval_loss !== undefined) {
        plotData.evalSteps.push(plotData.evalSteps.length + 1);
        plotData.evalLosses.push(msg.data.eval_loss);
      }
      Plotly.newPlot('lossPlot', [{
        x: plotData.lossSteps, y: plotData.losses, type: 'scatter', mode: 'lines+markers', name: 'Loss'
      }], {margin: {t:10}, paper_bgcolor:'#2d2d44', plot_bgcolor:'#2d2d44', font:{color:'#ccc'}});
      Plotly.newPlot('evalPlot', [{
        x: plotData.evalSteps, y: plotData.evalLosses, type: 'scatter', mode: 'lines+markers', name: 'Eval Loss'
      }], {margin: {t:10}, paper_bgcolor:'#2d2d44', plot_bgcolor:'#2d2d44', font:{color:'#ccc'}});
      break;
    case 'progress':
      const pct = Math.min(100, Math.round(msg.progress || 0));
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressText').innerText = pct + '% (Remaining: ' + formatTime(msg.eta_seconds) + ')';
      break;
    case 'gpu':
      document.getElementById('gpuInfo').innerText = `GPU Memory: ${(msg.memory_used_gb||0).toFixed(2)} GB`;
      break;
  }
}

function formatTime(seconds) {
  if (!seconds || seconds < 0) return '--';
  const h = Math.floor(seconds/3600);
  const m = Math.floor((seconds%3600)/60);
  const s = Math.round(seconds%60);
  return `${h}h ${m}m ${s}s`;
}

// ── System polling ─────────────────────────────────────────
async function pollSystem() {
  try {
    const sys = await apiGet('/system/status/');
    if (sys) document.getElementById('systemInfo').innerText = `CPU: ${sys.cpu}% | Mem: ${sys.memory}%`;
    const gpu = await apiGet('/system/gpu/');
    if (gpu?.cuda_available) {
      document.getElementById('gpuInfo').innerText = `GPU: ${(gpu.memory_allocated||0).toFixed(2)} / ${gpu.memory_total} GB`;
    }
  } catch(e) {}
}

// ── Event listeners ────────────────────────────────────────
document.getElementById('startBtn').addEventListener('click', startTraining);
document.getElementById('stopBtn').addEventListener('click', stopTraining);
document.getElementById('updateBtn').addEventListener('click', updateConfig);
document.getElementById('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});

// ── Init ───────────────────────────────────────────────────
async function initApp() {
  await loadConfigOptions();
  await loadJobList();
  setInterval(loadJobList, 10000);
  setInterval(pollSystem, 3000);
  pollSystem();
}
</script>
</body>
</html>
