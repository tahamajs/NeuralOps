<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Efficient Transformer Toolkit – Dashboard</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: #1e1e2f; color: #ccc; }
    .sidebar { width: 320px; background: #2d2d44; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.8rem; }
    .sidebar h2 { color: #fff; margin-bottom: 0.5rem; font-size: 1.3rem; }
    .sidebar label { font-size: 0.85rem; color: #aaa; margin-bottom: 2px; display: block; }
    select, input { width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid #555; background: #3b3b55; color: #ddd; font-size: 0.9rem; }
    select:focus, input:focus { border-color: #7baeff; outline: none; }
    .btn { padding: 0.6rem 1rem; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: #fff; }
    .btn-start { background: #28a745; }
    .btn-stop { background: #dc3545; }
    .btn-update { background: #ffc107; color: #000; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .top-bar { background: #2d2d44; padding: 0.8rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
    .progress-container { flex: 1; background: #444; border-radius: 10px; height: 20px; margin: 0 1rem; position: relative; }
    .progress-bar { height: 100%; background: #28a745; border-radius: 10px; width: 0%; transition: width 0.3s; }
    .progress-text { position: absolute; left: 50%; transform: translateX(-50%); color: #fff; font-size: 0.75rem; line-height: 20px; }
    .gpu-info { display: flex; gap: 1rem; align-items: center; font-size: 0.85rem; }
    .panels { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 0.8rem; padding: 0.8rem; overflow-y: auto; }
    .panel { background: #2d2d44; border-radius: 6px; padding: 1rem; display: flex; flex-direction: column; }
    .panel h3 { margin-bottom: 0.6rem; font-size: 1rem; color: #fff; }
    .log-viewer { grid-column: span 2; overflow-y: auto; background: #1a1a2e; color: #0f0; font-family: monospace; font-size: 0.8rem; padding: 0.5rem; height: 200px; white-space: pre-wrap; }
    .job-list { font-size: 0.8rem; max-height: 150px; overflow-y: auto; background: #1a1a2e; padding: 0.3rem; border-radius: 4px; margin-top: 0.5rem; }
    .job-item { padding: 0.2rem 0.4rem; cursor: pointer; border-bottom: 1px solid #444; }
    .job-item:hover { background: #3b3b60; }
    .status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    .queued { background: yellow; }
    .running { background: cyan; }
    .completed { background: lime; }
    .failed { background: red; }
    .stopped { background: orange; }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>🚀 Experiment Config</h2>

  <label>Model</label>
  <select id="modelSelect"></select>

  <label>Task</label>
  <select id="taskSelect"></select>

  <label>Attention Type</label>
  <select id="attentionSelect"></select>

  <label>Training Method</label>
  <select id="methodSelect">
    <option value="baseline">Baseline</option>
    <option value="lora">LoRA</option>
    <option value="rdrop">RDrop</option>
    <option value="r3f">R3F</option>
  </select>

  <label>Epochs</label>
  <input type="number" id="epochs" value="3" min="1" max="100">

  <label>Batch Size</label>
  <input type="number" id="batchSize" value="16" min="1" max="256">

  <label>Learning Rate</label>
  <input type="number" id="learningRate" value="2e-5" step="1e-6" min="1e-8" max="1">

  <label>Compression Rank</label>
  <input type="number" id="rank" value="64" min="1" max="512">

  <label>Max Seq Length</label>
  <input type="number" id="maxLen" value="128" min="8" max="1024">

  <div style="display:flex; gap:0.5rem;">
    <button class="btn btn-start" id="startBtn">▶ Start Training</button>
    <button class="btn btn-stop" id="stopBtn" disabled>⏹ Stop</button>
  </div>

  <div style="display:flex; gap:0.5rem;">
    <button class="btn btn-update" id="updateBtn" disabled>✎ Update Config</button>
  </div>

  <div class="job-list" id="jobList">
    <div style="color:#aaa">No jobs yet</div>
  </div>
</div>

<!-- Main area -->
<div class="main">
  <div class="top-bar">
    <span id="jobStatus" style="font-weight:bold;">⚪ Idle</span>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
      <div class="progress-text" id="progressText">0%</div>
    </div>
    <div class="gpu-info" id="gpuInfo">
      GPU: N/A
    </div>
  </div>

  <div class="panels">
    <div class="panel" id="lossPlotPanel"><h3>Training Loss</h3><div id="lossPlot" style="flex:1;"></div></div>
    <div class="panel" id="evalPlotPanel"><h3>Evaluation Metrics</h3><div id="evalPlot" style="flex:1;"></div></div>
    <div class="panel log-viewer" id="logPanel"><h3>Logs</h3><div id="logContent" style="flex:1;"></div></div>
    <div class="panel" id="systemPanel" style="grid-column: span 1;">
      <h3>System</h3>
      <div id="systemInfo">CPU: -- | Mem: --</div>
    </div>
  </div>
</div>

<script>
// ────────── Global state ──────────
const API_BASE = 'http://127.0.0.1:8000/api';
const WS_BASE = 'ws://127.0.0.1:8000/ws/jobs';
let currentJobId = null;
let ws = null;
let plotData = {lossSteps:[], losses:[], evalSteps:[], evalLosses:[]};

// ────────── Load config options from API ──────────
async function loadConfigOptions() {
  const [modelsRes, tasksRes, attRes] = await Promise.all([
    fetch(`${API_BASE}/config/models/`),
    fetch(`${API_BASE}/config/tasks/`),
    fetch(`${API_BASE}/config/attentions/`)
  ]);
  const models = await modelsRes.json();
  const tasks = await tasksRes.json();
  const attentions = await attRes.json();
  populateSelect('modelSelect', models.models, 'distilbert-base-uncased');
  populateSelect('taskSelect', tasks.tasks, 'mrpc');
  populateSelect('attentionSelect', attentions.attentions, 'full');
}
function populateSelect(id, options, defaultVal) {
  const sel = document.getElementById(id);
  sel.innerHTML = '';
  options.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o; opt.text = o;
    sel.appendChild(opt);
  });
  if (defaultVal) sel.value = defaultVal;
}

// ────────── Job management ──────────
function getConfig() {
  return {
    model_name: document.getElementById('modelSelect').value,
    task_name: document.getElementById('taskSelect').value,
    attention_type: document.getElementById('attentionSelect').value,
    method: document.getElementById('methodSelect').value,
    epochs: parseInt(document.getElementById('epochs').value),
    batch_size: parseInt(document.getElementById('batchSize').value),
    learning_rate: parseFloat(document.getElementById('learningRate').value),
    compression_rank: parseInt(document.getElementById('rank').value),
    max_seq_length: parseInt(document.getElementById('maxLen').value),
  };
}

async function startTraining() {
  const config = getConfig();
  const resp = await fetch(`${API_BASE}/train/`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(config)
  });
  const data = await resp.json();
  selectJob(data.id);
}

async function stopTraining() {
  if (!currentJobId) return;
  await fetch(`${API_BASE}/jobs/${currentJobId}/stop/`, {method:'POST'});
}

async function updateConfig() {
  if (!currentJobId) return;
  const config = getConfig();
  await fetch(`${API_BASE}/jobs/${currentJobId}/config/`, {
    method: 'PATCH', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(config)
  });
  alert('Config updated.');
}

async function selectJob(jobId) {
  currentJobId = jobId;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
  document.getElementById('updateBtn').disabled = false;
  if (ws) ws.close();
  ws = new WebSocket(`${WS_BASE}/${jobId}/`);
  ws.onmessage = handleWSMessage;
  const resp = await fetch(`${API_BASE}/jobs/${jobId}/`);
  const job = await resp.json();
  document.getElementById('jobStatus').innerHTML = `⚫ ${job.status}`;
  document.getElementById('logContent').innerText = job.logs || '';
}

function handleWSMessage(event) {
  const msg = JSON.parse(event.data);
  switch (msg.type) {
    case 'status':
      document.getElementById('jobStatus').innerHTML = `⚫ ${msg.status}`;
      if (['completed','stopped','failed'].includes(msg.status)) {
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('updateBtn').disabled = true;
        ws.close();
        ws = null;
      }
      break;
    case 'log':
      const logEl = document.getElementById('logContent');
      logEl.innerText += msg.data + '\n';
      logEl.scrollTop = logEl.scrollHeight;
      break;
    case 'metrics':
      if (msg.data.loss !== undefined) {
        plotData.lossSteps.push(plotData.lossSteps.length + 1);
        plotData.losses.push(msg.data.loss);
      }
      if (msg.data.eval_loss !== undefined) {
        plotData.evalSteps.push(plotData.evalSteps.length + 1);
        plotData.evalLosses.push(msg.data.eval_loss);
      }
      Plotly.newPlot('lossPlot', [{
        x: plotData.lossSteps, y: plotData.losses, type: 'scatter', mode: 'lines+markers', name: 'Loss'
      }], {margin: {t:10}, paper_bgcolor:'#2d2d44', plot_bgcolor:'#2d2d44', font:{color:'#ccc'}});
      Plotly.newPlot('evalPlot', [{
        x: plotData.evalSteps, y: plotData.evalLosses, type: 'scatter', mode: 'lines+markers', name: 'Eval Loss'
      }], {margin: {t:10}, paper_bgcolor:'#2d2d44', plot_bgcolor:'#2d2d44', font:{color:'#ccc'}});
      break;
    case 'progress':
      document.getElementById('progressBar').style.width = msg.progress + '%';
      document.getElementById('progressText').innerText = msg.progress + '% (Remaining: ' + formatTime(msg.eta_seconds) + ')';
      break;
    case 'gpu':
      document.getElementById('gpuInfo').innerText = `GPU Memory: ${msg.memory_used_gb.toFixed(2)} GB`;
      break;
  }
}

function formatTime(seconds) {
  const h = Math.floor(seconds/3600);
  const m = Math.floor((seconds%3600)/60);
  const s = seconds%60;
  return `${h}h ${m}m ${s}s`;
}

document.getElementById('startBtn').addEventListener('click', startTraining);
document.getElementById('stopBtn').addEventListener('click', stopTraining);
document.getElementById('updateBtn').addEventListener('click', updateConfig);

loadConfigOptions();
// Refresh system info periodically
setInterval(async () => {
  try {
    const sysResp = await fetch(`${API_BASE}/system/status/`);
    const sys = await sysResp.json();
    document.getElementById('systemInfo').innerText = `CPU: ${sys.cpu}% | Mem: ${sys.memory}%`;
    const gpuResp = await fetch(`${API_BASE}/system/gpu/`);
    const gpu = await gpuResp.json();
    if (gpu.cuda_available) {
      document.getElementById('gpuInfo').innerText = `GPU: ${gpu.memory_allocated?.toFixed(2) || 0} GB / ${gpu.memory_total} GB`;
    }
  } catch(e) {}
}, 3000);
</script>
</body>
</html>
