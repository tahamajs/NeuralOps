{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – Transformer Pro Toolkit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0d1326 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .card {
            background: rgba(20, 28, 40, 0.8);
            backdrop-filter: blur(14px);
            border-radius: 32px;
            padding: 2rem 1.8rem;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        h2 {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1.8rem;
        }
        .input-group {
            position: relative;
            margin-bottom: 1.2rem;
        }
        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1rem;
            pointer-events: none;
        }
        input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: #0f172a;
            border: 1px solid #2d3a5e;
            border-radius: 40px;
            color: #f1f5f9;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .password-strength {
            margin-top: 0.25rem;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .strength-bar {
            flex: 1;
            height: 4px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
        }
        .strength-fill {
            width: 0%;
            height: 100%;
            transition: width 0.2s;
        }
        .strength-text {
            font-size: 0.7rem;
            color: #94a3b8;
        }
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #64748b;
            z-index: 2;
        }
        button {
            width: 100%;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 0.5rem;
        }
        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 12px rgba(59,130,246,0.4);
        }
        button:disabled {
            opacity: 0.6;
            transform: none;
        }
        .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error {
            background: rgba(239,68,68,0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 8px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            text-align: center;
            margin-bottom: 1rem;
            display: none;
        }
        .footer-link {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .footer-link a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 500;
        }
        .inline-error {
            font-size: 0.7rem;
            color: #f87171;
            margin-top: 0.25rem;
            margin-left: 12px;
            display: none;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>📝 Create Account</h2>
    <div id="error" class="error"></div>

    <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Username" autocomplete="username">
    </div>
    <div id="usernameError" class="inline-error">Username is required</div>

    <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Password" autocomplete="new-password">
        <i class="fas fa-eye-slash password-toggle" id="togglePassword"></i>
    </div>
    <div class="password-strength">
        <span class="strength-text">Strength:</span>
        <div class="strength-bar"><div id="strengthFill" class="strength-fill"></div></div>
        <span id="strengthLabel" class="strength-text">None</span>
    </div>
    <div id="passwordError" class="inline-error">Password must be at least 6 characters</div>

    <div class="input-group">
        <i class="fas fa-check-circle"></i>
        <input type="password" id="confirm" placeholder="Confirm password" autocomplete="off">
        <i class="fas fa-eye-slash password-toggle" id="toggleConfirm"></i>
    </div>
    <div id="confirmError" class="inline-error">Passwords do not match</div>

    <button id="registerBtn">Register <i class="fas fa-user-plus"></i></button>
    <div class="footer-link">
        Already have an account? <a href="/login/">Sign in</a>
    </div>
</div>

<script>
    const registerBtn = document.getElementById('registerBtn');
    const errorDiv = document.getElementById('error');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm');
    const togglePassword = document.getElementById('togglePassword');
    const toggleConfirm = document.getElementById('toggleConfirm');
    const strengthFill = document.getElementById('strengthFill');
    const strengthLabel = document.getElementById('strengthLabel');
    const usernameError = document.getElementById('usernameError');
    const passwordError = document.getElementById('passwordError');
    const confirmError = document.getElementById('confirmError');

    // Toggle password visibility
    togglePassword.addEventListener('click', () => toggleVisibility(passwordInput, togglePassword));
    toggleConfirm.addEventListener('click', () => toggleVisibility(confirmInput, toggleConfirm));

    function toggleVisibility(inputField, toggleIcon) {
        const type = inputField.getAttribute('type') === 'password' ? 'text' : 'password';
        inputField.setAttribute('type', type);
        toggleIcon.classList.toggle('fa-eye');
        toggleIcon.classList.toggle('fa-eye-slash');
    }

    // Password strength meter
    function checkStrength(password) {
        let strength = 0;
        if (password.length >= 6) strength++;
        if (password.length >= 10) strength++;
        if (/[A-Z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^A-Za-z0-9]/.test(password)) strength++;
        const colors = ['#ef4444', '#f59e0b', '#eab308', '#10b981', '#10b981'];
        const labels = ['Very Weak', 'Weak', 'Medium', 'Strong', 'Very Strong'];
        const width = (strength / 5) * 100;
        strengthFill.style.width = width + '%';
        strengthFill.style.background = colors[Math.min(strength, 4)];
        strengthLabel.innerText = labels[Math.min(strength, 4)];
        return strength >= 3;
    }

    passwordInput.addEventListener('input', () => {
        checkStrength(passwordInput.value);
        if (confirmInput.value) validateConfirm();
    });
    confirmInput.addEventListener('input', validateConfirm);
    usernameInput.addEventListener('input', () => usernameError.style.display = 'none');
    passwordInput.addEventListener('input', () => passwordError.style.display = 'none');

    function validateConfirm() {
        if (confirmInput.value && passwordInput.value !== confirmInput.value) {
            confirmError.style.display = 'block';
            return false;
        } else {
            confirmError.style.display = 'none';
            return true;
        }
    }

    async function doRegister() {
        errorDiv.style.display = 'none';
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        const confirm = confirmInput.value;

        let valid = true;
        if (!username) {
            usernameError.style.display = 'block';
            valid = false;
        }
        if (password.length < 6) {
            passwordError.style.display = 'block';
            valid = false;
        }
        if (password !== confirm) {
            confirmError.style.display = 'block';
            valid = false;
        }
        if (!valid) return;

        registerBtn.disabled = true;
        registerBtn.innerHTML = '<span class="loader"></span> Creating account...';

        try {
            const res = await fetch('/api/auth/register/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
                credentials: 'include'
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('authToken', data.token);
                window.location.href = '/dashboard/';
            } else {
                errorDiv.innerText = data.error || 'Registration failed';
                errorDiv.style.display = 'block';
                registerBtn.disabled = false;
                registerBtn.innerHTML = 'Register <i class="fas fa-user-plus"></i>';
            }
        } catch (err) {
            errorDiv.innerText = 'Network error. Please try again.';
            errorDiv.style.display = 'block';
            registerBtn.disabled = false;
            registerBtn.innerHTML = 'Register <i class="fas fa-user-plus"></i>';
        }
    }

    registerBtn.addEventListener('click', doRegister);
    confirmInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') doRegister();
    });
</script>
</body>
</html>
