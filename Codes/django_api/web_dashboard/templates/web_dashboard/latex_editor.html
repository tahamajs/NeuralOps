{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaTeX Editor – Transformer Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; overflow: hidden; background: #0f172a; font-family: 'Segoe UI', system-ui, sans-serif; }
        .app { display: flex; flex-direction: column; height: 100vh; }
        .toolbar {
            background: #1e293b;
            padding: 8px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            border-bottom: 1px solid #334155;
            flex-wrap: wrap;
        }
        .toolbar button, .toolbar select, .toolbar label {
            background: #3b82f6;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .toolbar button:hover { background: #2563eb; transform: scale(1.02); }
        .toolbar .secondary { background: #475569; }
        .toolbar .danger { background: #ef4444; }
        .toolbar .secondary:hover { background: #334155; }
        .status {
            margin-left: auto;
            font-size: 0.85rem;
            background: #0f172a;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .status.success { color: #10b981; }
        .status.error { color: #ef4444; }
        .status.compiling { color: #f59e0b; }
        .split-view { display: flex; flex: 1; overflow: hidden; }
        .editor-pane { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #334155; }
        .preview-pane { flex: 1; display: flex; flex-direction: column; background: #1e293b; }
        .pane-header {
            background: #0f172a;
            padding: 6px 12px;
            font-size: 0.8rem;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
        }
        #editor { width: 100%; height: 100%; }
        iframe { width: 100%; flex: 1; border: none; background: white; }
        .error-panel {
            background: #7f1a1a;
            color: #fecaca;
            padding: 8px 16px;
            font-family: monospace;
            font-size: 0.8rem;
            max-height: 120px;
            overflow-y: auto;
            display: none;
            border-top: 1px solid #ef4444;
        }
        .file-input {
            display: none;
        }
        .small-icon {
            margin-right: 4px;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="toolbar">
        <button id="compileBtn"><i class="fas fa-play"></i> Compile & Preview</button>
        <button id="downloadPdfBtn" class="secondary"><i class="fas fa-download"></i> Download PDF</button>
        <button id="saveTexBtn" class="secondary"><i class="fas fa-save"></i> Save .tex</button>
        <button id="loadRunTexBtn" class="secondary"><i class="fas fa-folder-open"></i> Load from Run</button>
        <button id="insertImageBtn" class="secondary"><i class="fas fa-image"></i> Insert Image</button>
        <input type="file" id="imageUpload" class="file-input" accept="image/*">
        <select id="templateSelect">
            <option value="empty">Empty Document</option>
            <option value="glue">GLUE Experiment Template</option>
            <option value="svd">SVD Compression Report</option>
            <option value="paper">Paper with Run Metrics</option>
        </select>
        <span id="statusIndicator" class="status">Ready</span>
    </div>
    <div class="split-view">
        <div class="editor-pane">
            <div class="pane-header">
                <span>📝 LaTeX Source</span>
                <span style="font-size:0.7rem;">Ctrl+Space for autocomplete</span>
            </div>
            <div id="editor" style="height: 100%;"></div>
        </div>
        <div class="preview-pane">
            <div class="pane-header">📄 PDF Preview</div>
            <iframe id="pdfPreview" src="about:blank"></iframe>
            <div id="errorPanel" class="error-panel"></div>
        </div>
    </div>
</div>

<!-- Monaco Editor loader -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>
<script>
    const runId = "{{ run.id|default:'' }}";
    const authToken = localStorage.getItem('authToken');
    if (!authToken) window.location.href = '/login/';

    let editor = null;
    let compileTimeout = null;
    let currentPdfUrl = null;
    let statusDiv = document.getElementById('statusIndicator');

    // Helper: set status
    function setStatus(text, type = 'info') {
        statusDiv.innerText = text;
        statusDiv.className = `status ${type === 'success' ? 'success' : (type === 'error' ? 'error' : (type === 'compiling' ? 'compiling' : ''))}`;
    }

    // Clear Monaco markers (errors)
    function clearMarkers() {
        if (editor) {
            monaco.editor.setModelMarkers(editor.getModel(), 'latex', []);
        }
    }

    // Parse compilation error to extract line number (simple heuristic)
    function parseErrorLine(errorMsg) {
        // Typical LaTeX error: "! Undefined control sequence.\nl.23 \maketitle"
        const match = errorMsg.match(/l\.(\d+)/);
        if (match) return parseInt(match[1], 10);
        // Alternative: "line 23"
        const match2 = errorMsg.match(/line\s+(\d+)/i);
        if (match2) return parseInt(match2[1], 10);
        return null;
    }

    // Show error in editor (add marker)
    function highlightErrorInEditor(lineNum) {
        if (!editor) return;
        const model = editor.getModel();
        if (!model) return;
        const markers = [];
        if (lineNum) {
            markers.push({
                severity: monaco.MarkerSeverity.Error,
                startLineNumber: lineNum,
                endLineNumber: lineNum,
                startColumn: 1,
                endColumn: model.getLineMaxColumn(lineNum),
                message: "LaTeX compilation error"
            });
        }
        monaco.editor.setModelMarkers(model, 'latex', markers);
        if (lineNum) {
            editor.revealLineInCenter(lineNum);
        }
    }

    async function compileLatex(latexContent) {
        setStatus('Compiling...', 'compiling');
        const errorPanel = document.getElementById('errorPanel');
        errorPanel.style.display = 'none';
        errorPanel.innerText = '';
        clearMarkers();

        try {
            const res = await fetch('/api/latex/compile/', {
                method: 'POST',
                headers: { 'Authorization': `Token ${authToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ latex: latexContent })
            });
            if (res.ok) {
                const blob = await res.blob();
                if (currentPdfUrl) URL.revokeObjectURL(currentPdfUrl);
                currentPdfUrl = URL.createObjectURL(blob);
                document.getElementById('pdfPreview').src = currentPdfUrl;
                setStatus('Compilation succeeded', 'success');
            } else {
                let errorDetail = '';
                try {
                    const errJson = await res.json();
                    errorDetail = errJson.error || 'Compilation failed';
                } catch(e) {
                    errorDetail = await res.text();
                }
                // Attempt to extract line number
                const lineNum = parseErrorLine(errorDetail);
                if (lineNum) {
                    errorDetail += ` (line ${lineNum})`;
                    highlightErrorInEditor(lineNum);
                }
                errorPanel.innerText = errorDetail;
                errorPanel.style.display = 'block';
                setStatus('Compilation failed', 'error');
            }
        } catch (e) {
            errorPanel.innerText = 'Network error: ' + e.message;
            errorPanel.style.display = 'block';
            setStatus('Network error', 'error');
        }
    }

    // Debounced auto-compile
    function onEditorChange() {
        if (compileTimeout) clearTimeout(compileTimeout);
        compileTimeout = setTimeout(() => {
            const latex = editor.getValue();
            compileLatex(latex);
        }, 800);
    }

    // Save current LaTeX to run (paper_source)
    async function saveTexToRun() {
        if (!runId) {
            alert('No run ID available. Cannot save.');
            return;
        }
        const latex = editor.getValue();
        try {
            const res = await fetch(`/api/runs/${runId}/paper_source/`, {
                method: 'POST',
                headers: { 'Authorization': `Token ${authToken}`, 'Content-Type': 'application/plain' },
                body: latex
            });
            if (res.ok) alert('LaTeX source saved to run!');
            else alert('Save failed');
        } catch(e) { alert('Error saving: ' + e.message); }
    }

    async function loadTexFromRun() {
        if (!runId) {
            alert('No run ID. Load from project not possible.');
            return;
        }
        try {
            const res = await fetch(`/api/runs/${runId}/paper_source/`, {
                headers: { 'Authorization': `Token ${authToken}` }
            });
            if (res.ok) {
                const latex = await res.text();
                editor.setValue(latex);
                compileLatex(latex);
            } else {
                alert('No saved LaTeX found for this run.');
            }
        } catch(e) { alert('Load failed: ' + e.message); }
    }

    // Generate a template that includes real run metrics (if runId exists)
    async function getPaperTemplateWithRunMetrics() {
        if (!runId) {
            return `\\documentclass{article}
\\usepackage{graphicx}
\\title{Experiment Paper}
\\author{Transformer Toolkit}
\\date{\\today}
\\begin{document}
\\maketitle
\\section{Results}
This paper would contain metrics from the run, but no run ID is provided.
\\end{document}`;
        }
        try {
            const runRes = await fetch(`/api/runs/${runId}/`, {
                headers: { 'Authorization': `Token ${authToken}` }
            });
            const run = await runRes.json();
            const metrics = run.final_metrics || {};
            const accuracy = metrics.eval_accuracy ? metrics.eval_accuracy.toFixed(4) : 'N/A';
            const loss = metrics.eval_loss ? metrics.eval_loss.toFixed(4) : 'N/A';
            const f1 = metrics.eval_f1 ? metrics.eval_f1.toFixed(4) : 'N/A';
            const config = run.config || {};
            return `\\documentclass{article}
\\usepackage{graphicx, booktabs}
\\title{Experiment Report: ${config.task_name?.toUpperCase() || 'Task'}}
\\author{Researcher}
\\date{\\today}
\\begin{document}
\\maketitle
\\section{Configuration}
\\begin{tabular}{ll}
Model: & ${config.model_name || 'N/A'} \\\\
Attention: & ${config.attention_type || 'full'} \\\\
Epochs: & ${config.epochs || 'N/A'} \\\\
Batch size: & ${config.batch_size || 'N/A'} \\\\
Learning rate: & ${config.learning_rate || 'N/A'} \\\\
\\end{tabular}
\\section{Results}
\\begin{tabular}{lccc}
\\toprule
Metric & Accuracy & Loss & F1 \\\\
\\midrule
Value & ${accuracy} & ${loss} & ${f1} \\\\
\\bottomrule
\\end{tabular}
\\end{document}`;
        } catch(e) {
            return `\\documentclass{article}
\\usepackage{graphicx}
\\title{Experiment Paper}
\\author{Transformer Toolkit}
\\date{\\today}
\\begin{document}
\\maketitle
\\section{Results}
Failed to load run metrics: ${e.message}
\\end{document}`;
        }
    }

    async function loadTemplate(templateName) {
        let content = '';
        if (templateName === 'empty') {
            content = `\\documentclass{article}
\\usepackage{graphicx}
\\title{My Document}
\\author{You}
\\date{\\today}
\\begin{document}
\\maketitle
\\section{Introduction}
Your content here.
\\end{document}`;
        } else if (templateName === 'glue') {
            content = `\\documentclass{article}
\\usepackage{graphicx, booktabs, multirow}
\\title{GLUE Benchmark Experiment Report}
\\author{Efficient Transformer Toolkit}
\\date{\\today}
\\begin{document}
\\maketitle
\\section{Experimental Setup}
\\subsection{Models and Tasks}
We evaluate on GLUE tasks: MRPC, SST-2, CoLA, QQP, MNLI.
\\subsection{Attention Variants}
We compare full attention, SVD, Linformer, and GoldFinch-AHN.
\\section{Results}
\\begin{table}[h]
\\centering
\\begin{tabular}{lcc}
\\toprule
Model & Accuracy & F1 \\\\
\\midrule
Baseline & 0.892 & 0.901 \\\\
SVD (rank 64) & 0.885 & 0.894 \\\\
GoldFinch & 0.901 & 0.912 \\\\
\\bottomrule
\\end{tabular}
\\caption{Main results.}
\\end{table}
\\section{Conclusion}
Our proposed attention achieves competitive results with lower complexity.
\\end{document}`;
        } else if (templateName === 'svd') {
            content = `\\documentclass{article}
\\usepackage{graphicx}
\\title{SVD Compression Analysis}
\\author{Transformer Toolkit}
\\date{\\today}
\\begin{document}
\\maketitle
\\section{Singular Value Spectra}
\\begin{figure}[h]
\\centering
\\includegraphics[width=0.7\\linewidth]{svd_spectrum.png}
\\caption{Singular value decay.}
\\end{figure}
\\section{Energy Retention}
The cumulative energy plot shows that rank 64 retains 95\\% of the information.
\\end{document}`;
        } else if (templateName === 'paper') {
            content = await getPaperTemplateWithRunMetrics();
        }
        editor.setValue(content);
        compileLatex(content);
    }

    // Image upload: convert to base64 and insert as \includegraphics[width=0.5\textwidth]{...}
    function insertImageBase64(imgBase64, filename) {
        const imageTag = `\\begin{figure}[htbp]
\\centering
\\includegraphics[width=0.8\\textwidth]{${imgBase64}}
\\caption{${filename}}
\\label{fig:${filename.replace(/\./g, '')}}
\\end{figure}`;
        const selection = editor.getSelection();
        const id = { major: 1, minor: 1 };
        const range = new monaco.Range(selection.startLineNumber, selection.startColumn, selection.endLineNumber, selection.endColumn);
        editor.executeEdits('insert-image', [{ range: range, text: imageTag, forceMoveMarkers: true }]);
    }

    // Handle image upload
    document.getElementById('imageUpload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            const base64 = ev.target.result;
            // Reduce size for embedding; user can later replace with proper file path
            insertImageBase64(base64, file.name);
        };
        reader.readAsDataURL(file);
        // reset input
        e.target.value = '';
    });

    document.getElementById('insertImageBtn').onclick = () => {
        document.getElementById('imageUpload').click();
    };

    // Initialize Monaco Editor with LaTeX autocomplete
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
        // Register custom LaTeX language and autocomplete
        monaco.languages.register({ id: 'latex' });
        monaco.languages.setMonarchTokensProvider('latex', {
            tokenizer: {
                root: [
                    [/\\.*?(?=\s|{|})/, 'keyword'],
                    [/%.*$/, 'comment'],
                    [/\\[a-zA-Z]+/, 'function'],
                    [/\\[^a-zA-Z]/, 'function'],
                    [/[{}]/, 'delimiter.bracket'],
                    [/\[.*?\]/, 'variable'],
                ]
            }
        });
        monaco.languages.registerCompletionItemProvider('latex', {
            provideCompletionItems: (model, position) => {
                const suggestions = [
                    { label: '\\section', kind: monaco.languages.CompletionItemKind.Function, insertText: '\\section{$1}', insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet },
                    { label: '\\subsection', kind: monaco.languages.CompletionItemKind.Function, insertText: '\\subsection{$1}' },
                    { label: '\\begin{document}', kind: monaco.languages.CompletionItemKind.Snippet, insertText: '\\begin{document}\n$1\n\\end{document}' },
                    { label: '\\begin{figure}', kind: monaco.languages.CompletionItemKind.Snippet, insertText: '\\begin{figure}[htbp]\n\\centering\n\\includegraphics[width=0.8\\textwidth]{$1}\n\\caption{$2}\n\\label{fig:$3}\n\\end{figure}' },
                    { label: '\\begin{table}', kind: monaco.languages.CompletionItemKind.Snippet, insertText: '\\begin{table}[htbp]\n\\centering\n\\begin{tabular}{$1}\n$2\n\\end{tabular}\n\\caption{$3}\n\\label{tab:$4}\n\\end{table}' },
                    { label: '\\includegraphics', kind: monaco.languages.CompletionItemKind.Function, insertText: '\\includegraphics[width=0.5\\textwidth]{$1}' },
                    { label: '\\textbf', kind: monaco.languages.CompletionItemKind.Function, insertText: '\\textbf{$1}' },
                    { label: '\\textit', kind: monaco.languages.CompletionItemKind.Function, insertText: '\\textit{$1}' },
                    { label: '\\cite', kind: monaco.languages.CompletionItemKind.Function, insertText: '\\cite{$1}' },
                    { label: '\\label', kind: monaco.languages.CompletionItemKind.Function, insertText: '\\label{$1}' },
                    { label: '\\ref', kind: monaco.languages.CompletionItemKind.Function, insertText: '\\ref{$1}' },
                ];
                return { suggestions: suggestions };
            }
        });
        editor = monaco.editor.create(document.getElementById('editor'), {
            value: `\\documentclass{article}
\\usepackage{graphicx}
\\title{My Paper}
\\author{You}
\\date{\\today}
\\begin{document}
\\maketitle
\\section{Introduction}
Write your paper here.
\\end{document}`,
            language: 'latex',
            theme: 'vs-dark',
            automaticLayout: true,
            fontSize: 14,
            minimap: { enabled: false },
            quickSuggestions: true,
            snippetSuggestions: 'inline'
        });
        editor.onDidChangeModelContent(onEditorChange);
        // Load run's saved LaTeX if exists
        if (runId) loadTexFromRun();
        else compileLatex(editor.getValue());
    });

    document.getElementById('compileBtn').onclick = () => compileLatex(editor.getValue());
    document.getElementById('downloadPdfBtn').onclick = () => {
        if (currentPdfUrl) {
            const a = document.createElement('a');
            a.href = currentPdfUrl;
            a.download = `paper_${runId || 'document'}.pdf`;
            a.click();
        } else alert('No PDF available. Compile first.');
    };
    document.getElementById('saveTexBtn').onclick = saveTexToRun;
    document.getElementById('loadRunTexBtn').onclick = loadTexFromRun;
    document.getElementById('templateSelect').onchange = (e) => loadTemplate(e.target.value);
</script>
</body>
</html>
