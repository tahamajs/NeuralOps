{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Transformer Pro Toolkit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0d1326 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .card {
            background: rgba(20, 28, 40, 0.8);
            backdrop-filter: blur(14px);
            border-radius: 32px;
            padding: 2rem 1.8rem;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        h2 {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1.8rem;
        }
        .input-group {
            position: relative;
            margin-bottom: 1.2rem;
        }
        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1rem;
            pointer-events: none;
        }
        input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: #0f172a;
            border: 1px solid #2d3a5e;
            border-radius: 40px;
            color: #f1f5f9;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #64748b;
            transition: color 0.2s;
            z-index: 2;
        }
        .password-toggle:hover {
            color: #60a5fa;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1.2rem;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: #3b82f6;
        }
        .checkbox-group label {
            font-size: 0.85rem;
            color: #cbd5e1;
            cursor: pointer;
        }
        button {
            width: 100%;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 12px rgba(59,130,246,0.4);
        }
        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
        .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error {
            background: rgba(239,68,68,0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 1rem;
            display: none;
        }
        .footer-link {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .footer-link a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 500;
        }
        .footer-link a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <h2>🔐 Welcome Back</h2>
    <div id="error" class="error"></div>

    <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Username" autocomplete="username">
    </div>
    <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
        <i class="fas fa-eye-slash password-toggle" id="togglePassword"></i>
    </div>
    <div class="checkbox-group">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Remember me</label>
    </div>
    <button id="loginBtn">Sign In <i class="fas fa-arrow-right"></i></button>
    <div class="footer-link">
        Don't have an account? <a href="/register/">Create one</a>
    </div>
</div>

<script>
    const loginBtn = document.getElementById('loginBtn');
    const errorDiv = document.getElementById('error');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const rememberMe = document.getElementById('rememberMe');

    // Toggle password visibility
    togglePassword.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    });

    // Store/retrieve remember me
    const savedUsername = localStorage.getItem('rememberedUsername');
    if (savedUsername) {
        usernameInput.value = savedUsername;
        rememberMe.checked = true;
    }

    async function doLogin() {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        errorDiv.style.display = 'none';
        errorDiv.innerText = '';

        if (!username || !password) {
            errorDiv.innerText = 'Username and password are required';
            errorDiv.style.display = 'block';
            return;
        }

        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span class="loader"></span> Signing in...';

        try {
            const res = await fetch('/api/auth/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
                credentials: 'include'
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('authToken', data.token);
                if (rememberMe.checked) {
                    localStorage.setItem('rememberedUsername', username);
                } else {
                    localStorage.removeItem('rememberedUsername');
                }
                window.location.href = '/dashboard/';
            } else {
                errorDiv.innerText = data.error || 'Invalid credentials';
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Sign In <i class="fas fa-arrow-right"></i>';
            }
        } catch (err) {
            errorDiv.innerText = 'Network error. Please try again.';
            errorDiv.style.display = 'block';
            loginBtn.disabled = false;
            loginBtn.innerHTML = 'Sign In <i class="fas fa-arrow-right"></i>';
        }
    }

    loginBtn.addEventListener('click', doLogin);
    passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') doLogin();
    });
</script>
</body>
</html>
