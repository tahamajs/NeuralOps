<!DOCTYPE html>
<html>
<head>
    <title>Job {{ experiment.id }} – Live Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🧠 Experiment Monitor</span>
            <div>
                <button class="btn btn-danger" id="stop-btn">Stop Experiment</button>
                <a href="{% url 'index' %}" class="btn btn-secondary">Back to Dashboard</a>
            </div>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-8">
                <h3>Training Curves</h3>
                <canvas id="lossChart" width="600" height="300"></canvas>
                <canvas id="accuracyChart" width="600" height="300" style="margin-top:20px;"></canvas>
            </div>
            <div class="col-md-4">
                <div class="card mb-3">
                    <div class="card-body">
                        <h5>Job Status: <span id="job-status">{{ experiment.status }}</span></h5>
                        <div class="progress mb-3" style="height:25px;">
                            <div class="progress-bar" id="progress-bar" style="width:0%" role="progressbar">0%</div>
                        </div>
                        <p><strong>Step:</strong> <span id="current-step">0</span> / <span id="total-steps">0</span></p>
                        <p><strong>Elapsed:</strong> <span id="elapsed-time">--</span></p>
                        <p><strong>ETA:</strong> <span id="eta-time">--</span></p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body">
                        <h5>Real-time Metrics</h5>
                        <p>GPU: <span id="gpu-usage">--%</span> | Memory: <span id="gpu-mem">-- MB</span></p>
                        <p>CPU: <span id="cpu-usage">--%</span> | RAM: <span id="ram-usage">-- MB</span></p>
                        <div id="latest-metrics" style="max-height:200px; overflow-y:auto; font-size:0.9em;"></div>
                    </div>
                </div>
            </div>
        </div>
        <hr>
        <h4>Logs</h4>
        <pre id="log-area" style="background:#f4f4f4; padding:10px; max-height:200px; overflow-y:auto;">{{ experiment.logs }}</pre>
    </div>

    <script>
        const jobId = "{{ experiment.id }}";
        const wsUrl = `ws://${window.location.host}/ws/jobs/${jobId}/`;
        let lossChart, accuracyChart;
        let trainLosses = [], evalLosses = [], trainSteps = [], evalSteps = [];
        let startTime = null;

        // Initialize charts
        function initCharts() {
            const ctx1 = document.getElementById('lossChart').getContext('2d');
            lossChart = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Training Loss', data: [], borderColor: 'blue', fill: false },
                        { label: 'Eval Loss', data: [], borderColor: 'red', fill: false }
                    ]
                },
                options: { responsive: true, scales: { x: { title: { display: true, text: 'Step' } } } }
            });
            const ctx2 = document.getElementById('accuracyChart').getContext('2d');
            accuracyChart = new Chart(ctx2, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{ label: 'Accuracy', data: [], borderColor: 'green', fill: false }]
                },
                options: { responsive: true, scales: { x: { title: { display: true, text: 'Epoch' } } } }
            });
        }

        function updateProgress(data) {
            if (data.current_step && data.total_steps) {
                const pct = (data.current_step / data.total_steps * 100).toFixed(1);
                document.getElementById('progress-bar').style.width = pct + '%';
                document.getElementById('progress-bar').innerText = pct + '%';
                document.getElementById('current-step').innerText = data.current_step;
                document.getElementById('total-steps').innerText = data.total_steps;
                if (data.eta_seconds) {
                    document.getElementById('eta-time').innerText = formatTime(data.eta_seconds);
                }
            }
        }

        function formatTime(seconds) {
            if (!seconds || seconds <= 0) return '--';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return `${h > 0 ? h + 'h ' : ''}${m}m ${s}s`;
        }

        function addLog(message) {
            const logArea = document.getElementById('log-area');
            logArea.textContent += message + '\n';
            logArea.scrollTop = logArea.scrollHeight;
        }

        const ws = new WebSocket(wsUrl);
        ws.onopen = () => {
            console.log('WebSocket connected');
            startTime = Date.now();
        };
        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === 'metrics' && msg.data) {
                const { loss, eval_loss, eval_accuracy } = msg.data;
                if (loss !== undefined) {
                    trainLosses.push(loss);
                    trainSteps.push(trainSteps.length + 1);
                    lossChart.data.labels = trainSteps;
                    lossChart.data.datasets[0].data = trainLosses;
                    lossChart.update();
                }
                if (eval_loss !== undefined) {
                    evalLosses.push(eval_loss);
                    evalSteps.push(evalSteps.length + 1);
                    lossChart.data.datasets[1].data = evalLosses;
                    lossChart.update();
                }
                if (eval_accuracy !== undefined) {
                    accuracyChart.data.labels.push(evalSteps.length);
                    accuracyChart.data.datasets[0].data.push(eval_accuracy);
                    accuracyChart.update();
                }
                let metricsHtml = '';
                Object.entries(msg.data).forEach(([k,v]) => {
                    if (typeof v === 'number') metricsHtml += `<div>${k}: ${v.toFixed(4)}</div>`;
                });
                document.getElementById('latest-metrics').innerHTML = metricsHtml;
            } else if (msg.type === 'progress') {
                updateProgress(msg.data || msg);
            } else if (msg.type === 'log') {
                addLog(msg.data);
            } else if (msg.type === 'status') {
                document.getElementById('job-status').innerText = msg.status;
                if (msg.status === 'completed' || msg.status === 'failed' || msg.status === 'cancelled') {
                    ws.close();
                }
            }
        };

        document.getElementById('stop-btn').addEventListener('click', async () => {
            if (confirm('Are you sure you want to stop this experiment?')) {
                await fetch(`/api/stop/${jobId}/`, { method: 'POST' });
                alert('Experiment stop requested. It may take a moment to clean up.');
            }
        });

        initCharts();
    </script>
</body>
</html>
