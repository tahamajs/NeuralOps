<!-- ============================================= -->
<!-- Model Versioning Component (insert inside experiment_monitor.html) -->
<!-- Requires global variables: runId (uuid), authToken (string) -->
<!-- ============================================= -->

<style>
    .version-card {
        background: #1e293b;
        border-radius: 16px;
        padding: 1rem;
        margin-bottom: 1rem;
        border-left: 4px solid #3b82f6;
        transition: 0.2s;
    }
    .version-card:hover { background: #2d3a5e; transform: translateY(-2px); }
    .version-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; margin-right: 6px; }
    .badge-production { background: #f59e0b; color: #000; }
    .badge-hub { background: #10b981; }
    .badge-cold { background: #06b6d4; }
    .btn-version { padding: 4px 10px; font-size: 0.7rem; margin: 2px; }
    .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1100; }
</style>

<div class="card mt-4">
    <div class="card-header bg-transparent border-secondary d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h5 class="mb-0"><i class="fas fa-cubes me-2"></i>Model Versions</h5>
        <div class="d-flex gap-2">
            <button id="refreshVersionsBtn" class="btn btn-sm btn-outline-secondary"><i class="fas fa-sync-alt"></i> Refresh</button>
            <button id="cleanupVersionsBtn" class="btn btn-sm btn-outline-danger"><i class="fas fa-trash-alt"></i> Cleanup</button>
        </div>
    </div>
    <div class="card-body">
        <!-- Filter bar -->
        <div class="row g-2 mb-3">
            <div class="col-md-3">
                <label class="form-label small">Filter</label>
                <select id="versionFilter" class="form-select form-select-sm bg-dark border-secondary">
                    <option value="all">All versions</option>
                    <option value="published">Published to Hub</option>
                    <option value="unpublished">Not published</option>
                    <option value="production">Production</option>
                    <option value="validation_true">Validation passed</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small">Storage tier</label>
                <select id="storageFilter" class="form-select form-select-sm bg-dark border-secondary">
                    <option value="all">All tiers</option>
                    <option value="hot">Hot (Local)</option>
                    <option value="cold">Cold (Archive)</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small">Sort by</label>
                <select id="sortVersions" class="form-select form-select-sm bg-dark border-secondary">
                    <option value="-version_number">Version (newest first)</option>
                    <option value="version_number">Version (oldest first)</option>
                    <option value="-created_at">Date (newest)</option>
                    <option value="artifact_size_mb">Size (smallest)</option>
                    <option value="-artifact_size_mb">Size (largest)</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small">Search</label>
                <input type="text" id="versionSearch" class="form-control form-control-sm bg-dark border-secondary" placeholder="Version name...">
            </div>
        </div>

        <!-- Versions container -->
        <div id="versionsContainer" style="max-height: 500px; overflow-y: auto;">
            <div class="text-center text-secondary py-4">Loading model versions...</div>
        </div>
    </div>
</div>

<!-- Compare Modal -->
<div class="modal fade" id="compareVersionsModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content bg-dark text-light border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">Compare Versions</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="compareModalBody">Loading...</div>
            <div class="modal-footer border-secondary">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="versionToastContainer"></div>

<script>
    (function() {
        if (typeof runId === 'undefined' || !runId) {
            console.error("Model versions: runId not defined");
            return;
        }

        // Helper: show toast
        function showToast(message, type = 'success') {
            const container = document.getElementById('versionToastContainer');
            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white bg-${type === 'success' ? 'success' : 'danger'} border-0 fade show`;
            toast.setAttribute('role', 'alert');
            toast.innerHTML = `<div class="d-flex"><div class="toast-body">${escapeHtml(message)}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
            container.appendChild(toast);
            const bsToast = new bootstrap.Toast(toast, { autohide: true, delay: 3000 });
            bsToast.show();
            toast.addEventListener('hidden.bs.toast', () => toast.remove());
        }

        function escapeHtml(s) { return String(s||'').replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

        let selectedCompareIds = [];

        // Fetch versions with filters
        async function fetchVersions() {
            const filter = document.getElementById('versionFilter').value;
            const storage = document.getElementById('storageFilter').value;
            const sort = document.getElementById('sortVersions').value;
            const search = document.getElementById('versionSearch').value;

            let url = `/api/runs/${runId}/versions/?ordering=${sort}&search=${encodeURIComponent(search)}`;
            if (storage !== 'all') url += `&storage_tier=${storage}`;
            if (filter === 'published') url += `&published=true`;
            else if (filter === 'unpublished') url += `&published=false`;
            else if (filter === 'validation_true') url += `&validation_passed=true`;
            // 'production' filter is not directly supported; we'll handle client-side
            // but the backend may later add a 'is_production' filter

            try {
                const res = await fetch(url, { headers: { 'Authorization': `Token ${authToken}` } });
                if (!res.ok) throw new Error('Failed');
                const data = await res.json();
                let versions = data.results || data;
                if (filter === 'production') versions = versions.filter(v => v.is_production);
                renderVersions(versions);
            } catch(e) {
                console.error(e);
                document.getElementById('versionsContainer').innerHTML = '<div class="text-danger text-center py-4">Failed to load versions</div>';
                showToast('Failed to load versions', 'error');
            }
        }

        function renderVersions(versions) {
            const container = document.getElementById('versionsContainer');
            if (!versions.length) {
                container.innerHTML = '<div class="text-secondary text-center py-4">No model versions saved yet.</div>';
                return;
            }
            container.innerHTML = versions.map(v => `
                <div class="version-card">
                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                        <div>
                            <strong>${escapeHtml(v.version)}</strong>
                            <span class="version-badge bg-secondary">v${v.version_number}</span>
                            ${v.is_production ? '<span class="version-badge badge-production">🚀 PRODUCTION</span>' : ''}
                            ${v.is_published_to_hub ? '<span class="version-badge badge-hub">📦 On Hub</span>' : ''}
                            ${v.storage_tier === 'cold' ? '<span class="version-badge badge-cold">❄️ Cold</span>' : ''}
                        </div>
                        <div class="small text-secondary">${new Date(v.created_at).toLocaleString()}</div>
                    </div>
                    <div class="row mt-2 small">
                        <div class="col-md-4">Size: ${v.artifact_size_mb?.toFixed(1) || '?'} MB</div>
                        <div class="col-md-4">Accuracy: ${v.metrics?.eval_accuracy?.toFixed(4) || '—'}</div>
                        <div class="col-md-4">Loss: ${v.metrics?.eval_loss?.toFixed(4) || '—'}</div>
                    </div>
                    <div class="mt-2 d-flex flex-wrap gap-1">
                        <button class="btn btn-sm btn-outline-info download-version" data-id="${v.id}"><i class="fas fa-download"></i> Download</button>
                        ${!v.is_published_to_hub ? `<button class="btn btn-sm btn-outline-success publish-version" data-id="${v.id}"><i class="fas fa-cloud-upload-alt"></i> Publish to Hub</button>` : ''}
                        ${v.storage_tier === 'hot' ? `<button class="btn btn-sm btn-outline-warning archive-version" data-id="${v.id}"><i class="fas fa-archive"></i> Archive (Cold)</button>` : ''}
                        ${v.storage_tier === 'cold' ? `<button class="btn btn-sm btn-outline-info restore-version" data-id="${v.id}"><i class="fas fa-database"></i> Restore</button>` : ''}
                        <button class="btn btn-sm btn-outline-secondary compare-version" data-id="${v.id}" data-version="${v.version_number}"><i class="fas fa-chart-line"></i> Compare</button>
                        ${!v.is_production ? `<button class="btn btn-sm btn-outline-primary set-production" data-id="${v.id}" data-version="${v.version_number}"><i class="fas fa-star"></i> Set Production</button>` : ''}
                    </div>
                </div>
            `).join('');
            attachVersionButtons();
        }

        function attachVersionButtons() {
            document.querySelectorAll('.download-version').forEach(btn => btn.onclick = () => downloadVersion(btn.dataset.id));
            document.querySelectorAll('.publish-version').forEach(btn => btn.onclick = () => publishVersion(btn.dataset.id));
            document.querySelectorAll('.archive-version').forEach(btn => btn.onclick = () => archiveVersion(btn.dataset.id));
            document.querySelectorAll('.restore-version').forEach(btn => btn.onclick = () => restoreVersion(btn.dataset.id));
            document.querySelectorAll('.compare-version').forEach(btn => btn.onclick = () => {
                const id = btn.dataset.id;
                const ver = btn.dataset.version;
                if (selectedCompareIds.length === 0) {
                    selectedCompareIds.push({ id, ver });
                    showToast(`Selected version ${ver}. Select another to compare.`, 'info');
                } else if (selectedCompareIds.length === 1) {
                    const first = selectedCompareIds[0];
                    if (first.id === id) {
                        selectedCompareIds = [];
                        showToast('Comparison cancelled', 'info');
                    } else {
                        compareVersions(first.id, id);
                        selectedCompareIds = [];
                    }
                }
            });
            document.querySelectorAll('.set-production').forEach(btn => btn.onclick = () => setProduction(btn.dataset.version));
        }

        async function downloadVersion(versionId) {
            window.open(`/api/versions/${versionId}/download/`, '_blank');
        }

        async function publishVersion(versionId) {
            if (!confirm('Publish this model to Hugging Face Hub?')) return;
            const btn = event.target.closest('button');
            const originalHtml = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Publishing...';
            try {
                const res = await fetch(`/api/versions/${versionId}/publish/`, { method: 'POST', headers: { 'Authorization': `Token ${authToken}` } });
                const data = await res.json();
                if (res.ok) {
                    showToast(`Published! Hub URL: ${data.hub_url}`, 'success');
                    fetchVersions();
                } else {
                    showToast(`Publish failed: ${data.error || 'Unknown'}`, 'error');
                }
            } catch(e) { showToast(`Error: ${e.message}`, 'error'); }
            finally { btn.disabled = false; btn.innerHTML = originalHtml; }
        }

        async function archiveVersion(versionId) {
            if (!confirm('Move this model to cold storage (S3 Glacier)? It will be archived and local copy removed.')) return;
            const res = await fetch(`/api/versions/${versionId}/archive/`, { method: 'POST', headers: { 'Authorization': `Token ${authToken}` } });
            if (res.ok) { showToast('Archived to cold storage', 'success'); fetchVersions(); }
            else { const err = await res.json(); showToast(`Archive failed: ${err.error || 'Unknown'}`, 'error'); }
        }

        async function restoreVersion(versionId) {
            const res = await fetch(`/api/versions/${versionId}/restore/`, { method: 'POST', headers: { 'Authorization': `Token ${authToken}` } });
            if (res.ok) { showToast('Restored from cold storage', 'success'); fetchVersions(); }
            else { const err = await res.json(); showToast(`Restore failed: ${err.error || 'Unknown'}`, 'error'); }
        }

        async function compareVersions(versionIdA, versionIdB) {
            try {
                const res = await fetch(`/api/runs/${runId}/versions/compare/${versionIdA}/${versionIdB}/`, { headers: { 'Authorization': `Token ${authToken}` } });
                const data = await res.json();
                let metricsHtml = '<table class="table table-dark table-sm"><thead><tr><th>Metric</th><th>Version A</th><th>Version B</th><th>Difference</th></tr></thead><tbody>';
                for (const [metric, values] of Object.entries(data.metrics_diff)) {
                    let diffClass = '';
                    let diffText = '';
                    if (values.diff !== undefined) {
                        diffClass = values.diff > 0 ? 'text-success' : 'text-danger';
                        diffText = values.diff.toFixed(4);
                    } else {
                        diffText = '—';
                    }
                    metricsHtml += `<tr><td>${escapeHtml(metric)}</td><td>${values.v1 !== undefined ? values.v1.toFixed(4) : '—'}</td><td>${values.v2 !== undefined ? values.v2.toFixed(4) : '—'}</td><td class="${diffClass}">${diffText}</td></tr>`;
                }
                metricsHtml += `</tbody></table>`;
                document.getElementById('compareModalBody').innerHTML = `
                    <h6>Version ${data.version_a.number} (${new Date(data.version_a.created_at).toLocaleString()}) vs Version ${data.version_b.number} (${new Date(data.version_b.created_at).toLocaleString()})</h6>
                    <p><strong>Size difference:</strong> ${data.size_diff_mb} MB</p>
                    ${metricsHtml}
                `;
                new bootstrap.Modal(document.getElementById('compareVersionsModal')).show();
            } catch(e) {
                showToast('Failed to compare versions', 'error');
            }
        }

        async function setProduction(versionNumber) {
            if (!confirm(`Set version ${versionNumber} as production?`)) return;
            const res = await fetch(`/api/runs/${runId}/versions/production/${versionNumber}/`, { method: 'POST', headers: { 'Authorization': `Token ${authToken}` } });
            if (res.ok) { showToast(`Production version updated to ${versionNumber}`, 'success'); fetchVersions(); }
            else { const err = await res.json(); showToast(`Failed: ${err.error || 'Unknown'}`, 'error'); }
        }

        document.getElementById('cleanupVersionsBtn').onclick = async () => {
            const keep = prompt('Keep best K versions (default 3):', '3');
            if (keep === null) return;
            const res = await fetch(`/api/runs/${runId}/versions/cleanup/`, {
                method: 'POST',
                headers: { 'Authorization': `Token ${authToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ keep_best_k: parseInt(keep) })
            });
            if (res.ok) { showToast('Cleanup completed', 'success'); fetchVersions(); }
            else { showToast('Cleanup failed', 'error'); }
        };

        document.getElementById('refreshVersionsBtn').onclick = fetchVersions;
        document.getElementById('versionFilter').onchange = fetchVersions;
        document.getElementById('storageFilter').onchange = fetchVersions;
        document.getElementById('sortVersions').onchange = fetchVersions;
        let searchTimeout;
        document.getElementById('versionSearch').oninput = () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(fetchVersions, 500);
        };

        fetchVersions();
    })();
</script>
