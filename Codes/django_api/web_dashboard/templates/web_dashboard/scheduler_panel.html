<!-- templates/web_dashboard/scheduler_panel.html -->
<div class="card mt-3">
    <h5><i class="fas fa-tachometer-alt"></i> Intelligent Scheduler Status</h5>
    <div class="row">
        <div class="col-md-6">
            <div class="stat-card">GPUs: <span id="schedTotalGpus">0</span> / <span id="schedAvailGpus">0</span></div>
        </div>
        <div class="col-md-6">
            <div class="stat-card">Queued: <span id="schedQueued">0</span> | Running: <span id="schedRunning">0</span></div>
        </div>
    </div>
    <button id="refreshSchedulerBtn" class="btn btn-sm btn-primary">Refresh</button>
</div>

<script>
async function loadSchedulerStatus() {
    const res = await fetch('/api/scheduler/status/', {
        headers: { 'Authorization': `Token ${authToken}` }
    });
    const data = await res.json();
    document.getElementById('schedTotalGpus').innerText = data.total_gpus;
    document.getElementById('schedAvailGpus').innerText = data.available_gpus;
    document.getElementById('schedQueued').innerText = data.queued_jobs;
    document.getElementById('schedRunning').innerText = data.running_jobs;
}
document.getElementById('refreshSchedulerBtn').onclick = loadSchedulerStatus;
setInterval(loadSchedulerStatus, 5000);
</script>



<div class="card mt-3">
    <h5>Adjust Scheduling Parameters</h5>
    <div class="row">
        <div class="col">
            <label>Estimated Duration (seconds)</label>
            <input type="number" id="estimatedDuration" class="form-control">
        </div>
        <div class="col">
            <label>Priority (1-10)</label>
            <input type="number" id="jobPriority" class="form-control" min="1" max="10">
        </div>
        <div class="col">
            <label>Memory (GB)</label>
            <input type="number" id="memoryReq" class="form-control">
        </div>
    </div>
    <button id="updateSchedulingBtn" class="btn btn-primary mt-2">Update</button>
</div>

<script>
document.getElementById('updateSchedulingBtn').onclick = async () => {
    const payload = {
        estimated_duration: parseInt(document.getElementById('estimatedDuration').value),
        priority: parseInt(document.getElementById('jobPriority').value),
        memory_requirements: parseInt(document.getElementById('memoryReq').value)
    };
    const res = await fetch(`/api/jobs/${runId}/scheduling/`, {
        method: 'PATCH',
        headers: { 'Authorization': `Token ${authToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    if (res.ok) alert('Scheduling parameters updated');
    else alert('Update failed');
};
</script>
