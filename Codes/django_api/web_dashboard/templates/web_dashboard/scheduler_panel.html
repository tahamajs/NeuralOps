<!-- Complete Custom Metrics Dashboard Component -->
<!-- Place this inside your experiment monitor page (e.g., experiment_monitor.html) -->
<!-- Requires global variables: runId (string), authToken (string) -->

<div class="card mt-4">
    <div class="card-header bg-transparent border-secondary d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="fas fa-chart-line me-2"></i>Custom Metrics Dashboard</h5>
        <div>
            <button id="metricsAutoRefreshToggle" class="btn btn-sm btn-outline-secondary me-1" title="Toggle auto‑refresh">
                <i class="fas fa-sync-alt"></i> Auto
            </button>
            <button id="metricsForceRefreshBtn" class="btn btn-sm btn-primary">
                <i class="fas fa-sync-alt"></i> Refresh Now
            </button>
        </div>
    </div>
    <div class="card-body">
        <!-- Loading indicator -->
        <div id="metricsLoading" class="text-center text-secondary py-3" style="display: none;">
            <i class="fas fa-spinner fa-spin me-2"></i> Loading metrics...
        </div>

        <div class="row" id="metricsContent">
            <div class="col-md-3">
                <label class="form-label small text-secondary fw-bold">📌 Select scalar metrics to plot</label>
                <select id="metricSelector" multiple class="form-select form-select-sm bg-dark text-light border-secondary" size="8"></select>
                <div class="mt-2">
                    <button id="plotSelectedBtn" class="btn btn-sm btn-primary w-100">
                        <i class="fas fa-chart-line me-1"></i> Update Chart
                    </button>
                </div>
            </div>
            <div class="col-md-9">
                <div id="scalarChart" style="height: 380px; background: #0f172a; border-radius: 16px;"></div>
            </div>
        </div>

        <!-- Images Gallery -->
        <div class="mt-4">
            <h6 class="text-secondary fw-bold"><i class="fas fa-images me-2"></i>Logged Images</h6>
            <div id="imageGallery" class="row g-3"></div>
        </div>

        <!-- Tables -->
        <div class="mt-4">
            <h6 class="text-secondary fw-bold"><i class="fas fa-table me-2"></i>Logged Tables</h6>
            <div id="tableView" class="table-responsive"></div>
        </div>

        <!-- Status message -->
        <div id="metricsStatus" class="small text-secondary mt-3 text-center"></div>
    </div>
</div>

<!-- Include Plotly.js (if not already present) -->
<script src="https://cdn.plot.ly/plotly-3.0.1.min.js" charset="utf-8"></script>

<script>
    (function() {
        // =========================================================================
        //  Custom Metrics Dashboard – Complete Implementation
        //  Expects backend endpoint: GET /api/runs/<runId>/metrics/
        //  Response format:
        //  {
        //    "metric_name": {
        //        "type": "scalar" | "image" | "table",
        //        "steps": [0,1,2,...],
        //        "values": [value0, value1, ...]  // for scalar: numbers; for image: base64 strings; for table: list of objects
        //    }
        //  }
        // =========================================================================

        if (typeof runId === 'undefined' || !runId) {
            console.error("Metrics dashboard: runId is not defined");
            return;
        }
        if (typeof authToken === 'undefined' || !authToken) {
            console.error("Metrics dashboard: authToken is not defined");
            return;
        }

        let scalarChart = null;
        let currentMetricsData = null;
        let autoRefreshInterval = null;
        let autoRefreshEnabled = true;
        const REFRESH_INTERVAL_MS = 10000;

        // Helper: authenticated fetch
        async function apiFetch(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: { 'Authorization': `Token ${authToken}`, 'Content-Type': 'application/json', ...options.headers }
            });
            if (res.status === 401) throw new Error('Unauthorized');
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        // Show/hide loading spinner
        function setLoading(loading) {
            const spinner = document.getElementById('metricsLoading');
            const content = document.getElementById('metricsContent');
            if (loading) {
                spinner.style.display = 'block';
                content.style.opacity = '0.5';
            } else {
                spinner.style.display = 'none';
                content.style.opacity = '1';
            }
        }

        // Main data loader
        async function loadMetrics() {
            try {
                setLoading(true);
                currentMetricsData = await apiFetch(`/api/runs/${runId}/metrics/`);
                populateMetricSelector();
                updateScalarChart();  // uses current selection
                renderImageGallery();
                renderTableView();
                document.getElementById('metricsStatus').innerHTML = `<i class="fas fa-check-circle text-success me-1"></i>Updated at ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                console.error('Metrics load error:', error);
                document.getElementById('metricsStatus').innerHTML = `<i class="fas fa-exclamation-triangle text-danger me-1"></i>Failed to load metrics: ${error.message}`;
                if (scalarChart) Plotly.purge('scalarChart');
                document.getElementById('metricSelector').innerHTML = '<option disabled>No data</option>';
            } finally {
                setLoading(false);
            }
        }

        function populateMetricSelector() {
            const selector = document.getElementById('metricSelector');
            selector.innerHTML = '';
            let hasScalar = false;
            for (const [name, data] of Object.entries(currentMetricsData)) {
                if (data.type === 'scalar') {
                    hasScalar = true;
                    const option = document.createElement('option');
                    option.value = name;
                    option.textContent = name;
                    selector.appendChild(option);
                }
            }
            if (!hasScalar) {
                const placeholder = document.createElement('option');
                placeholder.textContent = 'No scalar metrics yet';
                placeholder.disabled = true;
                selector.appendChild(placeholder);
            }
        }

        function updateScalarChart() {
            const selected = Array.from(document.getElementById('metricSelector').selectedOptions).map(opt => opt.value);
            if (selected.length === 0) {
                if (scalarChart) Plotly.purge('scalarChart');
                return;
            }
            const traces = [];
            for (const name of selected) {
                const metric = currentMetricsData[name];
                if (metric && metric.type === 'scalar' && metric.steps && metric.values) {
                    traces.push({
                        x: metric.steps,
                        y: metric.values,
                        mode: 'lines+markers',
                        name: name,
                        line: { width: 2 },
                        marker: { size: 4 }
                    });
                }
            }
            const layout = {
                title: { text: 'Training Metrics', font: { color: '#e2e8f0' } },
                xaxis: { title: 'Step', color: '#94a3b8', gridcolor: '#334155' },
                yaxis: { title: 'Value', color: '#94a3b8', gridcolor: '#334155' },
                paper_bgcolor: '#0f172a',
                plot_bgcolor: '#0f172a',
                font: { color: '#e2e8f0' },
                legend: { x: 1, y: 1, xanchor: 'right', bgcolor: 'rgba(0,0,0,0.5)' },
                hovermode: 'closest',
                margin: { t: 40, r: 20, b: 40, l: 50 }
            };
            if (scalarChart) Plotly.purge('scalarChart');
            scalarChart = Plotly.newPlot('scalarChart', traces, layout);
        }

        function renderImageGallery() {
            const gallery = document.getElementById('imageGallery');
            gallery.innerHTML = '';
            let hasImages = false;
            for (const [name, data] of Object.entries(currentMetricsData)) {
                if (data.type === 'image' && data.values && data.values.length) {
                    hasImages = true;
                    // Show all images? For brevity, show the last 4 images.
                    const steps = data.steps;
                    const images = data.values;
                    // Display up to 4 most recent images
                    const recent = images.slice(-4);
                    const recentSteps = steps.slice(-4);
                    for (let i = 0; i < recent.length; i++) {
                        const col = document.createElement('div');
                        col.className = 'col-md-3 col-sm-6 mb-3';
                        col.innerHTML = `
                            <div class="card bg-dark border-secondary h-100">
                                <div class="position-relative" style="cursor: pointer;" onclick="viewFullImage('${escapeHtml(recent[i])}', '${escapeHtml(name)} (step ${recentSteps[i]})')">
                                    <img src="${escapeHtml(recent[i])}" class="card-img-top" alt="${escapeHtml(name)}" style="max-height: 140px; object-fit: contain; background: #0f172a;">
                                </div>
                                <div class="card-body p-2">
                                    <small class="text-secondary">${escapeHtml(name)} (step ${recentSteps[i]})</small>
                                </div>
                            </div>
                        `;
                        gallery.appendChild(col);
                    }
                }
            }
            if (!hasImages) {
                gallery.innerHTML = '<div class="col-12 text-secondary text-center py-3">No images logged yet.</div>';
            }
        }

        function renderTableView() {
            const tableView = document.getElementById('tableView');
            tableView.innerHTML = '';
            let hasTables = false;
            for (const [name, data] of Object.entries(currentMetricsData)) {
                if (data.type === 'table' && data.values && data.values.length) {
                    hasTables = true;
                    const lastTable = data.values[data.values.length - 1];
                    const headers = Object.keys(lastTable);
                    let tableHtml = `
                        <h6 class="mt-3">${escapeHtml(name)}</h6>
                        <div class="table-responsive">
                            <table class="table table-dark table-striped table-sm border-secondary">
                                <thead class="table-secondary text-dark">
                                    <tr>${headers.map(h => `<th>${escapeHtml(h)}</th>`).join('')}</tr>
                                </thead>
                                <tbody>
                                    <td>${headers.map(h => `<td>${escapeHtml(String(lastTable[h]))}</td>`).join('')} </tr>
                                </tbody>
                            </table>
                        </div>
                    `;
                    tableView.insertAdjacentHTML('beforeend', tableHtml);
                }
            }
            if (!hasTables) {
                tableView.innerHTML = '<div class="text-secondary text-center py-3">No tables logged yet.</div>';
            }
        }

        // Global function for image modal (called from inline onclick)
        window.viewFullImage = function(imgSrc, title) {
            const modal = document.createElement('div');
            modal.id = 'fullImageModal';
            modal.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1060; display:flex; align-items:center; justify-content:center; cursor:pointer;';
            modal.onclick = () => modal.remove();
            modal.innerHTML = `
                <div style="max-width:90%; max-height:90%; position:relative;">
                    <img src="${escapeHtml(imgSrc)}" style="max-width:100%; max-height:90vh; border-radius:12px; box-shadow:0 0 20px rgba(0,0,0,0.5);">
                    <div style="position:absolute; top:-30px; right:0; color:white; font-size:28px; font-weight:bold; cursor:pointer;">&times;</div>
                    <div class="text-center mt-2 text-secondary">${escapeHtml(title)}</div>
                </div>
            `;
            document.body.appendChild(modal);
        };

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
        }

        // Auto‑refresh control
        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            if (autoRefreshEnabled) autoRefreshInterval = setInterval(loadMetrics, REFRESH_INTERVAL_MS);
        }
        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            const btn = document.getElementById('metricsAutoRefreshToggle');
            if (autoRefreshEnabled) {
                btn.innerHTML = '<i class="fas fa-sync-alt"></i> Auto On';
                btn.classList.remove('btn-outline-secondary');
                btn.classList.add('btn-success');
                startAutoRefresh();
            } else {
                btn.innerHTML = '<i class="fas fa-sync-alt"></i> Auto Off';
                btn.classList.remove('btn-success');
                btn.classList.add('btn-outline-secondary');
                if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            }
        }

        // Event listeners
        document.getElementById('plotSelectedBtn').addEventListener('click', updateScalarChart);
        document.getElementById('metricsForceRefreshBtn').addEventListener('click', loadMetrics);
        document.getElementById('metricsAutoRefreshToggle').addEventListener('click', toggleAutoRefresh);

        // Initial load
        loadMetrics();
        startAutoRefresh();

        // Cleanup on page unload (optional)
        window.addEventListener('beforeunload', () => {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        });
    })();
</script>
