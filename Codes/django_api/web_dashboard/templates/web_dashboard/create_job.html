{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Experiment – Transformer Toolkit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0d1326 100%);
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            color: #eef2ff;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5b6e8c;
        }

        .card {
            background: rgba(20, 28, 40, 0.75);
            backdrop-filter: blur(14px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.4);
            padding: 2rem;
            transition: all 0.2s ease;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .form-control, .form-select {
            background: #0f172a;
            border: 1px solid #2d3a5e;
            border-radius: 16px;
            color: #f1f5f9;
            padding: 12px 16px;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
            background: #0f172a;
            outline: none;
        }

        .form-range {
            background: #334155;
            height: 4px;
        }
        .form-range::-webkit-slider-thumb {
            background: #3b82f6;
        }

        h2 {
            font-weight: 700;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        h4 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #cbd5e1;
            border-left: 4px solid #3b82f6;
            padding-left: 12px;
            margin-bottom: 1.2rem;
        }

        hr {
            border-color: #2d3a5e;
            margin: 1.5rem 0;
        }

        .btn-primary-custom {
            background: linear-gradient(95deg, #2563eb, #7c3aed);
            border: none;
            border-radius: 40px;
            padding: 12px 28px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
            background: linear-gradient(95deg, #3b82f6, #8b5cf6);
        }
        .btn-primary-custom:active {
            transform: translateY(1px);
        }

        .btn-secondary-custom {
            background: #334155;
            border: none;
            border-radius: 40px;
            padding: 10px 20px;
            font-weight: 500;
            transition: 0.2s;
        }
        .btn-secondary-custom:hover {
            background: #475569;
            transform: scale(1.02);
        }

        .alert {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            font-size: 0.9rem;
        }

        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1100;
        }

        .config-preview {
            background: #0f172a;
            border-radius: 20px;
            padding: 1rem;
            margin-top: 1.5rem;
            font-family: monospace;
            font-size: 0.75rem;
            max-height: 200px;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .card {
                padding: 1.5rem;
            }
            .btn-primary-custom {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container-lg">
    <div class="card">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <h2><i class="fas fa-flask me-3"></i>Create New Experiment</h2>
            <a href="/dashboard/" class="btn btn-secondary-custom">
                <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
            </a>
        </div>

        <form id="createExpForm">
            <!-- Experiment container selection -->
            <div class="mb-4">
                <label class="form-label"><i class="fas fa-folder-open me-2"></i>Experiment Container</label>
                <select id="experimentSelect" class="form-select" required>
                    <option value="new">✨ — Create new experiment —</option>
                </select>
                <div id="newExpFields" class="mt-3" style="display: none;">
                    <label class="form-label">Experiment Name <span class="text-danger">*</span></label>
                    <input type="text" id="newExpName" class="form-control" placeholder="e.g., GLUE Benchmark Suite">
                    <label class="form-label mt-3">Description (optional)</label>
                    <textarea id="newExpDesc" class="form-control" rows="2" placeholder="Describe the goal of this experiment set"></textarea>
                </div>
            </div>

            <hr>

            <div class="row g-4">
                <!-- Left column: Model & Architecture -->
                <div class="col-md-6">
                    <h4><i class="fas fa-microchip me-2"></i>Model & Architecture</h4>
                    <label class="form-label">Run Name (optional)</label>
                    <input type="text" id="runName" class="form-control" placeholder="e.g., baseline_sst2_attentionX">

                    <label class="form-label mt-3">Base Model</label>
                    <select id="modelSelect" class="form-select" required>
                        <option value="distilbert-base-uncased">DistilBERT (uncased)</option>
                        <option value="bert-base-uncased">BERT Base</option>
                        <option value="roberta-base">RoBERTa Base</option>
                        <option value="albert-base-v2">ALBERT Base</option>
                    </select>

                    <label class="form-label mt-3">GLUE Task</label>
                    <select id="taskSelect" class="form-select" required>
                        <option value="mrpc">MRPC (Paraphrase)</option>
                        <option value="sst2">SST-2 (Sentiment)</option>
                        <option value="cola">CoLA (Acceptability)</option>
                        <option value="qqp">QQP (Duplicate)</option>
                        <option value="mnli">MNLI (Entailment)</option>
                        <option value="qnli">QNLI (QA)</option>
                        <option value="rte">RTE (Entailment)</option>
                        <option value="wnli">WNLI (Coreference)</option>
                        <option value="stsb">STS-B (Similarity)</option>
                    </select>

                    <label class="form-label mt-3">Attention Type</label>
                    <select id="attentionSelect" class="form-select" required>
                        <option value="">Loading available attentions...</option>
                    </select>

                    <label class="form-label mt-3">Training Method</label>
                    <select id="methodSelect" class="form-select">
                        <option value="baseline">Baseline (Standard)</option>
                        <option value="lora">LoRA (Low‑Rank Adaptation)</option>
                        <option value="rdrop">R‑Drop (Regularization)</option>
                        <option value="r3f">R3F (Noise)</option>
                    </select>
                </div>

                <!-- Right column: Hyperparameters & Scheduling -->
                <div class="col-md-6">
                    <h4><i class="fas fa-sliders-h me-2"></i>Hyperparameters</h4>
                    <div class="row g-2">
                        <div class="col-6"><label class="form-label">Epochs</label><input type="number" id="epochs" class="form-control" value="3" min="1"></div>
                        <div class="col-6"><label class="form-label">Batch Size</label><input type="number" id="batchSize" class="form-control" value="16" min="1"></div>
                        <div class="col-6"><label class="form-label">Learning Rate</label><input type="number" id="lr" class="form-control" value="2e-5" step="1e-6"></div>
                        <div class="col-6"><label class="form-label">Max Seq Length</label><input type="number" id="maxLen" class="form-control" value="128" min="8"></div>
                        <div class="col-6"><label class="form-label">Compression Rank</label><input type="number" id="rank" class="form-control" value="64" min="1"></div>
                        <div class="col-6"><label class="form-label">Memory (GB)</label><input type="number" id="memoryReq" class="form-control" value="8" min="1"></div>
                    </div>

                    <h4 class="mt-3"><i class="fas fa-tachometer-alt me-2"></i>Scheduling & Priority</h4>
                    <div class="row g-2">
                        <div class="col-6"><label class="form-label">Priority (1–10, lower = higher)</label>
                            <div class="d-flex align-items-center gap-2">
                                <span class="small">High</span>
                                <input type="range" id="prioritySlider" class="form-range" min="1" max="10" value="5">
                                <span class="small" id="priorityValue">5</span>
                            </div>
                        </div>
                        <div class="col-6"><label class="form-label">GPUs Required</label><input type="number" id="gpuReq" class="form-control" value="1" min="1"></div>
                        <div class="col-6"><label class="form-label">Estimated Duration (sec)</label><input type="number" id="estimatedDuration" class="form-control" placeholder="optional"></div>
                    </div>
                </div>
            </div>

            <!-- Preview & Submit -->
            <div class="mt-4">
                <button type="button" id="previewBtn" class="btn btn-outline-secondary me-2"><i class="fas fa-eye"></i> Preview Config</button>
                <div id="configPreview" class="config-preview" style="display: none;"></div>
            </div>

            <div class="mt-5 text-end">
                <button type="submit" id="submitBtn" class="btn btn-primary-custom px-5">
                    <i class="fas fa-rocket me-2"></i>Launch Training Run
                </button>
            </div>
        </form>

        <div id="errorMsg" class="alert mt-4" style="display: none;"></div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
    const authToken = localStorage.getItem('authToken');
    if (!authToken) window.location.href = '/login/';

    async function apiFetch(url, options = {}) {
        const res = await fetch(url, {
            ...options,
            headers: { 'Authorization': `Token ${authToken}`, 'Content-Type': 'application/json', ...options.headers }
        });
        if (res.status === 401) { localStorage.removeItem('authToken'); window.location.href = '/login/'; throw new Error('Unauthorized'); }
        return res;
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast align-items-center text-white bg-${type === 'success' ? 'success' : 'danger'} border-0 fade show`;
        toast.setAttribute('role', 'alert');
        toast.innerHTML = `<div class="d-flex"><div class="toast-body">${message}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
        container.appendChild(toast);
        const bsToast = new bootstrap.Toast(toast, { autohide: true, delay: 3000 });
        bsToast.show();
        toast.addEventListener('hidden.bs.toast', () => toast.remove());
    }

    function showError(message) {
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.innerText = message;
        errorDiv.style.display = 'block';
        setTimeout(() => errorDiv.style.display = 'none', 8000);
    }

    function setLoading(loading) {
        const btn = document.getElementById('submitBtn');
        if (loading) {
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Starting...';
        } else {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-rocket me-2"></i>Launch Training Run';
        }
    }

    // Load experiments, attention types, models, tasks
    async function loadExperiments() {
        try {
            const res = await apiFetch('/api/experiments/');
            const experiments = await res.json();
            const select = document.getElementById('experimentSelect');
            experiments.forEach(exp => {
                const opt = document.createElement('option');
                opt.value = exp.id;
                opt.textContent = `${exp.name} (${new Date(exp.created_at).toLocaleDateString()})`;
                select.appendChild(opt);
            });
        } catch(e) { console.warn(e); }
    }

    async function loadConfigs() {
        try {
            const [attRes, modelsRes, tasksRes] = await Promise.all([
                apiFetch('/api/config/attentions/'),
                apiFetch('/api/config/models/'),
                apiFetch('/api/config/tasks/')
            ]);
            const attData = await attRes.json();
            const modelsData = await modelsRes.json();
            const tasksData = await tasksRes.json();

            const attSel = document.getElementById('attentionSelect');
            attSel.innerHTML = '';
            if (attData.attentions?.length) {
                attData.attentions.forEach(att => {
                    const opt = document.createElement('option');
                    opt.value = att;
                    opt.textContent = att;
                    attSel.appendChild(opt);
                });
            } else attSel.innerHTML = '<option value="full">full (default)</option>';

            // Add missing models
            const modelSel = document.getElementById('modelSelect');
            const existingModels = Array.from(modelSel.options).map(o => o.value);
            modelsData.models.forEach(m => {
                if (!existingModels.includes(m)) {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.textContent = m;
                    modelSel.appendChild(opt);
                }
            });

            // Add missing tasks
            const taskSel = document.getElementById('taskSelect');
            const existingTasks = Array.from(taskSel.options).map(o => o.value);
            tasksData.tasks.forEach(t => {
                if (!existingTasks.includes(t)) {
                    const opt = document.createElement('option');
                    opt.value = t;
                    opt.textContent = t.toUpperCase();
                    taskSel.appendChild(opt);
                }
            });
        } catch(e) { showError('Failed to load configuration: ' + e.message); }
    }

    // Priority slider
    const slider = document.getElementById('prioritySlider');
    const prioritySpan = document.getElementById('priorityValue');
    slider.addEventListener('input', () => prioritySpan.innerText = slider.value);

    // Preview config
    document.getElementById('previewBtn').addEventListener('click', () => {
        const config = {
            model_name: document.getElementById('modelSelect').value,
            task_name: document.getElementById('taskSelect').value,
            attention_type: document.getElementById('attentionSelect').value,
            method: document.getElementById('methodSelect').value,
            epochs: parseInt(document.getElementById('epochs').value),
            batch_size: parseInt(document.getElementById('batchSize').value),
            learning_rate: parseFloat(document.getElementById('lr').value),
            max_seq_length: parseInt(document.getElementById('maxLen').value),
            compression_rank: parseInt(document.getElementById('rank').value),
            memory_requirements: parseInt(document.getElementById('memoryReq').value),
            priority: parseInt(slider.value),
            gpu_requirements: parseInt(document.getElementById('gpuReq').value),
            estimated_duration: parseInt(document.getElementById('estimatedDuration').value) || null
        };
        const previewDiv = document.getElementById('configPreview');
        previewDiv.innerHTML = '<pre>' + JSON.stringify(config, null, 2) + '</pre>';
        previewDiv.style.display = 'block';
    });

    // Form submission
    document.getElementById('createExpForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        setLoading(true);
        document.getElementById('errorMsg').style.display = 'none';

        try {
            let experimentId = null;
            if (document.getElementById('experimentSelect').value === 'new') {
                const name = document.getElementById('newExpName').value.trim();
                if (!name) throw new Error('Experiment name required');
                const desc = document.getElementById('newExpDesc').value.trim();
                const createRes = await apiFetch('/api/experiments/create/', {
                    method: 'POST',
                    body: JSON.stringify({ name, description: desc, default_config: {} })
                });
                const newExp = await createRes.json();
                experimentId = newExp.id;
            } else {
                experimentId = document.getElementById('experimentSelect').value;
            }

            const payload = {
                experiment_id: experimentId,
                name: document.getElementById('runName').value.trim() || undefined,
                model_name: document.getElementById('modelSelect').value,
                task_name: document.getElementById('taskSelect').value,
                attention_type: document.getElementById('attentionSelect').value,
                method: document.getElementById('methodSelect').value,
                epochs: parseInt(document.getElementById('epochs').value),
                batch_size: parseInt(document.getElementById('batchSize').value),
                learning_rate: parseFloat(document.getElementById('lr').value),
                max_seq_length: parseInt(document.getElementById('maxLen').value),
                compression_rank: parseInt(document.getElementById('rank').value),
                memory_requirements: parseInt(document.getElementById('memoryReq').value),
                priority: parseInt(slider.value),
                gpu_requirements: parseInt(document.getElementById('gpuReq').value),
                estimated_duration: parseInt(document.getElementById('estimatedDuration').value) || null
            };

            // Validation
            if (isNaN(payload.epochs) || payload.epochs < 1) throw new Error('Epochs must be >=1');
            if (isNaN(payload.batch_size) || payload.batch_size < 1) throw new Error('Batch size must be >=1');
            if (isNaN(payload.learning_rate) || payload.learning_rate <= 0) throw new Error('Learning rate must be positive');

            const res = await apiFetch('/api/jobs/', { method: 'POST', body: JSON.stringify(payload) });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error || 'Submission failed');
            }
            const job = await res.json();
            showToast(`Job "${job.name || job.id.slice(0,8)}" submitted successfully!`, 'success');
            setTimeout(() => { window.location.href = `/monitor/${job.id}/`; }, 1500);
        } catch (err) {
            showError(err.message);
            setLoading(false);
        }
    });

    // Initialisation
    loadExperiments();
    loadConfigs();
    document.getElementById('newExpFields').style.display = 'block'; // show initially
</script>
</body>
</html>
