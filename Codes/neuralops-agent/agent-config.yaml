# =====================================================================
# NeuralOps GPU Provider Agent Configuration
# =====================================================================

# Server Connection
# Base URL for the NeuralOps REST and WebSocket backend
api_base_url: https://api.neuralops.com
ws_base_url: wss://api.neuralops.com

# API Authentication
# API key can also be supplied via NEURALOPS_API_KEY environment variable or CLI --api-key
api_key: ""

# Provider Marketplace Listing Configuration
listing:
  base_price_per_hour: 0.50          # Hourly listing price in USD
  listing_type: on_demand            # on_demand | spot | reserved
  location: "us-east-1"              # Optional geographic region tag
  supports_ssh: true                 # Allow direct SSH access tunnels into containers
  supports_jupyter: false            # Allow direct Jupyter notebook forwarding
  auto_accept_jobs: true             # Automatically accept matching jobs from marketplace

# System & Resource Allocations
resources:
  max_concurrent_jobs: 2             # Maximum concurrent Docker execution containers
  gpu_memory_fraction: 0.90          # Maximum fraction of VRAM allocated to user workloads
  storage_gb: 100                    # Maximum disk storage dedicated for scratch and models
  shm_size: "2g"                     # Shared memory size for PyTorch multiprocessing
  cpu_limit: 4.0                     # Max CPU cores per job container
  memory_limit: "8g"                 # Max system RAM per job container

# Network Health & Monitoring
network:
  speed_test_interval_hours: 24      # Interval for bandwidth performance benchmarks
  heartbeat_interval_seconds: 30     # WebSocket heartbeat ping interval
  telemetry_interval_seconds: 1.0    # Live GPU telemetry streaming rate

# Local Workspace Directories
paths:
  data_dir: ~/.neuralops-agent
  job_dir: ~/.neuralops-agent/jobs
  log_dir: ~/.neuralops-agent/logs
  cache_dir: ~/.neuralops-agent/cache

# Daemon & Auto-Updates
updates:
  auto_update: true                  # Automatically download verified releases
  channel: stable                    # stable | beta | nightly

# Logging Settings
logging:
  level: INFO                        # DEBUG | INFO | WARNING | ERROR
  log_to_file: true
  max_log_bytes: 10485760            # 10 MB per log file rotation
  backup_count: 5