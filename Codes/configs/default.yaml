# ============================================================================
#  EFFICIENT ATTENTION FRAMEWORK – Master Configuration
# ============================================================================

# ----------------------------------------------------------------------------
# Hardware Settings
# ----------------------------------------------------------------------------
hardware:
  device: "auto"                    # auto, mps, cuda, cpu
  force_cpu_for_svd: true           # Use CPU for SVD computation (recommended for MPS)
  enable_fp16: false                # Enable mixed precision (MPS has limited support)
  num_workers: 4                    # DataLoader workers
  pin_memory: false                 # Pin memory (MPS doesn't support)
  torch_compile: false              # Use torch.compile (experimental)

# ----------------------------------------------------------------------------
# Memory Management
# ----------------------------------------------------------------------------
memory:
  gradient_checkpointing: true      # Enable gradient checkpointing (saves memory)
  max_grad_norm: 1.0                # Gradient clipping norm
  empty_cache_every_step: false     # Clear cache after each step (slower but saves memory)
  mixed_precision: false            # Use mixed precision training

# ----------------------------------------------------------------------------
# Data Settings
# ----------------------------------------------------------------------------
data:
  local_glue_path: "/Users/tahamajs/Documents/uni/Project/datasets/glue"
  max_seq_length: 128
  max_train_samples: null           # Limit training samples (null = all)
  max_val_samples: null             # Limit validation samples
  num_proc: 4                       # Number of processes for dataset mapping
  remove_columns: ["label"]         # Columns to remove after tokenization
  streaming: false                  # Use streaming datasets

  # Dataset split mappings
  split_mapping:
    train: "train"
    validation: "validation"
    test: "test"
    validation_matched: "validation_matched"
    validation_mismatched: "validation_mismatched"

# ----------------------------------------------------------------------------
# GLUE Tasks
# ----------------------------------------------------------------------------
glue_tasks:
  - name: "cola"
    type: "classification"
    num_labels: 2
    metric: "matthews_correlation"
    text_keys: ["sentence"]
    regression: false
    skip: false
    
  - name: "sst2"
    type: "classification"
    num_labels: 2
    metric: "accuracy"
    text_keys: ["sentence"]
    regression: false
    skip: false
    
  - name: "mrpc"
    type: "classification"
    num_labels: 2
    metric: "f1"
    text_keys: ["sentence1", "sentence2"]
    regression: false
    skip: false
    
  - name: "qqp"
    type: "classification"
    num_labels: 2
    metric: "f1"
    text_keys: ["question1", "question2"]
    regression: false
    skip: false
    
  - name: "qnli"
    type: "classification"
    num_labels: 2
    metric: "accuracy"
    text_keys: ["question", "sentence"]
    regression: false
    skip: false
    
  - name: "rte"
    type: "classification"
    num_labels: 2
    metric: "accuracy"
    text_keys: ["sentence1", "sentence2"]
    regression: false
    skip: false
    
  - name: "mnli"
    type: "classification"
    num_labels: 3
    metric: "accuracy"
    text_keys: ["premise", "hypothesis"]
    regression: false
    skip: false
    
  - name: "stsb"
    type: "regression"
    num_labels: 1
    metric: "pearson_spearman"
    text_keys: ["sentence1", "sentence2"]
    regression: true
    skip: false
    
  - name: "wnli"
    type: "classification"
    num_labels: 2
    metric: "accuracy"
    text_keys: ["sentence1", "sentence2"]
    regression: false
    skip: true                    # Skip because very small dataset

# ----------------------------------------------------------------------------
# Model Settings
# ----------------------------------------------------------------------------
model:
  name: "distilbert-base-uncased"     # Also: roberta-base, bert-base-uncased, albert-base-v2
  attention_type: "nexus"             # nexus, aegis_v1, aegis_v2, leka_v2, spectra_v2, full, etc.
  rank: 128                           # Default SVD rank (if applicable)
  cache_dir: "./cache"
  use_fast_tokenizer: true
  trust_remote_code: false

  # Model variants to test (for sweeping)
  variants:
    - "bert-base-uncased"
    - "roberta-base"
    - "distilbert-base-uncased"
    - "albert-base-v2"

# ----------------------------------------------------------------------------
# Training Settings
# ----------------------------------------------------------------------------
training:
  batch_size: 32
  eval_batch_size: 64
  epochs: 5
  learning_rate: 1e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  warmup_steps: 0                    # If > 0, overrides warmup_ratio
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  lr_scheduler_type: "linear"        # linear, cosine, constant, polynomial
  optimizer: "adamw"                 # adamw, lion, sgd

  # Early stopping
  early_stopping_patience: null      # Number of epochs with no improvement
  early_stopping_threshold: 0.001    # Minimum improvement to reset patience

  # Checkpointing
  save_strategy: "epoch"             # epoch, steps, no
  save_steps: 500                    # If save_strategy = "steps"
  save_total_limit: 2                # Keep only last N checkpoints
  save_only_model: true              # Save only model weights (not optimizer)
  save_safetensors: true             # Use safetensors format

  # Evaluation
  eval_strategy: "epoch"             # epoch, steps, no
  eval_steps: 500                    # If eval_strategy = "steps"
  eval_delay: 0                      # Epochs to wait before first evaluation
  metric_for_best_model: "accuracy"  # auto-detected per task
  greater_is_better: true

# ----------------------------------------------------------------------------
# Training Methods (LoRA, DoRA, R‑Drop, etc.)
# ----------------------------------------------------------------------------
method:
  name: "baseline"                   # baseline, lora, dora, dislora, rdrop, r3f, mixout, llrd, fisher_lora, fisher_gelora

lora:
  r: 8                              # Rank
  alpha: 16                         # Scaling factor
  dropout: 0.1                      # Dropout rate
  target_modules: ["query", "key", "value", "dense"]

dora:
  r: 8
  alpha: 16
  dropout: 0.1

rdrop:
  alpha: 5.0                        # KL divergence weight

r3f:
  epsilon: 1e-5                     # Noise scale

mixout:
  p: 0.5                            # Mixout probability

llrd:
  decay: 0.95                       # Decay factor per layer

dislora:
  beta: 0.5
  capacity_factor: 1.0

fisher:
  num_batches: 20
  sample_size: 200

gelora:
  margin: 1.0
  min_rank: 2
  max_rank: 32
  scale_max: 2.0

# ----------------------------------------------------------------------------
# Attention‑Specific Parameters
# ----------------------------------------------------------------------------
attention_config:
  # Common
  dropout: 0.1
  
  # Linformer / TokenCompressedAttention
  k_early: 32
  k_mid: 16
  k_late: 12
  progressive: true
  use_gate: true
  gate_bias: 0.0
  max_seq_len: 128
  ortho_reg_weight: 0.0
  use_orthogonal: false

  # LEKA
  num_landmarks: 16
  feature_dim: 128
  use_spherical_norm: true
  kernel: "elu"

  # SpectraV2
  block_size: 64
  top_k_inter: 16
  use_rel_pos_bias: true
  rel_pos_max_distance: 128
  adaptive_span: true
  max_span: 512.0
  rectify_interval: 4
  rff_features: 128
  sph_features: 128
  aks_enabled: true

  # SVD
  svd_energy: 0.95
  svd_rank_qkv: 32
  svd_rank_out: 32

  # Aegis / CUR
  cur_rank: 16
  tile_size: 32
  num_shared_tiles: 64

  # LSH
  lsh_rounds: 4
  lsh_bucket_size: 32
  lsh_n_hashes: 2

  # Softpick
  softpick_enabled: true
  softpick_temperature: 1.0

  # ARMOR / AST / DeltaKV / KVT
  armor_enabled: false
  ast_enabled: false
  deltakv_enabled: false
  kvt_enabled: false

# ----------------------------------------------------------------------------
# Compression Settings (for SVD‑based linear layer compression)
# ----------------------------------------------------------------------------
compression_methods:
  enabled: true
  method: "standard_svd"             # standard_svd, randomized_svd, quantized_svd, adaptive_svd, etc.
  energy_threshold: 0.90
  min_rank: 4
  max_rank: 128

# ----------------------------------------------------------------------------
# Post‑Training Compression
# ----------------------------------------------------------------------------
post_compression:
  enabled: false
  methods:
    - name: "slicegpt"
      sparsity: 0.3
    - name: "sparsegpt"
      sparsity: 0.5
  calibration_samples: 128

# ----------------------------------------------------------------------------
# Experiment Settings
# ----------------------------------------------------------------------------
experiment:
  name: "efficient_attention_experiment"   # Run name prefix
  seed: 42
  num_seeds: 1
  base_seed: 42

  # Filter tasks/models/ranks to test
  limit_tasks: null                     # e.g., ["cola", "mrpc"]
  limit_models: null                    # e.g., ["bert-base-uncased"]
  limit_ranks: null                     # e.g., [32, 64, 128]
  limit_samples_per_task: null          # For debugging (e.g., 100)

  # Output directories
  output_dir: "results"
  plots_dir: "results/plots"
  log_dir: "logs"
  cache_dir: "./cache"

  # Experiment modes
  mode: "full"                          # full, quick, debug, benchmark
  debug: false
  profile: false                        # Enable PyTorch profiler

# ----------------------------------------------------------------------------
# Logging & Visualization
# ----------------------------------------------------------------------------
logging:
  level: "INFO"                         # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  file: "experiment.log"
  logging_steps: 100
  log_params: true
  log_gradients: false
  progress_bar: true

visualization:
  enabled: true
  save_plots: true
  visualizations:
    - "training_curves"
    - "confusion_matrix"
  dpi: 150
  figsize: [12, 8]
  colormap: "viridis"
  save_format: "png"
  generate_report: true

# ----------------------------------------------------------------------------
# Advanced / Experimental
# ----------------------------------------------------------------------------
advanced:
  compile_model: false
  use_flash_attention: false
  use_xformers: false
  svd_compute_uv: true
  svd_driver: "auto"

  distributed:
    enabled: false
    backend: "nccl"
    world_size: 1

# ----------------------------------------------------------------------------
# Debug / Development Settings
# ----------------------------------------------------------------------------
debug:
  enabled: false
  trace_model: false
  trace_attention: false
  print_shapes: false
  verify_gradients: false
  check_nan: true
  break_on_nan: false
