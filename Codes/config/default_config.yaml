# Hardware
device: "auto"                 # auto, mps, cuda, cpu
force_cpu_for_svd: true

# Data
local_glue_path: "/Users/tahamajs/Documents/uni/Project/datasets/glue"
max_seq_length: 128
max_train_samples: null

# Model
model_name: "bert-base-uncased"   # also: roberta-base, distilbert-base-uncased, albert-base-v2
attention_type: "svd"             # svd, full, linformer
rank: 128

# Training
batch_size: 16
eval_batch_size: 32
epochs: 3
learning_rate: 2e-5
weight_decay: 0.01
warmup_ratio: 0.1
gradient_accumulation_steps: 1
max_grad_norm: 1.0
lr_scheduler_type: "linear"

# Logging
output_dir: "results"
logging_steps: 50
save_checkpoints: false
seed: 42

# Visualisation
visualize: true
visualizations: ["attention_heatmap", "entropy", "svd_spectrum"]