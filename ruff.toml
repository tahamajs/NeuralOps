# [tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "paper/",
    "thesis_final/",
    "results/",
    "docs/",
    "notebooks/*.ipynb",
    ".git/",
    ".venv/",
    "build/",
    "dist/",
    "*.egg-info",
]

# [tool.ruff.lint]
[lint]
select = [
    "E",
    "F",
    "B",
    "PIE",
    "F401",
    "F841",
    "F811",
    "PIE790",
    "B006",
    "B008",
]
ignore = [
    "N803",
    "N806",  # B, H, N, D for tensor dims (ML standard)
    "E501",  # long lines
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D205",
    "D400",
    "E402",  # module level import not at top of file (sys.path manipulation in scripts)
    "E741",  # ambiguous variable name
    "B023",  # function definition does not bind loop variable
    "E731",  # do not assign a lambda expression, use a def
    "B007",  # loop control variable not used within loop body
    "B905",  # zip() without explicit strict= parameter
]
unfixable = [
    "B006",  # mutable default — flag error, do not auto-remove
]

