name: Production Serving & Inference Test Suite

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'paper/**'
      - 'results/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'paper/**'
      - 'results/**'
  workflow_dispatch:

jobs:
  test-serving:
    name: Paged Cache & Speculative Decoding
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install CPU PyTorch & Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[cpu,dev]"

      - name: Run Paged Cache & Speculative Decoding Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_fast.py \
                 tests/test_paged_cache.py \
                 tests/test_self_speculative_decoding.py \
                 tests/test_paged_state_and_radix_prefix_cache.py \
                 -v --tb=short
