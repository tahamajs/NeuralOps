name: Build Binary Wheels

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} - Py${{ matrix.python-version }} CUDA ${{ matrix.cuda-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.10", "3.11", "3.12"]
        cuda-version: ["11.8", "12.1", "12.4"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install cibuildwheel and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel build wheel torch

      - name: Configure CUDA Environment
        run: |
          echo "Building wheel for Python ${{ matrix.python-version }} with CUDA ${{ matrix.cuda-version }}"
          echo "CUDA_VERSION=${{ matrix.cuda-version }}" >> $GITHUB_ENV
          echo "TORCH_CUDA_ARCH_LIST=8.0;8.6;8.9;9.0" >> $GITHUB_ENV

      - name: Build wheels via cibuildwheel
        run: |
          python -m cibuildwheel --output-dir dist/
        env:
          CIBW_BUILD: "cp${{ matrix.python-version }}-*"
          CIBW_ARCHS_LINUX: "x86_64"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-py${{ matrix.python-version }}-cuda${{ matrix.cuda-version }}
          path: dist/*.whl
          retention-days: 7
