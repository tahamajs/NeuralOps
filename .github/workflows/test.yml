name: Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'paper/**'
      - 'results/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'paper/**'
      - 'results/**'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: pip install -e ".[dev,cpu]"
      - env:
          PYTHONPATH: .
        run: pytest tests/test_fast.py tests/test_framework_completeness.py -q --tb=short
