name: Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'paper/**'
      - 'results/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'paper/**'
      - 'results/**'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: pytest neuralops/tests/test_all_attention_modules.py neuralops/tests/test_all_compressor_modules.py -q --tb=short
