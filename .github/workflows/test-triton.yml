name: Triton Kernels Test Suite

on:
  push:
    branches: [main, ablation]
  pull_request:
    branches: [main, ablation]

jobs:
  test-triton:
    name: Triton Kernels & Fallbacks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          pip install \
            transformers datasets scikit-learn scipy pandas numpy \
            tqdm matplotlib PyYAML pyarrow accelerate tabulate pytest

      - name: Run Triton Test Suite (Fallbacks & Logic)
        env:
          PYTHONPATH: .
        run: |
          pytest neuralops/tests/test_triton_*.py -v
