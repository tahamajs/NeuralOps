name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'Docs/**'
      - 'Codes/framework/**'
      - 'generate_catalog.py'
      - '.github/workflows/deploy_docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'gh-pages-deploy'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Generate Documentation Catalog
        run: |
          python generate_catalog.py

      - name: Prepare Static Site (Lightweight Bundle)
        run: |
          mkdir -p _site
          # Copy Web UI core files
          cp -r Docs/* _site/
          
          # Copy only markdown documentation files to keep the site lightweight and fast
          mkdir -p _site/Codes/framework/attentions
          mkdir -p _site/Codes/framework/compression_engine
          
          cp Codes/framework/*.md _site/Codes/framework/ 2>/dev/null || true
          cp Codes/framework/attentions/*.md _site/Codes/framework/attentions/ 2>/dev/null || true
          cp Codes/framework/compression_engine/*.md _site/Codes/framework/compression_engine/ 2>/dev/null || true

      - name: Deploy to GitHub Pages (gh-pages branch - Bypasses Artifact Quotas)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
