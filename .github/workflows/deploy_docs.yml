name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "neuralops/**"
      - ".github/workflows/deploy_docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pdoc (Explicitly from PyPI)
        run: |
          python -m pip install --upgrade pip --index-url https://pypi.org/simple
          pip install pdoc --index-url https://pypi.org/simple

      - name: Install CPU-only PyTorch
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies (Explicitly from PyPI)
        run: |
          pip install \
            transformers datasets scikit-learn scipy pandas numpy \
            tqdm matplotlib PyYAML accelerate \
            --index-url https://pypi.org/simple

      - name: Generate HTML API Docs
        env:
          PYTHONPATH: .
          MPLCONFIGDIR: /tmp/matplotlib_cache
        run: |
          mkdir -p /tmp/matplotlib_cache docs/api
          pdoc --output-dir docs/api neuralops || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
