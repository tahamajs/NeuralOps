name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'paper/**'
      - 'results/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'paper/**'
      - 'results/**'

jobs:
  version-check:
    name: Version Synchronization Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Version Sync Check
        run: |
          python scripts/utils/sync_version.py --check

  test-layout:
    name: Test Layout Structure Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify 1:1 Subsystem to Test Directory Mapping
        run: |
          python scripts/ci/check_test_layout.py
      - name: Run Layout Guard Unit Tests
        run: |
          pip install pytest
          pytest tests/test_test_layout_check.py -v

  lint:
    name: Code Style & Static Analysis (ruff, black, isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort
      - name: Lint with ruff
        run: |
          ruff check neuralops tests
      - name: Check code formatting with black
        run: |
          black --check neuralops tests
      - name: Check import ordering with isort
        run: |
          isort --check-only neuralops tests
      - name: Run pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files

  mypy:
    name: Static Type Checking (mypy baseline scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[cpu,dev]"
      - name: Run mypy on baseline core scope
        run: |
          mypy --follow-imports=silent neuralops/core/exceptions.py neuralops/core/config.py neuralops/core/registry.py neuralops/utils/seed.py neuralops/__init__.py

  wheel-smoke:
    name: Distribution Wheel Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel and verify CLI entry points in clean environment
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --no-isolation
          python -m venv /tmp/neuralops-smoke-venv
          /tmp/neuralops-smoke-venv/bin/pip install dist/*.whl
          /tmp/neuralops-smoke-venv/bin/neuralops --help
          /tmp/neuralops-smoke-venv/bin/neuralops info
          /tmp/neuralops-smoke-venv/bin/python -c "import neuralops; print(neuralops.__version__)"

  test-fast:
    name: Fast Unit & Parity Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[cpu,dev,mlops]"
      - name: Run unit & parity tests with coverage
        run: |
          pytest tests/test_fast.py tests/test_framework_completeness.py -v --cov=neuralops --cov-report=xml --cov-report=term -p no:cacheprovider
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          # fail_ci_if_error is false to prevent external Codecov service / token issues from blocking CI
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Dry-run verification and planning suite
        env:
          PYTHONPATH: .
        run: |
          python -m neuralops.benchmarks verify
          python -m neuralops.benchmarks plan --all-attn

  test-full:
    name: Full CPU Regression Suite (${{ matrix.os }}, py${{ matrix.python-version }})
    # Scope: Runs complete test suite excluding hardware-dependent GPU and Triton marks.
    # GPU and Triton tests are validated in dedicated workflows and HPC cluster jobs.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[cpu,dev,mlops]"
      - name: Run non-GPU and non-Triton regression tests
        run: |
          pytest tests/ -m "not gpu and not triton" --tb=short

  cpu-smoke:
    name: CPU Smoke & Skip-Ratio Guard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[cpu,dev]"
      - name: Run CPU Smoke Tests with JUnit XML
        run: |
          pytest -m "not gpu and not triton and not slow" --junitxml=junit-cpu-smoke.xml -q || true
      - name: Verify Test Execution & Skip Ratio
        run: |
          python scripts/ci/check_skip_ratio.py junit-cpu-smoke.xml --max-skip-ratio 0.50
      - name: Upload JUnit XML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpu-smoke-junit-${{ matrix.os }}
          path: junit-cpu-smoke.xml
