name: CI & Full Stack Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework-ci:
    name: PyTorch Framework Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyTorch & Framework Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy pytest flake8 transformers einops matplotlib scikit-learn psutil pyyaml pandas datasets evaluate timm

      - name: Validate Documentation Catalog Sync
        run: |
          python generate_catalog.py
          git diff --exit-code Docs/catalog.json || (echo "Docs/catalog.json is out of sync. Please run python generate_catalog.py" && exit 1)

      - name: Verify Python Module Syntax
        run: |
          python -m compileall Codes/framework/

      - name: Run Framework Unit Tests
        run: |
          PYTHONPATH=Codes/framework:Codes python -m unittest discover -s Codes/framework/tests

      - name: Run Master Framework 6-Stage Integration Suite
        run: |
          PYTHONPATH=Codes python Codes/framework/test_all_framework.py

  django-backend-ci:
    name: Django Backend & REST API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install django>=4.2 djangorestframework>=3.14 django-cors-headers>=4.0 django-filter>=23.0 django-extensions>=3.2 channels>=4.0 daphne>=4.0 channels-redis>=4.0 djangorestframework-simplejwt>=5.3.0 python-decouple>=3.8 django-allauth pytest pytest-django pynvml transformers datasets evaluate scikit-learn pandas psutil pyyaml requests python-dateutil einops timm

      - name: Run Django System Check
        working-directory: Codes/django_api
        run: |
          python manage.py check

      - name: Run Django Test Suite
        working-directory: Codes/django_api
        run: |
          python manage.py test api.test_attention_dashboard experiment.test_experiments_api web_dashboard --keepdb

      - name: Verify All 78 Django Apps Ecosystem
        working-directory: Codes/django_api
        run: |
          python verify_all_django_apps.py

  frontend-ci:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: Codes/frontend
        run: |
          npm install --legacy-peer-deps

      - name: Run Production Vite Build
        working-directory: Codes/frontend
        run: |
          npm run build

  docs-hub-ci:
    name: Research Hub Documentation SPA Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Catalog Consistency
        run: |
          python generate_catalog.py
          git diff --exit-code Docs/catalog.json

  neuralops-agent-ci:
    name: NeuralOps Agent & GUI Bridge Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Agent Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest psutil pyyaml requests websocket-client pynvml PySocks docker

      - name: Run NeuralOps Agent 99-Test Suite
        working-directory: Codes/neuralops-agent
        run: |
          pytest tests/ -v
