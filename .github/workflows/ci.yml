name: NeuralOps CI & Reproducibility Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test-and-reproducibility:
    name: NeurIPS/ICLR CI Reproducibility Check
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install CPU-only PyTorch and Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install transformers datasets scikit-learn scipy pandas numpy tqdm matplotlib PyYAML pyarrow codecarbon fvcore accelerate tabulate pytest pdoc

    - name: Syntax and Bytecode Check
      run: |
        python -m py_compile neuralops/**/*.py

    - name: Execute Minimal Benchmark Sweep (Smoke Test)
      env:
        PYTHONPATH: .
      run: |
        # Run a small sweep or test script to verify imports and execution
        python neuralops/benchmarks/run_long_context_sweep.py --help || true

    - name: Run Core Pytest Suite
      env:
        PYTHONPATH: .
      run: |
        # Run the tests
        pytest neuralops/tests -v --maxfail=5
