name: NeuralOps CI & Reproducibility Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff format check
        run: ruff format --check neuralops paper
      - name: Ruff lint check
        run: ruff check --select I neuralops paper

  smoke-test:
    name: Smoke Test & Reproducibility Check
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          pip install \
            transformers datasets scikit-learn scipy pandas numpy \
            tqdm matplotlib PyYAML pyarrow accelerate tabulate pytest

      - name: Syntax & bytecode check
        run: |
          python -m compileall -q neuralops/

      - name: Import smoke test
        env:
          PYTHONPATH: .
        run: |
          python -c "import neuralops; print('neuralops OK:', neuralops.__version__)"

      - name: Benchmark help check
        env:
          PYTHONPATH: .
        run: |
          python neuralops/benchmarks/run_long_context_sweep.py --help || true

      - name: Run Core Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          pytest neuralops/tests -v --maxfail=5 -q

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pdoc and stubs
        run: |
          python -m pip install --upgrade pip
          pip install pdoc

      - name: Install minimal package stubs for import
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers datasets scikit-learn scipy pandas numpy tqdm matplotlib PyYAML accelerate

      - name: Generate API docs (dry run — verify no import errors)
        env:
          PYTHONPATH: .
          MPLCONFIGDIR: /tmp/matplotlib_cache
        run: |
          mkdir -p /tmp/matplotlib_cache
          pdoc --output-dir /tmp/api_docs neuralops || true
          echo "pdoc completed"
