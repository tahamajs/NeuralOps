name: NeuralOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install transformers datasets accelerate scikit-learn scipy numpy pandas matplotlib seaborn tabulate pydantic psutil tqdm pytest pytest-cov codecarbon

    - name: Syntax and Bytecode Compilation Check
      run: |
        python -m py_compile Codes/framework/attentions/*.py
        python -m py_compile Codes/framework/compression_engine/*.py
        python -m py_compile Codes/framework/*.py

    - name: Run Test Suite
      env:
        PYTHONPATH: Codes:.
      run: |
        python -m pytest Codes/framework/tests/ -v --tb=short -k "not gpu" || true
