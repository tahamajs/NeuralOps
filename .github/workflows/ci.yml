name: Framework CI & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-docs-and-modules:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install Base Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy pytest flake8

      - name: Validate Catalog Generation
        run: |
          python generate_catalog.py
          git diff --exit-code Docs/catalog.json || (echo "Docs/catalog.json is out of sync with framework modules. Please run python generate_catalog.py" && exit 1)

      - name: Verify Python Module Syntax
        run: |
          python -m compileall Codes/framework/
