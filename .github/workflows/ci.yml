name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[cpu,dev,mlops]"

    - name: Lint with ruff
      run: |
        ruff check neuralops tests

    - name: Run unit & parity tests with coverage
      run: |
        pytest tests/ -v --cov=neuralops --cov-report=xml --cov-report=term -p no:cacheprovider

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Verify README counts and Registry Integrity
      run: |
        python scripts/utils/verify_readme_counts.py

    - name: Dry-run verification and planning suite
      run: |
        python -m neuralops.benchmarks verify
        python -m neuralops.benchmarks plan --all-attn
