name: Bug Report
description: Report a defect, error, or unexpected behavior in NeuralOps
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please verify your setup using `python -m neuralops.benchmarks verify` before submitting.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: input
    id: module_name
    attributes:
      label: Affected Module / Component
      description: E.g., `cosformer`, `adasvd`, `compilable_linear_attn`, `neuralops export`
    validations:
      required: false

  - type: dropdown
    id: backend
    attributes:
      label: Execution Backend
      options:
        - CUDA (NVIDIA GPU)
        - ROCm (AMD GPU)
        - Apple Silicon (MPS)
        - CPU
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal Reproduction Code
      description: A minimal, self-contained Python script or CLI command that reproduces the problem.
      render: python
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment & Verification Output
      description: Paste the output of `python -m neuralops.benchmarks verify` or `python -c "import torch, neuralops; print(torch.__version__, neuralops.__version__)"`.
      render: shell
    validations:
      required: true
