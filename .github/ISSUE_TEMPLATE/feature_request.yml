name: Feature / Architecture Request
description: Propose a new attention mechanism, compression engine, Triton kernel, or framework feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome proposals for new research papers, attention variants, model compression methods, and system optimizations!

  - type: textarea
    id: problem
    attributes:
      label: Motivation / Paper Reference
      description: What is the paper reference (arXiv link), algorithm, or architectural bottleneck you would like to address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / Interface
      description: Describe how this should be integrated into NeuralOps (e.g., registry category, CLI flags, fallback behavior).
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Target Component
      options:
        - Attention Mechanism (`neuralops/attentions/`)
        - Compression Engine (`neuralops/compression_engine/`)
        - Triton Kernel (`neuralops/core/triton_kernels/`)
        - Production Export / Serving (`neuralops/export/`)
        - MLOps & Benchmarks (`neuralops/benchmarks/`)
        - Documentation / Examples
    validations:
      required: true
