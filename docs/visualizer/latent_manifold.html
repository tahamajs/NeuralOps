<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuralOps · 3D Latent Manifold & SVD Spectral Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --bg: #090d16;
            --surface: rgba(18, 24, 38, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .hud-overlay {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 10;
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            width: 360px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 0.25rem;
        }
        p.subtitle {
            font-size: 0.825rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
        }
        .control-group {
            margin-bottom: 1rem;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }
        label span.val {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-main);
            font-weight: 600;
        }
        select, input[type=range] {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 0.4rem;
            font-size: 0.85rem;
            outline: none;
        }
        .hud-stats {
            position: absolute;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 10;
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            display: flex;
            gap: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .stat-item {
            text-align: right;
        }
        .stat-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
        }
        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .back-link {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 10;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .back-link:hover {
            background: var(--accent);
            color: #000;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="hud-overlay">
        <div class="badge">NeuralOps WebGL Manifold Engine</div>
        <h1>SVD Latent Manifold</h1>
        <p class="subtitle">Interactive 3D representation of Attention Latent Space & Low-Rank Singular Decay</p>

        <div class="control-group">
            <label><span>Target Architecture / Layer</span></label>
            <select id="layer-select">
                <option value="svd_linear">Layer 11 · SVD-Linear Attention (Rank 16)</option>
                <option value="hgrn2">Layer 08 · HGRN2 Gated DeltaNet</option>
                <option value="mamba_ssm">Layer 06 · Mamba Selective Scan State</option>
                <option value="dense_target">Layer 12 · Dense Softmax Reference</option>
            </select>
        </div>

        <div class="control-group">
            <label><span>Truncation Rank (r)</span> <span class="val" id="val-rank">16</span></label>
            <input type="range" id="rank-slider" min="2" max="64" step="2" value="16">
        </div>

        <div class="control-group">
            <label><span>Spectral Decay Curvature (α)</span> <span class="val" id="val-alpha">1.45</span></label>
            <input type="range" id="alpha-slider" min="0.1" max="3.0" step="0.05" value="1.45">
        </div>

        <div class="control-group">
            <label><span>Wireframe Mesh / Shading</span></label>
            <select id="shading-select">
                <option value="smooth">Quantum Iridescent Shading</option>
                <option value="wireframe">Pure Topological Wireframe</option>
                <option value="points">Sparse Latent Point Cloud</option>
            </select>
        </div>
    </div>

    <div class="hud-stats">
        <div class="stat-item">
            <div class="stat-num" id="stat-ratio">4.00x</div>
            <div class="stat-label">Theoretical Compression</div>
        </div>
        <div class="stat-item">
            <div class="stat-num" id="stat-err">0.024</div>
            <div class="stat-label">Frobenius Norm Error</div>
        </div>
        <div class="stat-item">
            <div class="stat-num">60 FPS</div>
            <div class="stat-label">WebGL Hardware Accel</div>
        </div>
    </div>

    <a href="/docs/dashboard.html" class="back-link">← Return to Dashboard</a>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x090d16, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 35, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;

        // Ambient and directional lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x38bdf8, 2, 100);
        pointLight1.position.set(20, 30, 20);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x818cf8, 2, 100);
        pointLight2.position.set(-20, -10, -20);
        scene.add(pointLight2);

        // Ground reference grid
        const gridHelper = new THREE.GridHelper(80, 40, 0x1e293b, 0x0f172a);
        gridHelper.position.y = -10;
        scene.add(gridHelper);

        // Generate parametric manifold surface
        const size = 50;
        const segments = 80;
        let geometry = new THREE.PlaneGeometry(size, size, segments, segments);
        geometry.rotateX(-Math.PI / 2);

        const material = new THREE.MeshStandardMaterial({
            color: 0x38bdf8,
            roughness: 0.2,
            metalness: 0.8,
            wireframe: false,
            side: THREE.DoubleSide
        });

        const manifoldMesh = new THREE.Mesh(geometry, material);
        scene.add(manifoldMesh);

        function updateManifold(rank, alpha, mode) {
            const pos = geometry.attributes.position;
            const time = performance.now() * 0.001;

            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const z = pos.getZ(i);
                const dist = Math.sqrt(x * x + z * z);
                
                // Low-rank SVD singular value decay mathematical equation
                const decay = Math.exp(-alpha * (dist / 15.0));
                const harmonic = Math.sin(x * 0.3 + time) * Math.cos(z * 0.3 + time) * (rank / 10.0);
                const y = Math.sin(dist * 0.4 - time * 1.5) * decay * 6.0 + harmonic * 0.4;
                
                pos.setY(i, y);
            }
            pos.needsUpdate = true;
            geometry.computeVertexNormals();

            // Update stats
            document.getElementById('stat-ratio').innerText = (64 / rank).toFixed(2) + 'x';
            document.getElementById('stat-err').innerText = (0.015 + (1.0 / rank) * 0.15 * alpha).toFixed(4);
        }

        // DOM Event Listeners
        const rankSlider = document.getElementById('rank-slider');
        const alphaSlider = document.getElementById('alpha-slider');
        const rankVal = document.getElementById('val-rank');
        const alphaVal = document.getElementById('val-alpha');
        const shadingSelect = document.getElementById('shading-select');

        rankSlider.addEventListener('input', (e) => {
            rankVal.innerText = e.target.value;
            updateManifold(parseFloat(e.target.value), parseFloat(alphaSlider.value));
        });

        alphaSlider.addEventListener('input', (e) => {
            alphaVal.innerText = e.target.value;
            updateManifold(parseFloat(rankSlider.value), parseFloat(e.target.value));
        });

        shadingSelect.addEventListener('change', (e) => {
            if (e.target.value === 'wireframe') {
                material.wireframe = true;
            } else if (e.target.value === 'smooth') {
                material.wireframe = false;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateManifold(parseFloat(rankSlider.value), parseFloat(alphaSlider.value));
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
