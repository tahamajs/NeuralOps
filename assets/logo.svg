<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#03060b" />
    </linearGradient>

    <linearGradient id="glowStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Clean Minimal Frame -->
  <rect width="512" height="512" rx="112" fill="url(#logoBg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Geometric Hexagon -->
  <polygon points="256,110 382,183 382,329 256,402 130,329 130,183" fill="none" stroke="url(#glowStroke)" stroke-width="6" stroke-linejoin="round" />

  <!-- Precision Internal Node Links -->
  <g stroke="url(#glowStroke)" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="256" x2="256" y2="110" />
    <line x1="256" y1="256" x2="382" y2="329" />
    <line x1="256" y1="256" x2="130" y2="329" />
  </g>

  <!-- Minimal Focal Node -->
  <circle cx="256" cy="256" r="14" fill="#38bdf8" />
  <circle cx="256" cy="110" r="7" fill="#38bdf8" />
  <circle cx="382" cy="183" r="5" fill="#818cf8" />
  <circle cx="382" cy="329" r="7" fill="#818cf8" />
  <circle cx="256" cy="402" r="5" fill="#818cf8" />
  <circle cx="130" cy="329" r="7" fill="#818cf8" />
  <circle cx="130" cy="183" r="5" fill="#38bdf8" />
</svg>
