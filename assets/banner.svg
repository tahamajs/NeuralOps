<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean Minimal Dark Canvas -->
  <rect width="1200" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="238" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1" />

  <!-- Minimal Brand Mark (Geometric Node Emblem) -->
  <g transform="translate(600, 62)">
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="none" stroke="url(#accentGrad)" stroke-width="2" filter="url(#subtleGlow)" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    <circle cx="0" cy="-28" r="2.5" fill="#38bdf8" />
    <circle cx="24" cy="14" r="2.5" fill="#818cf8" />
    <circle cx="-24" cy="14" r="2.5" fill="#818cf8" />
  </g>

  <!-- Title: Clean Minimal NeuralOps -->
  <text x="600" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="40" font-weight="800" fill="#f8fafc" letter-spacing="1.2" text-anchor="middle">
    NEURAL<tspan fill="url(#accentGrad)">OPS</tspan>
  </text>

  <!-- Subtitle: Crisp & Concise -->
  <text x="600" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.3" text-anchor="middle">
    Unified Platform for Subquadratic Attention &amp; Deep Model Compression
  </text>

  <!-- Minimal Pill Tagline -->
  <g transform="translate(600, 195)">
    <rect x="-190" y="-13" width="380" height="26" rx="13" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="4.5" font-family="'SF Mono', Monaco, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#cbd5e1" text-anchor="middle">
      131 Attentions · 72 Compressors · Triton &amp; CUDA
    </text>
  </g>
</svg>
