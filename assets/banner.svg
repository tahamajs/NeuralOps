<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#101326" />
      <stop offset="100%" stop-color="#07080f" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Neural Network / Grid Lines Background -->
  <g opacity="0.12" stroke="#4facfe" stroke-width="1">
    <line x1="50" y1="40" x2="250" y2="180" />
    <line x1="250" y1="180" x2="150" y2="300" />
    <line x1="150" y1="300" x2="350" y2="280" />
    <line x1="250" y1="180" x2="450" y2="120" />
    <line x1="950" y1="60" x2="1100" y2="180" />
    <line x1="1100" y1="180" x2="1000" y2="290" />
    <line x1="850" y1="220" x2="1000" y2="290" />
    <line x1="750" y1="100" x2="950" y2="60" />
    <!-- Grid dots -->
    <circle cx="50" cy="40" r="3" fill="#00f2fe" />
    <circle cx="250" cy="180" r="4" fill="#4facfe" />
    <circle cx="150" cy="300" r="3" fill="#7f00ff" />
    <circle cx="350" cy="280" r="3" fill="#00f2fe" />
    <circle cx="450" cy="120" r="4" fill="#4facfe" />
    <circle cx="750" cy="100" r="3" fill="#7f00ff" />
    <circle cx="950" cy="60" r="4" fill="#00f2fe" />
    <circle cx="1100" cy="180" r="4" fill="#4facfe" />
    <circle cx="1000" cy="290" r="3" fill="#7f00ff" />
    <circle cx="850" cy="220" r="3" fill="#00f2fe" />
  </g>

  <!-- Central Brand Logo Mark -->
  <g transform="translate(600, 78)">
    <!-- Hexagonal Glow Ring -->
    <polygon points="0,-42 36,-21 36,21 0,42 -36,21 -36,-21" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" filter="url(#glow)" opacity="0.85" />
    <!-- Central Node Interconnections -->
    <path d="M-22,-12 L0,0 L22,-12 M0,0 L0,26 M-22,12 L0,0 L22,12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />
    <circle cx="0" cy="0" r="5" fill="#00f2fe" filter="url(#subtleGlow)" />
    <circle cx="-22" cy="-12" r="3.5" fill="#4facfe" />
    <circle cx="22" cy="-12" r="3.5" fill="#4facfe" />
    <circle cx="0" cy="26" r="3.5" fill="#7f00ff" />
    <circle cx="-22" cy="12" r="3" fill="#7f00ff" />
    <circle cx="22" cy="12" r="3" fill="#7f00ff" />
  </g>

  <!-- Title: NeuralOps -->
  <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">
    NEURAL<tspan fill="url(#primaryGrad)">OPS</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="0.5" text-anchor="middle">
    Unified Platform for Subquadratic Attention &amp; Deep Model Compression
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(600, 245)">
    <!-- Badge 1: 131 Attention Mechanisms -->
    <g transform="translate(-370, 0)">
      <rect x="0" y="0" width="165" height="34" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
      <text x="82.5" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">⚡ 131 Attentions</text>
    </g>
    <!-- Badge 2: 72 Compressors -->
    <g transform="translate(-185, 0)">
      <rect x="0" y="0" width="170" height="34" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
      <text x="85" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#a855f7" text-anchor="middle">🗜️ 72 Compressors</text>
    </g>
    <!-- Badge 3: 114 Native CUDA Kernels -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="175" height="34" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
      <text x="87.5" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#22c55e" text-anchor="middle">🔥 114 CUDA Kernels</text>
    </g>
    <!-- Badge 4: 62 Triton Kernels -->
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="170" height="34" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
      <text x="85" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">🚀 62 Triton Kernels</text>
    </g>
  </g>

  <!-- Bottom Command Snippet -->
  <g transform="translate(600, 305)">
    <rect x="-140" y="-14" width="280" height="28" rx="6" fill="#030712" stroke="#1f2937" stroke-width="1" />
    <text x="0" y="5" font-family="'SF Mono', Monaco, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">
      <tspan fill="#64748b">$</tspan> pip install neuralops
    </text>
  </g>
</svg>
