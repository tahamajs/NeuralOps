[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralops"
version = "1.5.0"
description = "A Production-Grade Framework for Subquadratic Attention, Model Compression, and Hardware-Aware Transformer Optimization"

readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Taha Majlesi", email = "tahamaj4@gmail.com" }
]
keywords = [
    "attention", "transformer", "compression", "svd",
    "linear-attention", "quantization", "pruning",
    "triton", "pytorch", "deep-learning"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "packaging>=23.0",
]

[project.optional-dependencies]
# NVIDIA GPU (recommended for training)
cuda = [
    "torch>=2.2.0",
    "triton>=2.3.0; sys_platform == 'linux'",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "einops>=0.7.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "packaging>=23.0",
]

# AMD GPU
rocm = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "einops>=0.7.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "packaging>=23.0",
]

# Apple Silicon (MPS)
mps = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "einops>=0.7.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "packaging>=23.0",
]

# CPU-only
cpu = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "einops>=0.7.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "packaging>=23.0",
]

# Evaluation
eval = [
    "scikit-learn>=1.3.0",
    "evaluate>=0.4.0",
    "lm-eval>=0.4.0",
]

# Benchmarking
benchmark = [
    "matplotlib",
    "pandas",
    "seaborn",
]

# MLOps & Experiment Tracking
mlops = [
    "wandb",
    "mlflow",
    "tensorboard",
    "accelerate",
]

# Production Export & Serving
export = [
    "safetensors",
    "onnx",
    "onnxruntime",
]

# Test
test = [
    "pytest",
    "pytest-cov",
]

# Development
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "pdoc3>=0.10.0",
]

# Documentation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "pdoc3>=0.10.0",
]

# Everything
all = [
    "neuralops[mlops,export]",
]


[project.scripts]
neuralops = "neuralops.benchmarks.cli:main"
neuralops-cli = "neuralops.benchmarks.cli:main"
nops = "neuralops.benchmarks.cli:main"
nops-cli = "neuralops.benchmarks.cli:main"
neuralops-eval = "neuralops.experiments.evaluation.cli:main"

[project.entry-points."vllm.general_plugins"]
neuralops_vllm = "neuralops.integrations.vllm:register_neuralops_vllm_plugin"


[project.urls]
Homepage = "https://github.com/tahamajs/NeuralOps"
Repository = "https://github.com/tahamajs/NeuralOps"
Issues = "https://github.com/tahamajs/NeuralOps/issues"
Documentation = "https://github.com/tahamajs/NeuralOps#readme"
Changelog = "https://github.com/tahamajs/NeuralOps/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuralops*"]
exclude = [
    "tests*",
    "benchmarks*",
    "eval*",
    "results*",
    "paper*",
    "thesis_final*",
    "docs*",
    "academic*",
    "neuralops.tests*",
    "neuralops.benchmarks*",
    "neuralops._archive*",
    "neuralops.core._archive*",
    "neuralops.attentions._legacy*",
    "neuralops.compression_engine._legacy*",
    "scripts*",
]

[tool.setuptools.package-data]
neuralops = [
    "core/*.json",
    "**/py.typed",
    "**/*.cu",
    "**/*.cuh",
    "**/*.cpp",
    "**/*.h",
]

[tool.setuptools.exclude-package-data]
"*" = [
    "tests*",
    "benchmarks*",
    "eval*",
    "results*",
    "paper*",
    "thesis_final*",
    "docs*",
    "academic*",
]
neuralops = [
    "benchmarks/*",
    "benchmarks/**",
    "tests/*",
    "tests/**",
    "evaluation/*",
    "evaluation/**",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
