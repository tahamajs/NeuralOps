[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralops"
version = "1.7.0"
description = "A Production-Grade Framework for Subquadratic Attention, Model Compression, and Hardware-Aware Transformer Optimization"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Taha Majlesi", email = "tahamaj4@gmail.com" }
]
keywords = [
    "attention", "transformer", "compression", "svd",
    "linear-attention", "quantization", "pruning",
    "triton", "pytorch", "deep-learning"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "packaging>=23.0",
    "rich>=13.0",
    "psutil>=5.9",
    "scikit-learn>=1.3",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
core = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "einops>=0.7.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "packaging>=23.0",
    "rich>=13.0",
    "psutil>=5.9",
    "scikit-learn>=1.3",
    "huggingface-hub>=0.20",
]

cuda = [
    "neuralops[core]",
    "triton>=2.3.0; sys_platform == 'linux'",
]

rocm = ["neuralops[core]"]
mps = ["neuralops[core]"]
cpu = ["neuralops[core]"]

eval = [
    "scikit-learn>=1.3.0",
    "evaluate>=0.4.0",
    "lm-eval>=0.4.0",
]

serving = [
    "transformers>=4.40.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]

evaluation-experiments = [
    "transformers>=4.40.0",
    "numpy>=1.24.0",
]

benchmark = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "seaborn>=0.13",
    "rich>=13.0.0",
    "psutil>=5.9.0",
]

mlops = [
    "wandb>=0.16",
    "mlflow>=2.5",
    "tensorboard>=2.15",
    "accelerate>=0.25",
]

export = [
    "safetensors>=0.4",
    "onnx>=1.15",
    "onnxruntime>=1.17",
]

test = ["neuralops[dev]"]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "pdoc3>=0.10.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "pdoc3>=0.10.0",
]

flash_attn = [
    "flash_attn; sys_platform == 'linux'",
]

mamba = [
    "mamba_ssm; sys_platform == 'linux'",
]

unsloth = [
    "unsloth; sys_platform == 'linux'",
]

fla = [
    "fla; sys_platform == 'linux'",
]

trl = [
    "trl",
]

optuna = [
    "optuna",
]

vllm = [
    "vllm",
]

tensorrt_llm = [
    "tensorrt_llm",
]

all = [
    "neuralops[cuda,mlops,export,eval,benchmark,docs]",
]

[project.scripts]
neuralops = "neuralops.benchmarks.cli:main"
neuralops-cli = "neuralops.benchmarks.cli:main"
nops = "neuralops.benchmarks.cli:main"
nops-cli = "neuralops.benchmarks.cli:main"
neuralops-eval = "neuralops.evaluation.standalone.cli:main"

[project.urls]
Homepage = "https://github.com/tahamajs/NeuralOps"
Repository = "https://github.com/tahamajs/NeuralOps"
Issues = "https://github.com/tahamajs/NeuralOps/issues"
Documentation = "https://github.com/tahamajs/NeuralOps#readme"
Changelog = "https://github.com/tahamajs/NeuralOps/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuralops*"]
exclude = [
    "tests*",
    "benchmarks*",
    "scripts*",
    "eval*",
    "neuralops.tests*",
    "neuralops.benchmarks*",
    "neuralops._archive*",
    "neuralops.core._archive*",
    "neuralops.attentions._legacy*",
    "neuralops.compression_engine._legacy*",
]

[tool.setuptools.package-data]
neuralops = [
    "py.typed",
    "core/*.json",
    "**/*.cu",
    "**/*.cuh",
    "**/*.cpp",
    "**/*.h",
]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [
    "paper/",
    "thesis_final/",
    "results/",
    "docs/",
    "academic/",
    "logs/",
    "notebooks/*.ipynb",
    ".git/",
    ".venv/",
    ".nox/",
    ".pytest_cache/",
    ".mypy_cache/",
    ".ruff_cache/",
    "build/",
    "dist/",
    "htmlcov/",
    "*.egg-info",
    "_archive/",
    "_proposed/",
    "__pycache__/",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "B",
    "PIE",
    "I",
    "UP",
    "C4",
    "SIM",
]
ignore = [
    "E402",
    "E731",
    "E741",
    "F403",
    "B006",
    "B008",
    "B904",
    "B905",
]
unfixable = ["B006"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*.py" = ["E501", "F401", "F841", "B011", "B017", "B018"]
"benchmarks/**/*.py" = ["E501", "F401", "F841"]
"scripts/**/*.py" = ["E501", "F401", "F841"]

[tool.black]
line-length = 120
target-version = ["py314"]
extend-exclude = '''
/(
    \.git
  | \.venv
  | \.nox
  | \.pytest_cache
  | \.mypy_cache
  | \.ruff_cache
  | build
  | dist
  | htmlcov
  | _archive
  | _proposed
  | paper
  | thesis_final
  | results
  | docs
  | academic
  | logs
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["neuralops"]
skip_glob = [
    "paper/*",
    "thesis_final/*",
    "results/*",
    "docs/*",
    "academic/*",
    "logs/*",
    "_archive/*",
    "_proposed/*",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
exclude = [
    "^paper/",
    "^thesis_final/",
    "^results/",
    "^docs/",
    "^academic/",
    "^logs/",
    "^_archive/",
    "^_proposed/",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires CUDA-capable GPU",
    "vllm: requires vllm installed",
    "sglang: requires sglang installed",
    "trt_llm: requires tensorrt_llm installed",
    "slow: takes more than 30 seconds",
]

[tool.coverage.run]
source = ["neuralops"]
omit = [
    "*/tests/*",
    "*/benchmarks/*",
    "*/scripts/*",
    "*/_archive/*",
    "*/_proposed/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
