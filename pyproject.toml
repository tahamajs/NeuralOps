[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralops"
version = "1.0.0"
authors = [
  { name="NeuralOps Contributors" },
]
description = "A Production-Grade Framework for Subquadratic Attention, Model Compression, and Hardware-Aware Transformer Optimization"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "numpy",
]

[tool.setuptools.packages.find]
include = ["neuralops*"]
