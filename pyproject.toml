[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralops"
version = "2.0.6"
description = "A Production-Grade Framework for Subquadratic Attention, Model Compression, and Hardware-Aware Transformer Optimization"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Taha Majlesi", email = "tahamaj4@gmail.com" }
]
keywords = [
    "attention", "transformer", "compression", "svd",
    "linear-attention", "quantization", "pruning",
    "triton", "pytorch", "deep-learning"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "packaging>=23.0",
    "rich>=13.0",
    "psutil>=5.9",
    "scikit-learn>=1.3",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
core = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "einops>=0.7.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "packaging>=23.0",
    "rich>=13.0",
    "psutil>=5.9",
    "scikit-learn>=1.3",
    "huggingface-hub>=0.20",
]

cuda = [
    "neuralops[core]",
    "triton>=2.3.0; sys_platform == 'linux'",
]

rocm = ["neuralops[core]"]
mps = ["neuralops[core]"]
cpu = ["neuralops[core]"]

eval = [
    "scikit-learn>=1.3.0",
    "evaluate>=0.4.0",
    "lm-eval>=0.4.0",
]

serving = [
    "transformers>=4.40.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]

evaluation-experiments = [
    "transformers>=4.40.0",
    "numpy>=1.24.0",
]

benchmark = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "seaborn>=0.13",
    "rich>=13.0.0",
    "psutil>=5.9.0",
]

mlops = [
    "wandb>=0.16",
    "mlflow>=2.5",
    "tensorboard>=2.15",
    "accelerate>=0.25",
]

export = [
    "safetensors>=0.4",
    "onnx>=1.15",
    "onnxruntime>=1.17",
]

test = ["neuralops[dev]"]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "pdoc3>=0.10.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-minify-plugin>=0.8.0",
    "pdoc3>=0.10.0",
]

flash_attn = [
    "flash_attn; sys_platform == 'linux'",
]

mamba = [
    "mamba_ssm; sys_platform == 'linux'",
]

unsloth = [
    "unsloth; sys_platform == 'linux'",
]

fla = [
    "fla-linear-attention>=0.2.0,<0.3; sys_platform == 'linux'",
]

trl = [
    "trl",
]

optuna = [
    "optuna",
]

vllm = [
    "vllm",
]

tensorrt_llm = [
    "tensorrt_llm",
]

all = [
    "neuralops[cuda,mlops,export,eval,benchmark,docs]",
]

[project.scripts]
neuralops = "neuralops.benchmarks.cli:main"
neuralops-cli = "neuralops.benchmarks.cli:main"
nops = "neuralops.benchmarks.cli:main"
nops-cli = "neuralops.benchmarks.cli:main"
neuralops-eval = "neuralops.evaluation.standalone.cli:main"

[project.urls]
Homepage = "https://github.com/tahamajs/NeuralOps"
Repository = "https://github.com/tahamajs/NeuralOps"
Issues = "https://github.com/tahamajs/NeuralOps/issues"
Documentation = "https://github.com/tahamajs/NeuralOps#readme"
Changelog = "https://github.com/tahamajs/NeuralOps/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuralops*"]
exclude = [
    "tests*",
    "benchmarks*",
    "scripts*",
    "eval*",
    "neuralops.tests*",
    "neuralops._archive*",
    "neuralops.core._archive*",
    "neuralops.attentions._legacy*",
    "neuralops.compression_engine._legacy*",
]

[tool.setuptools.package-data]
neuralops = [
    "py.typed",
    "core/*.json",
    "**/*.cu",
    "**/*.cuh",
    "**/*.cpp",
    "**/*.h",
]

# AGT-08 (F-04): Consolidated ruff configuration (single source of truth).
# ruff.toml has been removed. Conflict resolution decisions:
# - select: active rules ["E", "F", "B", "PIE"]. Rules W, I, UP, C4, SIM from pyproject
#   were previously overridden by ruff.toml; enabling them repo-wide without broad formatting
#   sweeps causes extensive churn across legacy modules, so they are deferred.
# - ignore: retained the union of ruff.toml ignores and pyproject ignores to maintain
#   identical linting invariants.
[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    "paper/",
    "thesis_final/",
    "results/",
    "docs/",
    "academic/",
    "logs/",
    "notebooks/*.ipynb",
    ".git/",
    ".venv/",
    ".nox/",
    ".pytest_cache/",
    ".mypy_cache/",
    ".ruff_cache/",
    "build/",
    "dist/",
    "htmlcov/",
    "*.egg-info",
    "_archive/",
    "_proposed/",
    "__pycache__/",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "PIE",
]
ignore = [
    "N803",
    "N806",  # B, H, N, D for tensor dims (ML standard)
    "E501",  # long lines
    "F401",  # legacy compatibility imports retained for public API surfaces
    "F841",  # legacy scripts contain intentionally staged locals
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D205",
    "D400",
    "E402",  # module level import not at top of file (sys.path manipulation in scripts)
    "E741",  # ambiguous variable name
    "B023",  # function definition does not bind loop variable
    "E731",  # do not assign a lambda expression, use a def
    "B007",  # loop control variable not used within loop body
    "B905",  # zip() without explicit strict= parameter
    "E701",  # legacy compact statements
    "F403",  # legacy wildcard re-export modules
    "F811",  # legacy compatibility redefinitions
    "B008",  # framework callables used as defaults
    "B904",  # legacy exception chaining style
    "B017",  # legacy broad exception assertions
    "B018",  # intentional expression statements in compatibility tests
    "F601",  # legacy duplicate dictionary keys
    "B026",  # legacy star-argument call style
]
unfixable = [
    "B006",  # mutable default — flag error, do not auto-remove
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*.py" = ["E501", "F401", "F841", "B011", "B017", "B018"]
"benchmarks/**/*.py" = ["E501", "F401", "F841"]
"scripts/**/*.py" = ["E501", "F401", "F841"]
"neuralops/benchmarks/legacy_root/**/*.py" = ["F404"]

[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = '''
/(
    \.git
  | \.venv
  | \.nox
  | \.pytest_cache
  | \.mypy_cache
  | \.ruff_cache
  | build
  | dist
  | htmlcov
  | _archive
  | _proposed
  | paper
  | thesis_final
  | results
  | docs
  | academic
  | logs
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["neuralops"]
skip_glob = [
    "paper/*",
    "thesis_final/*",
    "results/*",
    "docs/*",
    "academic/*",
    "logs/*",
    "_archive/*",
    "_proposed/*",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
exclude = [
    "^paper/",
    "^thesis_final/",
    "^results/",
    "^docs/",
    "^academic/",
    "^logs/",
    "^_archive/",
    "^_proposed/",
]

# AGT-08 (F-04): Consolidated pytest configuration (single source of truth).
# pytest.ini has been removed. Conflict resolution decisions:
# - markers: union of 8 markers from pytest.ini + trt_llm from pyproject.toml.
# - slow threshold: 10s (winning value from pytest.ini).
# - filterwarnings: error + full ignore list from pytest.ini.
# - addopts: "-ra --strict-markers" preserved.
# - testpaths & python_files: ["tests"] and ["test_*.py"].
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
norecursedirs = [".*", "build", "dist", "*.egg-info", "_archive", "tests/_archive"]
markers = [
    "slow: marks tests as slow (> 10s)",
    "gpu: marks tests requiring CUDA",
    "triton: marks tests requiring Triton",
    "integration: marks integration tests",
    "regression: marks regression tests",
    "performance: marks performance benchmarks",
    "vllm: marks tests requiring vLLM",
    "sglang: marks tests requiring SGLang",
    "trt_llm: requires tensorrt_llm installed",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:neuralops\\.benchmarks\\..*",
    "ignore::UserWarning:transformers.*",
    "ignore::pytest.PytestCacheWarning",
    "ignore:.*run_quality_sweep is deprecated.*:DeprecationWarning",
    "ignore:.*torch.jit.script_method.*:UserWarning",
    "ignore:.*torch.jit.script_method.*:DeprecationWarning",
    "ignore:.*torch.cuda.amp.autocast.*:FutureWarning",
    "ignore:.*pydantic.*:DeprecationWarning",
    "ignore:.*Support for class-based.*:DeprecationWarning",
    "ignore:.*neuralops.core.compression_engine has moved.*:DeprecationWarning",
    "ignore:.*neuralops.core.roofline has moved.*:DeprecationWarning",
    "ignore:.*neuralops.training has merged into neuralops.trainer.*:DeprecationWarning",
    "ignore:.*neuralops.core.rope is deprecated.*:DeprecationWarning",
    "ignore:.*neuralops.core.gqa_utils is deprecated.*:DeprecationWarning",
    "ignore:.*neuralops.surgery.universal_calibrator is deprecated.*:DeprecationWarning",
    "ignore:.*is deprecated\\. Use.*instead\\.:DeprecationWarning",
    "ignore:.*Cannot dispatch to fused implementation.*:UserWarning",
    "ignore:.*isinstance\\(treespec, LeafSpec\\) is deprecated.*:DeprecationWarning",
    "ignore:.*explain\\(f, \\*args, \\*\\*kwargs\\) is deprecated.*:FutureWarning",
    "ignore:.*Attempting to run cuBLAS, but there was no current CUDA context.*:UserWarning",
    "ignore:.*invalid value encountered in scalar divide.*:RuntimeWarning",
    "ignore:.*pkg_resources is deprecated as an API.*:UserWarning",
]

[tool.coverage.run]
source = ["neuralops"]
omit = [
    "*/tests/*",
    "*/benchmarks/*",
    "*/scripts/*",
    "*/_archive/*",
    "*/_proposed/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
