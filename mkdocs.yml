site_name: NeuralOps
site_description: Unified Platform for Subquadratic Attention and Deep Low-Rank Model Compression
site_author: Taha Majlesi (Department of Computer Engineering, College of Engineering, University of Tehran)
site_url: https://tahamajs.github.io/NeuralOps/
copyright: "Copyright &copy; 2024-2026 Taha Majlesi. Department of Computer Engineering, College of Engineering, University of Tehran. Licensed under the MIT License."

repo_name: tahamajs/NeuralOps
repo_url: https://github.com/tahamajs/NeuralOps

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

validation:
  omitted_files: ignore
  links:
    not_found: ignore
    anchors: ignore
    absolute_links: ignore
    unrecognized_links: ignore

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tahamajs/NeuralOps
    - icon: fontawesome/solid/database
      link: https://huggingface.co/datasets/Hooshaai/neuralops-results

exclude_docs: |
  README.md
  visualizer/README.md

nav:
  - Home: index.md
  - Quickstart: QUICKSTART.md
  - Guides:
      - Getting Started: guides/getting_started.md
      - Attention Surgery: guides/attention_surgery.md
      - Model Compression: guides/model_compression.md
      - Kernel Dispatch: guides/kernel_dispatch.md
      - Production Serving: guides/production_serving.md
  - Visualizer & Dashboards:
      - Architecture & Telemetry Dashboard: dashboard.html
      - 3D Attention Lab & Atlas: visualizer/index.html
      - 3D Latent Manifold Geometry: visualizer/latent_manifold.html
      - Ada Roofline Interactive: roofline_interactive.html
  - Architecture:
      - Overview: codebase_architecture/README.md
      - Registry & Lazy Discovery: codebase_architecture/01_REGISTRY_AND_LAZY_DISCOVERY.md
      - 3-Level Fallback Dispatch: codebase_architecture/02_THREE_LEVEL_DISPATCH_HIERARCHY.md
      - CUDA Native Kernel Suite: codebase_architecture/03_CUDA_CPP_NATIVE_KERNEL_SUITE.md
      - Triton JIT & Autotuning: codebase_architecture/04_TRITON_JIT_COMPILATION_AND_AUTOTUNING.md
      - In-Place Model Surgery: codebase_architecture/05_MODEL_SURGERY_AND_INPLACE_TRANSPLANT.md
      - HNC-SVD & Streaming Whitening: codebase_architecture/06_HNC_SVD_AND_STREAMING_WHITENING.md
      - 6-Pillar Knowledge Distillation: codebase_architecture/07_SIX_PILLAR_KNOWLEDGE_DISTILLATION.md
      - Realtime Serving & PagedKV: codebase_architecture/08_REALTIME_SERVING_AND_PAGED_KVCACHE.md
      - Hardware Telemetry & Roofline: codebase_architecture/09_HARDWARE_TELEMETRY_AND_ROOFLINE_ENGINE.md
      - Benchmark Suite & Reproducibility: codebase_architecture/10_BENCHMARK_SUITE_AND_MANIFEST_REPRODUCIBILITY.md
  - API Reference:
      - 131 Attention Mechanisms: api/attentions.md
      - 72 Compression Engines: api/compression.md
      - Kernels & 3-Level Dispatch: api/kernels.md
      - Serving Integrations: api/integrations.md
      - Results Ledger & Provenance: api/results_ledger.md
  - Tutorials:
      - 01 Quickstart: tutorials/01_quickstart.md
      - 02 Roofline Analysis: tutorials/02_roofline.md
      - 03 Serving Adapters: tutorials/03_plugins.md
  - Benchmarks:
      - Triton Kernels: benchmarks/triton_kernels.md
      - Native CUDA Kernels: benchmarks/cuda_kernels.md
  - Upstream RFCs:
      - vLLM PagedState RFC: upstream/VLLM_RFC.md
      - TGI Continuous Batching RFC: upstream/TGI_RFC.md
      - SGLang RadixAttention RFC: upstream/SGLANG_RFC.md
  - Academic & Theses:
      - Manuscripts & PDFs: academic_monographs.md
  - Reports:
      - Production Readiness: reports/NEURALOPS_V137_FINAL_PRODUCTION_READINESS_REPORT.md
      - Gaps & Incompletion: reports/PROJECT_INCOMPLETION_AND_GAPS_REPORT.md
      - Paper/Thesis Consistency: reports/PAPER_THESIS_CONSISTENCY_REPORT.md
      - Benchmark Reconciliation: reports/BENCHMARK_RECONCILIATION.md
      - HNC-SVD Decision: reports/HNC_SVD_STATUS_DECISION.md
  - Roadmap:
      - Strategic Roadmap Overview: ROADMAP.md
      - High-Throughput FLA Kernels & Microarchitecture: ROADMAP_V1_7_KERNELS_AND_FLA.md
      - Systems, Surgery & Serving Ergonomics: ROADMAP_V1_7_SYSTEMS_AND_DEPLOYMENT.md
  - Changelog: changelog.md
