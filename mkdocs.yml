site_name: NeuralOps
site_description: Unified Platform for Subquadratic Attention and Deep Low-Rank Model Compression
site_author: Taha Majlesi
site_url: https://tahamajs.github.io/SVD_linear_Attention/

repo_name: tahamajs/SVD_linear_Attention
repo_url: https://github.com/tahamajs/SVD_linear_Attention

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search

validation:
  omitted_files: ignore
  links:
    not_found: ignore
    anchors: ignore
    absolute_links: ignore
    unrecognized_links: ignore

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

exclude_docs: |
  README.md
  visualizer/README.md

nav:
  - Home: index.md
  - Quickstart: QUICKSTART.md
  - API Reference:
      - Attentions: api/attentions.md
      - Compression: api/compression.md
      - Kernels: api/kernels.md
      - Serving Integrations: api/integrations.md
  - Tutorials:
      - 01 Quickstart: tutorials/01_quickstart.md
      - 02 Roofline Analysis: tutorials/02_roofline.md
      - 03 Serving Adapters: tutorials/03_plugins.md
  - Benchmarks:
      - Triton Kernels: benchmarks/triton_kernels.md
      - Native CUDA Kernels: benchmarks/cuda_kernels.md
  - Upstream RFCs:
      - vLLM PagedState RFC: upstream/VLLM_RFC.md
      - TGI Continuous Batching RFC: upstream/TGI_RFC.md
      - SGLang RadixAttention RFC: upstream/SGLANG_RFC.md
  - Reports:
      - Production Readiness: reports/NEURALOPS_V137_FINAL_PRODUCTION_READINESS_REPORT.md
      - Gaps & Incompletion: reports/PROJECT_INCOMPLETION_AND_GAPS_REPORT.md
      - Paper/Thesis Consistency: reports/PAPER_THESIS_CONSISTENCY_REPORT.md
      - Benchmark Reconciliation: reports/BENCHMARK_RECONCILIATION.md
      - HNC-SVD Decision: reports/HNC_SVD_STATUS_DECISION.md
  - Changelog: changelog.md
  - Security: security.md
