<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVD Linear Attention · Research Hub</title>
    <meta name="description" content="Interactive documentation, architecture comparison, experiment telemetry, and component studios for the SVD Linear Attention framework.">
    <meta name="author" content="Taha Majedsoltani">
    <meta name="keywords" content="SVD, Linear Attention, Neural Compression, Transformers, Research Hub, Attention Mechanisms">
    <meta name="theme-color" content="#080a12">
    <meta property="og:title" content="SVD Linear Attention · Research Hub">
    <meta property="og:description" content="Documentation, comparisons, experiment telemetry, and interactive component studios for efficient transformer research.">
    <meta property="og:type" content="website">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <div id="reading-progress-bar" aria-hidden="true"></div>

    <!-- Command Palette -->
    <div id="cmd-overlay" class="cmd-overlay hidden" role="dialog" aria-modal="true">
        <div class="cmd-backdrop" id="cmd-backdrop"></div>
        <div class="cmd-panel">
            <div class="cmd-search-row">
                <svg class="cmd-mag" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input id="cmd-input" type="text" placeholder="Search architectures, compressors, and papers..." autocomplete="off" spellcheck="false">
                <kbd class="cmd-esc-kbd">ESC</kbd>
            </div>
            <div class="cmd-categories" id="cmd-filter-row">
                <button class="cmd-cat active" data-cat="all">All</button>
                <button class="cmd-cat" data-cat="attentions">Attentions</button>
                <button class="cmd-cat" data-cat="compressions">Compressions</button>
                <button class="cmd-cat" data-cat="guides">Guides</button>
                <button class="cmd-cat" data-cat="reports">Reports</button>
            </div>
            <div class="cmd-results" id="cmd-results"></div>
            <div class="cmd-footer-bar">
                <span><kbd>↑↓</kbd> navigate</span>
                <span><kbd>↵</kbd> open</span>
                <span><kbd>ESC</kbd> close</span>
            </div>
        </div>
    </div>

    <!-- Interactive Comparison Modal -->
    <div id="compare-overlay" class="compare-overlay hidden" role="dialog" aria-modal="true">
        <div class="compare-backdrop" id="compare-backdrop"></div>
        <div class="compare-modal">
            <div class="compare-modal-header">
                <div class="compare-modal-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
                    <span>Architecture Comparison Studio</span>
                </div>
                <button class="compare-close-btn" id="compare-close-btn" aria-label="Close comparison">✕</button>
            </div>
            <div class="compare-modal-body">
                <div class="compare-selector-bar">
                    <span class="compare-sel-label">Select Architectures to Compare (Max 4):</span>
                    <div class="compare-chips-container" id="compare-chips-container"></div>
                </div>
                <div class="compare-matrix-view" id="compare-matrix-view"></div>
            </div>
        </div>
    </div>

    <div id="app-container">
        <!-- SIDEBAR -->
        <aside id="sidebar" aria-label="Documentation Navigation">
            <div class="sidebar-header">
                <div class="brand-wrap">
                    <div class="brand-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

                        </svg>
                    </div>
                    <div class="brand-text">
                        <div class="brand-name">SVD-Attn Hub</div>
                        <div class="brand-version">Research Platform · v3.1</div>
                    </div>
                </div>
                <button id="sidebar-collapse-btn" class="icon-btn collapse-btn" aria-label="Collapse sidebar">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
            </div>

            <div class="sidebar-search-wrap">
                <button class="sidebar-search-btn" id="sidebar-search-trigger" aria-label="Open search">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <span>Search architectures...</span>
                    <kbd id="search-shortcut-hint">⌘K</kbd>
                </button>
            </div>

            <div class="sidebar-stats-row">
                <div class="stat-chip" data-filter="attentions">
                    <span class="stat-n" id="stat-attn">—</span>
                    <span class="stat-l">Attentions</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-chip" data-filter="compressions">
                    <span class="stat-n" id="stat-comp">—</span>
                    <span class="stat-l">Compressors</span>
                </div>
            </div>

            <div class="filter-chips-row">
                <button class="fchip active" data-filter="all">All</button>
                <button class="fchip" data-filter="attentions">Attn</button>
                <button class="fchip" data-filter="compressions">Compress</button>
                <button class="fchip" data-filter="deep_dives">Deep Dives</button>
                <button class="fchip" data-filter="blog_series">Blog</button>
                <button class="fchip" data-filter="guides">Guides</button>
                <button class="fchip" data-filter="reports">Reports</button>

                <button class="fchip" data-filter="ssm">SSM</button>
                <button class="fchip" data-filter="moe">MoE</button>
            </div>

            <div class="sidebar-nav" id="nav-content" role="navigation">

                    <div class="sk-item"></div><div class="sk-item"></div><div class="sk-item"></div>
                    <div class="sk-group-label" style="margin-top:14px"></div>
                    <div class="sk-item"></div><div class="sk-item"></div>
                </div>
            </div>

            <div class="sidebar-footer">

                    GitHub
                </a>
                <button class="sf-btn" id="theme-toggle-btn" title="Toggle theme">
                    <svg id="theme-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <span id="theme-label">Light Mode</span>
                </button>
            </div>
