<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Attention & Compression Framework</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- KaTeX for Math -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    
    <!-- Prism for Code Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- Sidebar Navigation -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <h2>Framework Explorer</h2>
            </div>
            <div class="sidebar-search">
                <input type="text" id="search-input" placeholder="Search modules...">
            </div>
            <div class="sidebar-content" id="nav-content">
                <!-- Navigation sections injected via JS -->
            </div>
        </aside>

        <!-- Main Content Area -->
        <main id="main-content">
            <header class="top-bar">
                <button id="mobile-menu-btn" aria-label="Toggle Menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
                <div id="current-doc-title">Welcome</div>
            </header>
            <div class="content-wrapper">
                <div id="markdown-container" class="markdown-body">
                    <!-- Markdown content rendered here -->
                    <div class="welcome-screen">
                        <h1>Attention & Compression Framework</h1>
                        <p>Select a module from the sidebar to view its publication-grade documentation.</p>
                        <div class="stats-row">
                            <div class="stat-card">
                                <h3>108+</h3>
                                <span>Attention Modules</span>
                            </div>
                            <div class="stat-card">
                                <h3>58+</h3>
                                <span>Compression Engines</span>
                            </div>
                            <div class="stat-card">
                                <h3>5</h3>
                                <span>Next-Gen Hybrids</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <!-- Marked for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- KaTeX -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    
    <!-- Mermaid -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    
    <!-- Prism -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

    <!-- Custom App Logic -->
    <script src="app.js"></script>
</body>
</html>
