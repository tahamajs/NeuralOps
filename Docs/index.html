<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity | Attention & Neural Compression Research Hub</title>
    
    <!-- Meta tags for SEO & Social previews -->
    <meta name="description" content="Publication-grade documentation and architectural blueprints for 108+ Attention Mechanisms, 58+ Neural Compression Engines, and Next-Gen Triton Kernels.">
    <meta name="theme-color" content="#090a0f">

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- KaTeX Math & Copy-TeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/copy-tex.min.css">
    
    <!-- Prism Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    
    <!-- Custom Design System Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Reading Progress Indicator -->
    <div id="reading-progress-bar" aria-hidden="true"></div>

    <div id="app-container">
        <!-- Sidebar Navigation Drawer -->
        <aside id="sidebar" aria-label="Documentation Navigation">
            <div class="sidebar-header">
                <div class="brand-badge">
                    <div class="brand-logo-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                            <polyline points="2 17 12 22 22 17"></polyline>
                            <polyline points="2 12 12 17 22 12"></polyline>
                        </svg>
                    </div>
                    <div class="brand-meta">
                        <span class="brand-title">Antigravity AI</span>
                        <span class="brand-version">v2.4 Core &bull; Research</span>
                    </div>
                </div>
            </div>

            <!-- Search Bar with Keyboard Shortcut Indicator -->
            <div class="sidebar-search-box">
                <div class="search-input-wrapper">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search 184+ architectures..." autocomplete="off" spellcheck="false">
                    <kbd class="search-kbd" id="search-shortcut-hint">⌘K</kbd>
                    <button id="search-clear-btn" aria-label="Clear Search" class="hidden">&times;</button>
                </div>
            </div>

            <!-- Quick Paradigm Filter Chips -->
            <div class="sidebar-filter-tabs">
                <button class="filter-chip active" data-filter="all">All (184)</button>
                <button class="filter-chip" data-filter="attentions">Attn</button>
                <button class="filter-chip" data-filter="compressions">Compress</button>
                <button class="filter-chip" data-filter="svd">SVD</button>
                <button class="filter-chip" data-filter="ssm">SSM</button>
                <button class="filter-chip" data-filter="moe">MoE</button>
            </div>

            <!-- Main Navigation Item Tree -->
            <div class="sidebar-content" id="nav-content" role="navigation">
                <!-- Navigation sections dynamically injected via app.js -->
                <div class="nav-loading-placeholder">
                    <div class="skeleton-line" style="width: 60%;"></div>
                    <div class="skeleton-line" style="width: 85%;"></div>
                    <div class="skeleton-line" style="width: 75%;"></div>
                    <div class="skeleton-line" style="width: 90%;"></div>
                </div>
            </div>

            <div class="sidebar-footer">
                <a href="https://github.com/tahamajs/SVD_linear_Attention" target="_blank" rel="noopener noreferrer" class="github-repo-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                    </svg>
                    <span>GitHub Repository</span>
                </a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main id="main-content">
            <header class="top-bar">
                <div class="top-bar-left">
                    <button id="mobile-menu-btn" aria-label="Toggle Menu" class="icon-button">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div id="breadcrumbs" class="breadcrumbs">
                        <span class="breadcrumb-item home-crumb">Hub</span>
                        <span class="breadcrumb-separator">/</span>
                        <span class="breadcrumb-item current-section">Overview</span>
                    </div>
                </div>

                <div class="top-bar-right">
                    <button id="home-btn" class="top-action-btn" title="Back to Hub Overview">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span>Overview</span>
                    </button>
                    <button id="compendium-quick-btn" class="top-action-btn highlight" title="Next-Gen Synthesis Compendium">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                        </svg>
                        <span>Synthesis Compendium</span>
                    </button>
                </div>
            </header>

            <div class="content-viewport" id="content-viewport">
                <div class="article-layout">
                    <!-- Main Markdown Body -->
                    <article id="markdown-container" class="markdown-body">
                        <!-- Default Welcome View rendered dynamically -->
                    </article>

                    <!-- Sticky Table of Contents Sidebar (Right Side) -->
                    <aside id="toc-container" class="toc-sidebar" aria-label="Table of Contents">
                        <div class="toc-sticky-box">
                            <div class="toc-header">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="8" y1="6" x2="21" y2="6"></line>
                                    <line x1="8" y1="12" x2="21" y2="12"></line>
                                    <line x1="8" y1="18" x2="21" y2="18"></line>
                                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                                </svg>
                                <span>ON THIS PAGE</span>
                            </div>
                            <nav id="toc-nav" class="toc-nav-list">
                                <!-- Injected from headers -->
                            </nav>
                        </div>
                    </aside>
                </div>
            </div>

            <!-- Floating Back To Top Button -->
            <button id="back-to-top-btn" aria-label="Back to Top" class="floating-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
            </button>
        </main>
    </div>

    <!-- CDN Dependencies -->
    <!-- Marked Markdown Engine -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    
    <!-- KaTeX Math Engine with Copy-Tex and MHChem -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/mhchem.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/copy-tex.min.js"></script>
    
    <!-- Mermaid Diagramming Engine -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    
    <!-- Prism Syntax Highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>

    <!-- Application Script -->
    <script src="app.js"></script>
</body>
</html>
