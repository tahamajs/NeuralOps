<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="100%" height="100%" fill="#1a1b26"/>
  <text x="400" y="38" fill="#c0caf5" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">DSA (Dynamic Sparse Attention) Speedup Scaling</text>
  <text x="400" y="60" fill="#7aa2f7" font-size="12" font-family="sans-serif" text-anchor="middle">Learned Block-Sparse Routing O(T * k * B * d) vs Full Attention O(T^2)</text>

  <!-- Axes -->
  <line x1="100" y1="420" x2="740" y2="420" stroke="#414868" stroke-width="2"/>
  <line x1="100" y1="80" x2="100" y2="420" stroke="#414868" stroke-width="2"/>
  <text x="420" y="465" fill="#a9b1d6" font-size="13" font-family="sans-serif" text-anchor="middle">Context Window Length (Tokens)</text>
  <text x="35" y="250" fill="#a9b1d6" font-size="13" font-family="sans-serif" text-anchor="middle" transform="rotate(-90 35 250)">Speedup over Full Softmax Attention (x)</text>

  <!-- Grid Lines -->
  <line x1="100" y1="352" x2="740" y2="352" stroke="#24283b" stroke-dasharray="4"/>
  <line x1="100" y1="284" x2="740" y2="284" stroke="#24283b" stroke-dasharray="4"/>
  <line x1="100" y1="216" x2="740" y2="216" stroke="#24283b" stroke-dasharray="4"/>
  <line x1="100" y1="148" x2="740" y2="148" stroke="#24283b" stroke-dasharray="4"/>

  <!-- Y Ticks -->
  <text x="90" y="424" fill="#565f89" font-size="11" text-anchor="end">1.0x</text>
  <text x="90" y="356" fill="#565f89" font-size="11" text-anchor="end">2.5x</text>
  <text x="90" y="288" fill="#565f89" font-size="11" text-anchor="end">5.0x</text>
  <text x="90" y="220" fill="#565f89" font-size="11" text-anchor="end">7.5x</text>
  <text x="90" y="152" fill="#565f89" font-size="11" text-anchor="end">10.0x</text>

  <!-- X Ticks -->
  <text x="160" y="438" fill="#565f89" font-size="11" text-anchor="middle">1,024</text>
  <text x="280" y="438" fill="#565f89" font-size="11" text-anchor="middle">2,048</text>
  <text x="400" y="438" fill="#565f89" font-size="11" text-anchor="middle">4,096</text>
  <text x="520" y="438" fill="#565f89" font-size="11" text-anchor="middle">8,192</text>
  <text x="640" y="438" fill="#565f89" font-size="11" text-anchor="middle">16,384</text>

  <!-- Baseline Reference (Gray) -->
  <line x1="100" y1="420" x2="740" y2="420" stroke="#565f89" stroke-width="2" stroke-dasharray="4"/>

  <!-- DSA Speedup Curve (Blue/Purple) -->
  <path d="M 160 410 Q 280 380 400 320 T 520 220 T 640 120" fill="none" stroke="#7aa2f7" stroke-width="3.5"/>
  <circle cx="160" cy="410" r="6" fill="#7aa2f7"/>
  <text x="160" y="396" fill="#7aa2f7" font-size="10" font-family="sans-serif" text-anchor="middle">1.2x</text>
  <circle cx="280" cy="380" r="6" fill="#7aa2f7"/>
  <text x="280" y="366" fill="#7aa2f7" font-size="10" font-family="sans-serif" text-anchor="middle">2.1x</text>
  <circle cx="400" cy="320" r="6" fill="#7aa2f7"/>
  <text x="400" y="306" fill="#7aa2f7" font-size="10" font-family="sans-serif" text-anchor="middle">4.0x</text>
  <circle cx="520" cy="220" r="6" fill="#7aa2f7"/>
  <text x="520" y="206" fill="#7aa2f7" font-size="10" font-family="sans-serif" text-anchor="middle">7.4x</text>
  <circle cx="640" cy="120" r="6" fill="#7aa2f7"/>
  <text x="640" y="106" fill="#7aa2f7" font-size="11" font-family="sans-serif" text-anchor="middle" font-weight="bold">11.2x</text>

  <!-- Legend -->
  <rect x="120" y="85" width="280" height="55" fill="#24283b" rx="6" stroke="#414868"/>
  <line x1="135" y1="112" x2="165" y2="112" stroke="#7aa2f7" stroke-width="3.5"/>
  <circle cx="150" cy="112" r="5" fill="#7aa2f7"/>
  <text x="175" y="116" fill="#c0caf5" font-size="12" font-family="sans-serif">NativeSparseAttention (DSA Routing)</text>
</svg>