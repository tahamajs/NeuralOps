<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="100%" height="100%" fill="#1a1b26"/>
  <text x="400" y="40" fill="#c0caf5" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">Parameter Compression vs Accuracy Retention</text>
  <line x1="100" y1="420" x2="740" y2="420" stroke="#414868" stroke-width="2"/>
  <line x1="100" y1="80" x2="100" y2="420" stroke="#414868" stroke-width="2"/>
  <text x="420" y="465" fill="#a9b1d6" font-size="14" font-family="sans-serif" text-anchor="middle">Compression Ratio (x) [Higher is More Compressed]</text>
  <text x="40" y="250" fill="#a9b1d6" font-size="14" font-family="sans-serif" text-anchor="middle" transform="rotate(-90 40 250)">Accuracy Retention (%) [Higher is Better]</text>

  <!-- Grid Lines -->
  <line x1="100" y1="340" x2="740" y2="340" stroke="#24283b" stroke-dasharray="4"/>
  <line x1="100" y1="260" x2="740" y2="260" stroke="#24283b" stroke-dasharray="4"/>
  <line x1="100" y1="180" x2="740" y2="180" stroke="#24283b" stroke-dasharray="4"/>
  <line x1="100" y1="100" x2="740" y2="100" stroke="#24283b" stroke-dasharray="4"/>

  <!-- Ticks Y -->
  <text x="90" y="425" fill="#565f89" font-size="12" text-anchor="end">70%</text>
  <text x="90" y="345" fill="#565f89" font-size="12" text-anchor="end">77.5%</text>
  <text x="90" y="265" fill="#565f89" font-size="12" text-anchor="end">85%</text>
  <text x="90" y="185" fill="#565f89" font-size="12" text-anchor="end">92.5%</text>
  <text x="90" y="105" fill="#565f89" font-size="12" text-anchor="end">100%</text>

  <!-- Ticks X -->
  <text x="160" y="440" fill="#565f89" font-size="12" text-anchor="middle">1.5x</text>
  <text x="300" y="440" fill="#565f89" font-size="12" text-anchor="middle">2.0x</text>
  <text x="440" y="440" fill="#565f89" font-size="12" text-anchor="middle">3.0x</text>
  <text x="580" y="440" fill="#565f89" font-size="12" text-anchor="middle">4.0x</text>
  <text x="700" y="440" fill="#565f89" font-size="12" text-anchor="middle">5.0x</text>

  <!-- HNC-SVD Curve (Green) -->
  <path d="M 160 110 Q 300 120 440 145 T 580 185 T 700 240" fill="none" stroke="#73daca" stroke-width="3"/>
  <circle cx="160" cy="110" r="6" fill="#73daca"/>
  <circle cx="300" cy="120" r="6" fill="#73daca"/>
  <circle cx="440" cy="145" r="6" fill="#73daca"/>
  <circle cx="580" cy="185" r="6" fill="#73daca"/>
  <circle cx="700" cy="240" r="6" fill="#73daca"/>

  <!-- Naive SVD Curve (Red) -->
  <path d="M 160 130 Q 300 190 440 280 T 580 370 T 700 415" fill="none" stroke="#f7768e" stroke-width="3" stroke-dasharray="6"/>
  <circle cx="160" cy="130" r="6" fill="#f7768e"/>
  <circle cx="300" cy="190" r="6" fill="#f7768e"/>
  <circle cx="440" cy="280" r="6" fill="#f7768e"/>
  <circle cx="580" cy="370" r="6" fill="#f7768e"/>
  <circle cx="700" cy="415" r="6" fill="#f7768e"/>

  <!-- Legend -->
  <rect x="520" y="70" width="200" height="65" fill="#24283b" rx="6" stroke="#414868"/>
  <line x1="535" y1="90" x2="565" y2="90" stroke="#73daca" stroke-width="3"/>
  <circle cx="550" cy="90" r="5" fill="#73daca"/>
  <text x="575" y="94" fill="#c0caf5" font-size="12" font-family="sans-serif">HNC-SVD (Ours)</text>
  <line x1="535" y1="115" x2="565" y2="115" stroke="#f7768e" stroke-width="3" stroke-dasharray="4"/>
  <circle cx="550" cy="115" r="5" fill="#f7768e"/>
  <text x="575" y="119" fill="#c0caf5" font-size="12" font-family="sans-serif">Naive DirectSVD</text>
</svg>