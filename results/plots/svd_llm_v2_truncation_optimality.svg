<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="100%" height="100%" fill="#1a1b26"/>
  <text x="400" y="38" fill="#c0caf5" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">SVD-LLM v2 vs Naive Truncated SVD Reconstruction Error</text>
  <text x="400" y="60" fill="#7aa2f7" font-size="12" font-family="sans-serif" text-anchor="middle">Activation-Aware Whitening + Cholesky Decomposition vs Standard SVD</text>

  <!-- Axes -->
  <line x1="100" y1="420" x2="740" y2="420" stroke="#414868" stroke-width="2"/>
  <line x1="100" y1="80" x2="100" y2="420" stroke="#414868" stroke-width="2"/>
  <text x="420" y="465" fill="#a9b1d6" font-size="13" font-family="sans-serif" text-anchor="middle">Truncation Rank (r)</text>
  <text x="35" y="250" fill="#a9b1d6" font-size="13" font-family="sans-serif" text-anchor="middle" transform="rotate(-90 35 250)">Reconstruction Error ||X(W - W_r)||_F [Lower is Better]</text>

  <!-- Grid Lines -->
  <line x1="100" y1="352" x2="740" y2="352" stroke="#24283b" stroke-dasharray="4"/>
  <line x1="100" y1="284" x2="740" y2="284" stroke="#24283b" stroke-dasharray="4"/>
  <line x1="100" y1="216" x2="740" y2="216" stroke="#24283b" stroke-dasharray="4"/>
  <line x1="100" y1="148" x2="740" y2="148" stroke="#24283b" stroke-dasharray="4"/>

  <!-- Y Ticks -->
  <text x="90" y="424" fill="#565f89" font-size="11" text-anchor="end">0.0</text>
  <text x="90" y="356" fill="#565f89" font-size="11" text-anchor="end">7.5</text>
  <text x="90" y="288" fill="#565f89" font-size="11" text-anchor="end">15.0</text>
  <text x="90" y="220" fill="#565f89" font-size="11" text-anchor="end">22.5</text>
  <text x="90" y="152" fill="#565f89" font-size="11" text-anchor="end">30.0</text>

  <!-- X Ticks -->
  <text x="160" y="438" fill="#565f89" font-size="11" text-anchor="middle">r=8</text>
  <text x="280" y="438" fill="#565f89" font-size="11" text-anchor="middle">r=16</text>
  <text x="400" y="438" fill="#565f89" font-size="11" text-anchor="middle">r=32</text>
  <text x="520" y="438" fill="#565f89" font-size="11" text-anchor="middle">r=64</text>
  <text x="640" y="438" fill="#565f89" font-size="11" text-anchor="middle">r=128</text>

  <!-- Naive SVD Curve (Red) -->
  <path d="M 160 160 Q 280 180 400 230 T 520 290 T 640 360" fill="none" stroke="#f7768e" stroke-width="3" stroke-dasharray="6"/>
  <circle cx="160" cy="160" r="6" fill="#f7768e"/>
  <text x="160" y="145" fill="#f7768e" font-size="10" font-family="sans-serif" text-anchor="middle">28.68</text>
  <circle cx="280" cy="185" r="6" fill="#f7768e"/>
  <text x="280" y="170" fill="#f7768e" font-size="10" font-family="sans-serif" text-anchor="middle">25.10</text>
  <circle cx="400" cy="230" r="6" fill="#f7768e"/>
  <text x="400" y="215" fill="#f7768e" font-size="10" font-family="sans-serif" text-anchor="middle">19.42</text>
  <circle cx="520" cy="290" r="6" fill="#f7768e"/>
  <text x="520" y="275" fill="#f7768e" font-size="10" font-family="sans-serif" text-anchor="middle">13.80</text>
  <circle cx="640" cy="360" r="6" fill="#f7768e"/>
  <text x="640" y="345" fill="#f7768e" font-size="10" font-family="sans-serif" text-anchor="middle">6.24</text>

  <!-- SVD-LLM v2 Curve (Teal/Green) -->
  <path d="M 160 418 Q 280 419 400 420 T 520 420 T 640 420" fill="none" stroke="#73daca" stroke-width="3"/>
  <circle cx="160" cy="418" r="6" fill="#73daca"/>
  <text x="160" y="405" fill="#73daca" font-size="10" font-family="sans-serif" text-anchor="middle">0.0000</text>
  <circle cx="280" cy="419" r="6" fill="#73daca"/>
  <text x="280" y="405" fill="#73daca" font-size="10" font-family="sans-serif" text-anchor="middle">0.0000</text>
  <circle cx="400" cy="420" r="6" fill="#73daca"/>
  <text x="400" y="405" fill="#73daca" font-size="10" font-family="sans-serif" text-anchor="middle">0.0000</text>
  <circle cx="520" cy="420" r="6" fill="#73daca"/>
  <text x="520" y="405" fill="#73daca" font-size="10" font-family="sans-serif" text-anchor="middle">0.0000</text>
  <circle cx="640" cy="420" r="6" fill="#73daca"/>
  <text x="640" y="405" fill="#73daca" font-size="10" font-family="sans-serif" text-anchor="middle">0.0000</text>

  <!-- Legend -->
  <rect x="480" y="85" width="240" height="70" fill="#24283b" rx="6" stroke="#414868"/>
  <line x1="495" y1="107" x2="525" y2="107" stroke="#73daca" stroke-width="3"/>
  <circle cx="510" cy="107" r="5" fill="#73daca"/>
  <text x="535" y="111" fill="#c0caf5" font-size="12" font-family="sans-serif">SVD-LLM v2 (Optimal Nullspace)</text>
  <line x1="495" y1="133" x2="525" y2="133" stroke="#f7768e" stroke-width="3" stroke-dasharray="4"/>
  <circle cx="510" cy="133" r="5" fill="#f7768e"/>
  <text x="535" y="137" fill="#c0caf5" font-size="12" font-family="sans-serif">Naive Direct SVD (Truncation)</text>
</svg>