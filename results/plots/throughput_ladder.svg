<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <rect width="100%" height="100%" fill="#1a1b26"/>
  <text x="400" y="35" fill="#c0caf5" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle">Kernel Roofline Throughput Ladder (tokens / sec)</text>
  <line x1="180" y1="60" x2="180" y2="460" stroke="#414868" stroke-width="2"/>
  <line x1="180" y1="460" x2="740" y2="460" stroke="#414868" stroke-width="2"/>
  <text x="460" y="495" fill="#a9b1d6" font-size="13" font-family="sans-serif" text-anchor="middle">Throughput (tokens / second) [Higher is Better]</text>

  <!-- Bars (Module names on left) -->
  <!-- 1. Triton Gated DeltaNet -->
  <text x="170" y="105" fill="#c0caf5" font-size="12" font-family="monospace" text-anchor="end">triton_gated_deltanet</text>
  <rect x="180" y="90" width="520" height="24" fill="#7aa2f7" rx="3"/>
  <text x="710" y="107" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold">401k tok/s (92x)</text>

  <!-- 2. CUDA Selective Scan -->
  <text x="170" y="145" fill="#c0caf5" font-size="12" font-family="monospace" text-anchor="end">cuda_selective_scan</text>
  <rect x="180" y="130" width="490" height="24" fill="#73daca" rx="3"/>
  <text x="680" y="147" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold">378k tok/s (87x)</text>

  <!-- 3. Triton Chunk GLA -->
  <text x="170" y="185" fill="#c0caf5" font-size="12" font-family="monospace" text-anchor="end">triton_chunk_gla</text>
  <rect x="180" y="170" width="430" height="24" fill="#bb9af7" rx="3"/>
  <text x="620" y="187" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold">332k tok/s (76x)</text>

  <!-- 4. Triton Fused SVD Gate -->
  <text x="170" y="225" fill="#c0caf5" font-size="12" font-family="monospace" text-anchor="end">triton_fused_svd_gate</text>
  <rect x="180" y="210" width="380" height="24" fill="#2ac3de" rx="3"/>
  <text x="570" y="227" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold">293k tok/s (67x)</text>

  <!-- 5. CUDA Flash GQA -->
  <text x="170" y="265" fill="#c0caf5" font-size="12" font-family="monospace" text-anchor="end">cuda_flash_gqa</text>
  <rect x="180" y="250" width="310" height="24" fill="#e0af68" rx="3"/>
  <text x="500" y="267" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold">239k tok/s (55x)</text>

  <!-- 6. Triton Block Sparse -->
  <text x="170" y="305" fill="#c0caf5" font-size="12" font-family="monospace" text-anchor="end">triton_block_sparse</text>
  <rect x="180" y="290" width="260" height="24" fill="#ff9e64" rx="3"/>
  <text x="450" y="307" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold">201k tok/s (46x)</text>

  <!-- 7. Triton Cosformer -->
  <text x="170" y="345" fill="#c0caf5" font-size="12" font-family="monospace" text-anchor="end">triton_cosformer</text>
  <rect x="180" y="330" width="210" height="24" fill="#f7768e" rx="3"/>
  <text x="400" y="347" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold">162k tok/s (37x)</text>

  <!-- 8. PyTorch Vanilla Baseline -->
  <text x="170" y="385" fill="#c0caf5" font-size="12" font-family="monospace" text-anchor="end">pytorch_vanilla_ref</text>
  <rect x="180" y="370" width="45" height="24" fill="#565f89" rx="3"/>
  <text x="235" y="387" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold">4.3k tok/s (1.0x)</text>
</svg>