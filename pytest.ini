[pytest]
minversion = 7.0
testpaths = neuralops/tests tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: marks tests as slow (> 10s)
    gpu: marks tests requiring CUDA
    triton: marks tests requiring Triton
    integration: marks integration tests
    regression: marks regression tests
    performance: marks performance benchmarks

filterwarnings =
    error
    ignore::DeprecationWarning:neuralops\.benchmarks\..*
    ignore::UserWarning:transformers.*
    ignore::pytest.PytestCacheWarning
    ignore:.*run_quality_sweep is deprecated.*:DeprecationWarning
    ignore:.*torch.jit.script_method.*:UserWarning
    ignore:.*torch.jit.script_method.*:DeprecationWarning
    ignore:.*torch.cuda.amp.autocast.*:FutureWarning
    ignore:.*pydantic.*:DeprecationWarning
    ignore:.*Support for class-based.*:DeprecationWarning
    ignore:.*neuralops.core.compression_engine has moved.*:DeprecationWarning
    ignore:.*neuralops.core.rope is deprecated.*:DeprecationWarning
    ignore:.*neuralops.core.gqa_utils is deprecated.*:DeprecationWarning
    ignore:.*is deprecated\. Use.*instead\.:DeprecationWarning
    ignore:.*Cannot dispatch to fused implementation.*:UserWarning
    ignore:.*isinstance\(treespec, LeafSpec\) is deprecated.*:DeprecationWarning
    ignore:.*explain\(f, \*args, \*\*kwargs\) is deprecated.*:FutureWarning
    ignore:.*Attempting to run cuBLAS, but there was no current CUDA context.*:UserWarning

norecursedirs = .* build dist *.egg-info _archive neuralops/tests/_archive


