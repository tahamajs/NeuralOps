{% extends "base.html" %}

{% block title %}Attention Mechanisms &middot; NeuralOps{% endblock %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
  <div>
    <h1 style="font-size: 1.75rem; font-weight: 700;">Attention Mechanism Registry</h1>
    <p style="color: var(--text-secondary); font-size: 0.875rem;">131 mathematical operator contracts across 12 architectural families</p>
  </div>
  <form id="attentions-filter-form"
        hx-get="/partials/attentions"
        hx-target="#attentions-table-container"
        hx-trigger="submit, change from:select, keyup changed delay:250ms from:input"
        style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
    <input type="text" name="query" placeholder="Search attention..." class="form-control" style="width: 200px;">
    <select name="family" class="form-control">
      <option value="">All Families ({{ total_count }})</option>
      {% for fam in families %}
      <option value="{{ fam }}" {% if selected_family == fam %}selected{% endif %}>{{ fam }}</option>
      {% endfor %}
    </select>
  </form>
</div>

<div id="attentions-table-container">
  {% include "partials/attentions_table.html" %}
</div>
{% endblock %}
