{% extends "base.html" %}

{% block title %}Benchmarks &middot; NeuralOps{% endblock %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
  <div>
    <h1 style="font-size: 1.75rem; font-weight: 700;">Benchmark Ledger Explorer</h1>
    <p style="color: var(--text-secondary); font-size: 0.875rem;">{{ total_count }} empirical benchmark execution records</p>
  </div>
  <div>
    <a href="/benchmarks/export?module_name={{ filter_module_name }}&status={{ filter_status }}&family={{ filter_family }}" class="btn btn-primary" download>
      Export CSV
    </a>
  </div>
</div>

<div class="card" style="padding: 1rem;">
  <form id="benchmark-filter-form"
        hx-get="/partials/benchmarks"
        hx-target="#benchmarks-table-container"
        hx-trigger="submit, change from:select, keyup changed delay:300ms from:input"
        style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end;">
    <div style="flex: 1; min-width: 180px;">
      <label style="display: block; font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 0.25rem;">Module Name</label>
      <input type="text" name="module_name" value="{{ filter_module_name }}" placeholder="Type to search (e.g. cosformer)..." class="form-control" style="width: 100%;">
    </div>
    <div style="width: 150px;">
      <label style="display: block; font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 0.25rem;">Status</label>
      <select name="status" class="form-control" style="width: 100%;">
        <option value="">All Statuses</option>
        <option value="active" {% if filter_status == 'active' %}selected{% endif %}>active</option>
        <option value="verified" {% if filter_status == 'verified' %}selected{% endif %}>verified</option>
      </select>
    </div>
    <div style="width: 150px;">
      <label style="display: block; font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 0.25rem;">Family</label>
      <select name="family" class="form-control" style="width: 100%;">
        <option value="">All Families</option>
        {% for fam in families %}
        <option value="{{ fam }}" {% if filter_family == fam %}selected{% endif %}>{{ fam }}</option>
        {% endfor %}
      </select>
    </div>
    <div style="display: flex; gap: 0.5rem;">
      <button type="submit" class="btn btn-outline">Filter</button>
      <a href="/benchmarks" class="btn btn-outline" style="color: var(--text-muted);">Reset</a>
    </div>
  </form>
</div>

<div id="benchmarks-table-container">
  {% include "partials/benchmarks_table.html" %}
</div>
{% endblock %}
