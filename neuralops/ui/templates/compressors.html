{% extends "base.html" %}

{% block title %}Compressors &middot; NeuralOps{% endblock %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
  <div>
    <h1 style="font-size: 1.75rem; font-weight: 700;">Model Compressor Registry</h1>
    <p style="color: var(--text-secondary); font-size: 0.875rem;">72 post-surgery distillation and quantization operators across 7 paradigms</p>
  </div>
  <form id="compressors-filter-form"
        hx-get="/partials/compressors"
        hx-target="#compressors-table-container"
        hx-trigger="submit, change from:select, keyup changed delay:250ms from:input"
        style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
    <input type="text" name="query" placeholder="Search compressor..." class="form-control" style="width: 200px;">
    <select name="paradigm" class="form-control">
      <option value="">All Paradigms ({{ total_count }})</option>
      {% for par in paradigms %}
      <option value="{{ par }}" {% if selected_paradigm == par %}selected{% endif %}>{{ par }}</option>
      {% endfor %}
    </select>
  </form>
</div>

<div id="compressors-table-container">
  {% include "partials/compressors_table.html" %}
</div>
{% endblock %}
