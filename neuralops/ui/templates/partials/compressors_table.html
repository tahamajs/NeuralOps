<div class="table-container">
  <table class="data-table">
    <thead>
      <tr>
        <th>Compressor Key</th>
        <th>Paradigm</th>
        <th>Module Path</th>
        <th>Documentation</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      {% for comp in compressors %}
      <tr>
        <td style="font-family: var(--font-mono); font-weight: 600;">
          <a href="/compressors/{{ comp.name }}" style="color: var(--accent-blue); text-decoration: none;">
            {{ comp.name }}
          </a>
        </td>
        <td>
          <span class="badge badge-muted">{{ comp.paradigm }}</span>
        </td>
        <td style="font-family: var(--font-mono); font-size: 0.8125rem; color: var(--text-secondary);">
          {{ comp.module }}
        </td>
        <td style="color: var(--text-secondary); max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
          {{ comp.doc | truncate(60) or '&mdash;' }}
        </td>
        <td>
          <a href="/compressors/{{ comp.name }}" class="btn btn-outline" style="font-size: 0.75rem; padding: 0.2rem 0.5rem;">Details</a>
        </td>
      </tr>
      {% else %}
      <tr>
        <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">No compressors found matching query.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
