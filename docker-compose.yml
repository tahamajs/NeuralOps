version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: neuralops
      POSTGRES_USER: neuralops_user
      POSTGRES_PASSWORD: neuralops_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: 
      context: ./Codes/django_api
      dockerfile: Dockerfile
    command: daphne -b 0.0.0.0 -p 8000 django_api.asgi:application
    volumes:
      - ./Codes/django_api:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://neuralops_user:neuralops_password@db:5432/neuralops
      - REDIS_URL=redis://redis:6379/0

  celery:
    build: 
      context: ./Codes/django_api
      dockerfile: Dockerfile
    command: celery -A django_api worker -l info
    volumes:
      - ./Codes/django_api:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://neuralops_user:neuralops_password@db:5432/neuralops
      - REDIS_URL=redis://redis:6379/0

  frontend:
    build:
      context: ./Codes/frontend
      dockerfile: Dockerfile
    command: npm run dev
    volumes:
      - ./Codes/frontend:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
