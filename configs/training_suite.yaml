# Training Suite Configuration for GTX 1060 (6GB VRAM)
# neuralops training infrastructure

infrastructure:
  server: tahoora
  gpu: "NVIDIA GTX 1060"
  vram_gb: 6
  cuda_compute: "6.1"  # Pascal / sm_61
  cuda_version: "12.1"  # cu121 compatible

models:
  bert_base:
    name: bert-base-uncased
    params_m: 110
    # Safe batch sizes for 6GB VRAM
    batch_size: 16
    grad_accumulation: 2  # effective batch = 32
    max_len: 128
    fp16: false  # Pascal has limited fp16 support

  distilbert:
    name: distilbert-base-uncased
    params_m: 66
    batch_size: 32
    max_len: 128
    fp16: false

training:
  default:
    lr: 2.0e-5
    weight_decay: 0.01
    warmup_ratio: 0.1
    max_grad_norm: 1.0
    seed: 42
    epochs: 3

  quick_test:
    epochs: 1
    max_steps: 100
    batch_size: 8

glue_tasks:
  sst2:
    config: sst2
    text_col: sentence
    num_labels: 2
    metric: accuracy
    published_baseline: 0.927
    priority: 1

  mrpc:
    config: mrpc
    text_col: sentence1
    text2_col: sentence2
    num_labels: 2
    metric: f1
    published_baseline: 0.884
    priority: 2

  cola:
    config: cola
    text_col: sentence
    num_labels: 2
    metric: matthews_correlation
    published_baseline: 0.583
    priority: 3

  rte:
    config: rte
    text_col: sentence1
    text2_col: sentence2
    num_labels: 2
    metric: accuracy
    published_baseline: 0.665
    priority: 4

  qnli:
    config: qnli
    text_col: question
    text2_col: sentence
    num_labels: 2
    metric: accuracy
    published_baseline: 0.913
    priority: 5

validation:
  run_data_validator: true
  run_model_validator: true
  run_overfit_test: true
  overfit_steps: 30
  overfit_samples: 8
  overfit_lr: 1.0e-3
  generate_reports: true
  report_format:
    - markdown
    - json

paths:
  project_root: ~/Project
  results: ~/Project/results
  checkpoints: ~/Project/checkpoints
  logs: ~/Project/logs
  configs: ~/Project/configs

  glue_results: ~/Project/results/glue
  lm_results: ~/Project/results/lm
  kd_results: ~/Project/results/kd
  compression_results: ~/Project/results/compression
  validation_results: ~/Project/results/validation

vram_budgets:
  bert_base_sst2: 4.5  # GB estimated
  distilbert_sst2: 2.8
  bert_base_mrpc: 4.2
  safe_threshold: 5.5  # GB (leave 0.5GB headroom)

knowledge_distillation:
  teacher: bert-base-uncased
  student: distilbert-base-uncased
  temperature: 4.0
  alpha: 0.5  # blend of KD loss vs task loss

compression:
  pruning:
    method: magnitude
    sparsity: 0.3
  quantization:
    backend: qnnpack
    dtype: qint8
