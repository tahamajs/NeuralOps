model_name: "distilbert-base-uncased"
max_seq_len: 128
batch_size: 32
eval_batch_size: 64
learning_rates: [2e-5, 3e-5, 5e-5]
seeds: [42, 123, 777]
epochs:
  sst2: 3
  qnli: 3
  rte: 5
  mrpc: 5
  cola: 5
  stsb: 5
warmup_ratio: 0.1
weight_decay: 0.01
gradient_clip: 1.0
mixed_precision: "bf16"
profile_seq_lengths: [128, 256, 512]
profile_batch_sizes: [1, 32]
timeout_seconds: 1800
output_dir: "benchmark_output"
