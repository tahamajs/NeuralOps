[build-system]
requires = ["setuptools>=61.0", "wheel", "torch>=2.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralops-cuda"
version = "1.8.1"
description = "Hardware-accelerated CUDA extensions for NeuralOps deep learning optimization framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Taha Majlesi", email = "tahamaj4@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = [
    "torch>=2.2.0",
]

[tool.setuptools]
packages = ["neuralops"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
skip = "*-win32 *i686 *musllinux*"
build-verbosity = 1

[tool.cibuildwheel.linux]
before-all = "yum install -y cuda-toolkit || true"
environment = { TORCH_CUDA_ARCH_LIST = "8.0;8.6;8.9;9.0" }
