[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralops-cuda"
version = "2.0.6"
description = "Pre-compiled CUDA and Triton extensions for NeuralOps high-performance attention surgery"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{ name = "Taha Majlesi", email = "tahamaj4@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "neuralops>=2.0.6",
]

[project.urls]
Homepage = "https://github.com/tahamajs/NeuralOps"
Repository = "https://github.com/tahamajs/NeuralOps.git"
Documentation = "https://neuralops.readthedocs.io/"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuralops.ops.cuda*", "neuralops.ops.triton*"]

# Cibuildwheel configuration for automated Linux x86_64 wheel builds.
# Note (F-39): Binary wheels are currently not published on PyPI; runtime JIT
# compilation via torch.utils.cpp_extension is the primary build model.
# *aarch64* is skipped because Apple Silicon does not support CUDA and Linux ARM64
# GPU build runners are not active in the build matrix.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
skip = "*-musllinux* *i686* *ppc64le* *s390x* *aarch64*"
manylinux-x86_64-image = "manylinux2014"

[tool.cibuildwheel.linux]
before-all = "yum install -y which"
environment = { CUDA_HOME = "/usr/local/cuda", TORCH_CUDA_ARCH_LIST = "8.0;8.6;8.9;9.0" }
